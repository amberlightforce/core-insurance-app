# Override of infra/local/compose.yaml for the automated E2E-10 run. Used only through tests/e2e/run-e2e10.sh, which passes
# --project-directory infra/local (so every path below is relative to infra/local) and -p coreins-e2e10.
#
# - the image gets its own tag, so building it never retags a developer's "coreins-host:local";
# - env_file points at the E2E environment instead of infra/local/.env (which does not exist on a CI runner).
name: coreins-e2e10

services:
  bootstrap:
    image: coreins-host:e2e10
  migrate:
    image: coreins-host:e2e10
    env_file: !override
      - ../../tests/e2e/stack/e2e10.env
  api:
    image: coreins-host:e2e10
    env_file: !override
      - ../../tests/e2e/stack/e2e10.env
  worker:
    image: coreins-host:e2e10
    env_file: !override
      - ../../tests/e2e/stack/e2e10.env
