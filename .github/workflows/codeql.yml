name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Code scanning (GitHub Code Security) is not enabled on this private repository, so results are not uploaded to
    # GitHub. They are published as a SARIF artifact and the job fails on high/critical security findings (D-ARC-31).
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: sarif-results

      - name: Fail on high or critical security findings
        shell: python
        run: |
          import glob, json, sys
          blocking = []
          for path in glob.glob("sarif-results/*.sarif"):
              for run in json.load(open(path, encoding="utf-8"))["runs"]:
                  rules = {}
                  for component in [run["tool"]["driver"], *run["tool"].get("extensions", [])]:
                      for rule in component.get("rules", []):
                          rules[rule["id"]] = rule
                  for result in run.get("results", []):
                      rule = rules.get(result.get("ruleId"), {})
                      severity = float(rule.get("properties", {}).get("security-severity", 0) or 0)
                      if severity >= 7.0 and result.get("baselineState") != "absent":
                          location = result["locations"][0]["physicalLocation"]
                          blocking.append(f'{severity:4.1f} {result["ruleId"]} {location["artifactLocation"]["uri"]}:'
                                          f'{location.get("region", {}).get("startLine", "?")} {result["message"]["text"]}')
          print("
".join(blocking) or "No high or critical security findings.")
          sys.exit(1 if blocking else 0)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-${{ matrix.language }}
          path: sarif-results/
          retention-days: 30
