    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install the e2e dependencies
        working-directory: tests/e2e
        run: npm ci --no-audit

      - name: Run E2E-05
        run: tests/e2e/run-e2e05.sh

      # Playwright HTML report and traces (first-retry traces, so flaky tests that passed on retry are included), kept 7 days.
      - name: Upload the Playwright report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-e2e05
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
