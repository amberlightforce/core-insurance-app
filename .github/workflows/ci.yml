name: CI

# Docs-only changes skip CI (D-USR-17). Markdown under contracts/openapi (INDEX.md, spi.md) is a checked input of
# contracts/openapi/validate.py, so the Markdown patterns deliberately do not cover contracts/openapi. Pushes to main skip only
# orchestration/**.

on:
  pull_request:
    paths-ignore:
      - "orchestration/**"
      - "*.md"
      - "docs/**/*.md"
      - "infra/**/*.md"
      - "spikes/**/*.md"
      - "src/**/*.md"
      - "web/**/*.md"
      - "contracts/README.md"
  push:
    branches: [main]
    paths-ignore:
      - "orchestration/**"
  # Nightly full run on main (03:17 UTC). Besides every push, this is the slot where the slow E2E-07/08 journeys get a run with no
  # other pushes queued ahead of them, so a flake shows up in the morning rather than on someone's merge.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  CI: "true"

jobs:
  dotnet:
    name: .NET build, tests, SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore CoreIns.sln
          dotnet tool restore

      - name: Build (warnings are errors)
        run: dotnet build CoreIns.sln --configuration Release --no-restore

      - name: Generated contract code is current and deterministic (tools/CoreIns.ContractGen)
        run: dotnet run --project tools/CoreIns.ContractGen --configuration Release --no-build -- --check

      - name: Contract schemas and generated samples are valid
        run: |
          set -euo pipefail
          python3 -m pip install --quiet -r contracts/openapi/requirements.txt
          python3 contracts/events/validate.py --require-jsonschema --instance tests/CoreIns.Contracts.Tests/Generated/Samples/events/*.json
          python3 tools/CoreIns.ContractGen/validate_samples.py

      - name: Unit, analyser and architecture tests
        run: |
          set -euo pipefail
          for project in tests/*/*.csproj; do
            # CoreIns.Testing.Contracts is a test-support library (sandbox doubles), not a test project.
            case "$project" in *IntegrationTests*|*/CoreIns.Testing.*) continue ;; esac
            dotnet test --project "$project" --configuration Release --no-build
          done

      - name: Integration tests (Testcontainers PostgreSQL 17)
        run: dotnet test --project tests/CoreIns.IntegrationTests --configuration Release --no-build

      - name: SBOM (CycloneDX, .NET)
        run: >
          dotnet CycloneDX src/CoreIns.Host/CoreIns.Host.csproj --exclude-test-projects
          --output artifacts/sbom --filename dotnet.cdx.json --output-format Json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-dotnet
          path: artifacts/sbom/dotnet.cdx.json

  web:
    name: Web lint, typecheck, test, build, SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tests/e2e/package-lock.json

      - run: npm ci --no-audit
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Typecheck end-to-end tests
        working-directory: tests/e2e
        run: |
          npm ci --no-audit
          npm run typecheck

      - name: SBOM (CycloneDX, npm)
        run: npm run sbom

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-web
          path: artifacts/sbom/web.cdx.json

  infra:
    name: Bicep build, lint and Key Vault least-privilege guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install a pinned Bicep CLI
        run: az bicep install --version v0.48.1

      - name: Build and lint
        run: |
          mkdir -p artifacts
          az bicep build --file infra/azure/main.bicep --outfile artifacts/main.json
          az bicep lint --file infra/azure/main.bicep

      - name: Key Vault access is per secret and per workload
        run: python3 scripts/check-keyvault-rbac.py artifacts/main.json

  image:
    name: Container image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the single image (not pushed)
        run: docker build --tag coreins:ci .

      - name: Vulnerability scan (Trivy; fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: coreins:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  security:
    name: Security gates (secrets, vulnerable dependencies, IaC scan, dev-config guard)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history; the repository is public

      # Pinned image; allow-list for reviewed false positives lives in .gitleaks.toml (TODO(hardening): rotate and drop any entry).
      - name: Secret scan (gitleaks, full history)
        run: >
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.0
          git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose

      - name: Guard - deployable config stays out of dev mode
        run: python3 scripts/check-no-dev-config.py

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Vulnerable NuGet packages (direct and transitive)
        run: |
          set -euo pipefail
          dotnet restore CoreIns.sln
          dotnet list CoreIns.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          # `dotnet list` exits 0 even when it finds something, so fail on its report line.
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found (see above)."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Vulnerable npm packages (production dependencies)
        run: |
          set -euo pipefail
          (cd web && npm audit --omit=dev)
          (cd tests/e2e && npm audit --omit=dev)

      # Trivy has no Bicep parser, so scan the compiled ARM JSON next to the Dockerfile.
      # TODO(hardening): Trivy skips ARM language-version-2 templates silently; add a Bicep-aware linter rule set (az bicep lint) per finding class.
      - name: Compile Bicep for the IaC scan
        run: |
          set -euo pipefail
          az bicep install --version v0.48.1
          mkdir -p artifacts/iac-scan
          az bicep build --file infra/azure/main.bicep --outfile artifacts/iac-scan/main.json
          cp Dockerfile artifacts/iac-scan/Dockerfile

      - name: IaC and Dockerfile misconfiguration scan (Trivy; fails on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: config
          scan-ref: artifacts/iac-scan
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          exit-code: "1"
          format: table

