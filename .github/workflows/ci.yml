name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  CI: "true"

jobs:
  dotnet:
    name: .NET build, tests, SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore CoreIns.sln
          dotnet tool restore

      - name: Build (warnings are errors)
        run: dotnet build CoreIns.sln --configuration Release --no-restore

      - name: Unit, analyser and architecture tests
        run: |
          set -euo pipefail
          for project in tests/*/*.csproj; do
            case "$project" in *IntegrationTests*) continue ;; esac
            dotnet test --project "$project" --configuration Release --no-build
          done

      - name: Integration tests (Testcontainers PostgreSQL 17)
        run: dotnet test --project tests/CoreIns.IntegrationTests --configuration Release --no-build

      - name: SBOM (CycloneDX, .NET)
        run: >
          dotnet CycloneDX src/CoreIns.Host/CoreIns.Host.csproj --exclude-test-projects
          --output artifacts/sbom --filename dotnet.cdx.json --output-format Json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-dotnet
          path: artifacts/sbom/dotnet.cdx.json

  web:
    name: Web lint, typecheck, test, build, SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tests/e2e/package-lock.json

      - run: npm ci --no-audit
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Typecheck end-to-end tests
        working-directory: tests/e2e
        run: |
          npm ci --no-audit
          npm run typecheck

      - name: SBOM (CycloneDX, npm)
        run: npm run sbom

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-web
          path: artifacts/sbom/web.cdx.json

  image:
    name: Container image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the single image (not pushed)
        run: docker build --tag coreins:ci .

      - name: Vulnerability scan (Trivy; fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: coreins:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
