    post:
      operationId: pfc.ProductVersion.import
      summary: Import a product source document
      description: |-
        Import a product source document

        Slice operation (SL-PFC): the seed and, later, the authoring workflow load a product version through this path.
        PRD inputs: product source document, lock flag
        PRD outputs: product, version, artefact hash
      tags:
      - ProductVersion
      x-requirement:
      - REQ-PFC-031
      - REQ-PFC-032
      - REQ-PFC-162
      x-wave: W2
      x-work-packages:
      - W2-PFC-01
      - W2-PFC-04
      x-status: full
      x-maturity: pre-release
      x-typed: REQ-PFC-031, REQ-PFC-032, REQ-PFC-162
      x-operation-kind: command
      x-idempotency: required
      x-dry-run: false
      x-dry-run-note: Not supported in the slice
      x-exposure:
      - ui
      x-permission: pfc.ProductVersion.import
      x-error-codes:
      - code: PFC-ERR-INVALID-DEFINITION
        note: the document fails lint; field errors name each finding
        status: 422
      - code: PFC-ERR-VERSION-EXISTS
        note: the version exists with a different artefact (Locked versions are immutable, REQ-PFC-164)
        status: 409
      - code: PFC-ERR-WINDOW-OVERLAP
        note: another Locked version of the product has an intersecting new-business window (BR-PFC-001)
        status: 409
      - code: PFC-ERR-IDEMPOTENCY-MISMATCH
        note: contract §3.5.3 (replay with a different payload)
        status: 409
      x-source:
      - PRD-02 §3.3, §7.5
