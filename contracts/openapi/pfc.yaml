        same document, hand-authored, is the product source the import path accepts (the seed and, later, the authoring
        workflow). The slice carries the policy line, elements, coverages, question sets, charge types and references; the
        rest of the PRD-02 hierarchy arrives with its work packages.'
      properties:
        schemaVersion:
          type: integer
          description: Product schema version (1)
        productLine:
          $ref: '#/components/schemas/ProductLineDef'
        product:
          $ref: '#/components/schemas/ProductHeader'
        legalEntity:
          $ref: ../events/common.schema.json#/$defs/Code
        jurisdiction:
          $ref: ../events/common.schema.json#/$defs/CountryCode
        version:
          $ref: ../events/common.schema.json#/$defs/ProductVersionNumber
        isAbstract:
          type: boolean
        channels:
          type: array
          items:
            $ref: ../events/common.schema.json#/$defs/Code
        contractCurrency:
          $ref: ../events/common.schema.json#/$defs/CurrencyCode
        languages:
          type: array
          items:
            $ref: ../events/common.schema.json#/$defs/LanguageCode
        terms:
          $ref: '#/components/schemas/ProductTerms'
        offeringRequired:
          type: boolean
        dayCount:
          $ref: ../events/common.schema.json#/$defs/Code
        windows:
          $ref: '#/components/schemas/ProductWindows'
        elements:
          type: array
          items:
            $ref: '#/components/schemas/CatalogueElement'
        coverages:
          type: array
          items:
            $ref: '#/components/schemas/CatalogueCoverage'
        questionSets:
          type: array
          items:
            $ref: '#/components/schemas/QuestionSetDef'
        chargeTypes:
          type: array
          items:
            $ref: '#/components/schemas/ChargeTypeListItem'
        references:
          $ref: '#/components/schemas/ProductReferences'
      required:
      - schemaVersion
      - productLine
      - product
      - legalEntity
      - jurisdiction
      - version
      - isAbstract
      - channels
      - contractCurrency
      - languages
      - terms
      - offeringRequired
      - windows
      - elements
      - coverages
      - questionSets
      - chargeTypes
      - references
    ProductVersionImportRequest:
