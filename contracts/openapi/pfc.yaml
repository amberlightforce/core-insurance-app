          items:
            $ref: ../events/common.schema.json#/$defs/Code
        vehicleReplacement:
          type: boolean
          description: True when the insured vehicle may be replaced mid-term.
      required:
      - editableVehicleFields
      - vehicleReplacement
    ProductWindows:
      type: object
      description: New-business and renewal windows of a version (REQ-PFC-166); half-open, `to` null when open.
      properties:
        newBusiness:
          $ref: ../events/common.schema.json#/$defs/DatePeriod
        renewal:
          $ref: ../events/common.schema.json#/$defs/DatePeriod
      required:
      - newBusiness
      - renewal
    ProductTerms:
      type: object
      properties:
        allowed:
          type: array
          items:
            $ref: ../events/common.schema.json#/$defs/Duration
        default:
          $ref: ../events/common.schema.json#/$defs/Duration
      required:
      - allowed
      - default
    UwRuleSetReference:
      type: object
      properties:
        code:
          $ref: ../events/common.schema.json#/$defs/Code
        range:
          $ref: ../events/common.schema.json#/$defs/Text
      required:
      - code
      - range
    ProductReferences:
      type: object
