components:
  securitySchemes:
    entra:
      $ref: common.yaml#/components/securitySchemes/entra
  schemas:
    ProductVersionResolveRequest:
      type: object
      properties:
        jurisdiction:
          $ref: ../events/common.schema.json#/$defs/CountryCode
        legalEntity:
          $ref: ../events/common.schema.json#/$defs/Code
        product:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Product code
        channel:
          $ref: ../events/common.schema.json#/$defs/Code
        transactionType:
          type: string
          enum:
          - NewBusiness
          - Renewal
          description: PRD-02 §9.1 row values
        predecessorHash:
          $ref: ../events/common.schema.json#/$defs/Sha256
          description: 'Renewal: predecessor''s artefact hash (REQ-PFC-167)'
      required:
      - jurisdiction
      - legalEntity
      - product
      - channel
      - transactionType
      description: 'Typed from REQ-PFC-001, REQ-PFC-167, REQ-PFC-221. PRD inputs: "jurisdiction, legalEntity, product, channel,
        transactionType (NewBusiness, Renewal), date, optional knownAt, optional predecessorHash (renewal)"'
    ProductVersionResolveResponse:
      type: object
      properties:
        version:
          $ref: ../events/common.schema.json#/$defs/ProductVersionNumber
        artefactHash:
          $ref: ../events/common.schema.json#/$defs/Sha256
        resolutionManifest:
          type: object
          properties:
            artefactHash:
              $ref: ../events/common.schema.json#/$defs/Sha256
            ratingArtefactHash:
              $ref: ../events/common.schema.json#/$defs/Sha256
              description: Floating at resolution, pinned for the term (REQ-PFC-221)
            uwRuleSetVersions:
              type: object
              additionalProperties:
                $ref: ../events/common.schema.json#/$defs/Code
              description: Rule-set version per checkpoint
            formPatternEditions:
              type: array
              items:
                $ref: ../events/common.schema.json#/$defs/Code
            referenceTableVersions:
              type: array
              items:
                $ref: ../events/common.schema.json#/$defs/Code
            paymentPlanVersions:
              type: array
              items:
                $ref: ../events/common.schema.json#/$defs/Code
          required:
          - artefactHash
          description: Resolution manifest (REQ-PFC-221)
        resolutionHash:
          $ref: ../events/common.schema.json#/$defs/Sha256
      required:
      - version
      - artefactHash
      - resolutionManifest
      - resolutionHash
      description: 'Typed from REQ-PFC-001, REQ-PFC-167, REQ-PFC-221. PRD outputs: "version, artefactHash, resolutionManifest,
        resolutionHash"'
    ArtifactGetResponse:
      type: object
      description: 'pfc.Artifact.get result. PRD outputs: "canonical JSON artefact"'
      properties:
        canonicalJsonArtefact:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "canonical JSON artefact"'
    CatalogueGetResponse:
