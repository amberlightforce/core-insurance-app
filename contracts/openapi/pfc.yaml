      properties:
        rating:
          $ref: ../events/common.schema.json#/$defs/RatingSlotDeclaration
        uwRuleSets:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/UwRuleSetReference'
          description: Checkpoint (PRE_QUOTE, PRE_BIND) to rule-set reference
        paymentPlans:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: ../events/common.schema.json#/$defs/Code
          description: Channel to the payment-plan codes offered (REQ-PFC-133)
      required:
      - rating
    ProductArtefact:
      type: object
      description: 'The compiled product version (PRD-02 §7.6): the canonical JSON whose SHA-256 is the artefact hash. The
        same document, hand-authored, is the product source the import path accepts (the seed and, later, the authoring
        workflow). The slice carries the policy line, elements, coverages, question sets, charge types and references; the
        rest of the PRD-02 hierarchy arrives with its work packages.'
      properties:
        schemaVersion:
          type: integer
          description: Product schema version (1)
        productLine:
          $ref: '#/components/schemas/ProductLineDef'
        product:
          $ref: '#/components/schemas/ProductHeader'
        legalEntity:
          $ref: ../events/common.schema.json#/$defs/Code
        jurisdiction:
          $ref: ../events/common.schema.json#/$defs/CountryCode
        version:
          $ref: ../events/common.schema.json#/$defs/ProductVersionNumber
        isAbstract:
          type: boolean
        channels:
          type: array
          items:
            $ref: ../events/common.schema.json#/$defs/Code
        contractCurrency:
          $ref: ../events/common.schema.json#/$defs/CurrencyCode
        languages:
          type: array
          items:
            $ref: ../events/common.schema.json#/$defs/LanguageCode
        terms:
          $ref: '#/components/schemas/ProductTerms'
        offeringRequired:
          type: boolean
        dayCount:
          $ref: ../events/common.schema.json#/$defs/Code
        dayCountProvisional:
          type: boolean
          description: True when the day-count convention is a recommendation awaiting confirmation, not an approved value
            (REQ-PFC-135, D-SL3-04). Absent means not provisional.
        dayCountNote:
          $ref: ../events/common.schema.json#/$defs/Text
          description: Why the day count is provisional and who must confirm it.
        refundMethods:
          type: array
          description: Refund method per cancellation source (REQ-PFC-134, subset). A source with no entry has no refund
            method, so POL refuses a cancellation from it (fail closed).
          items:
            $ref: '#/components/schemas/RefundMethodDef'
        changePermissions:
          $ref: '#/components/schemas/ChangePermissions'
        windows:
          $ref: '#/components/schemas/ProductWindows'
        elements:
          type: array
          items:
            $ref: '#/components/schemas/CatalogueElement'
        coverages:
          type: array
          items:
            $ref: '#/components/schemas/CatalogueCoverage'
        questionSets:
          type: array
          items:
            $ref: '#/components/schemas/QuestionSetDef'
        chargeTypes:
          type: array
          items:
            $ref: '#/components/schemas/ChargeTypeListItem'
        references:
          $ref: '#/components/schemas/ProductReferences'
      required:
      - schemaVersion
      - productLine
      - product
      - legalEntity
      - jurisdiction
      - version
      - isAbstract
      - channels
      - contractCurrency
      - languages
      - terms
      - offeringRequired
      - windows
      - elements
      - coverages
      - questionSets
      - chargeTypes
      - references
    ProductVersionImportRequest:
      type: object
      description: 'pfc.ProductVersion.import request: a product source document. The import validates and compiles it
        (canonical JSON, SHA-256), stores the product, version and artefact, and, with `lock`, takes the version through
        Submitted and Approved to Locked in one step (the seed path; the approval workflow replaces `lock` later).'
      properties:
        definition:
          $ref: '#/components/schemas/ProductArtefact'
        lock:
          type: boolean
          description: Publish the version (Locked) in the same call
      required:
      - definition
      - lock
    ProductVersionImportResponse:
      type: object
      properties:
        product:
          $ref: ../events/common.schema.json#/$defs/Code
        version:
          $ref: ../events/common.schema.json#/$defs/ProductVersionNumber
        artefactHash:
          $ref: ../events/common.schema.json#/$defs/Sha256
        status:
          type: string
          enum:
          - DRAFT
          - LOCKED
        created:
          type: boolean
          description: False when the same version with the same artefact already existed (idempotent import)
      required:
      - product
      - version
      - artefactHash
      - status
      - created
    ProductListVersion:
      type: object
      description: One version of a product in the catalogue list (windows are business dates; null means open-ended).
      properties:
        version:
          $ref: ../events/common.schema.json#/$defs/ProductVersionNumber
        status:
          type: string
          description: Version status (for example LOCKED).
        isAbstract:
          type: boolean
        channels:
          type: array
          items:
            $ref: ../events/common.schema.json#/$defs/Code
        contractCurrency:
          $ref: ../events/common.schema.json#/$defs/CurrencyCode
        newBusinessFrom:
          type: string
          format: date
        newBusinessTo:
          type: [string, 'null']
          format: date
        renewalFrom:
          type: string
          format: date
        renewalTo:
          type: [string, 'null']
          format: date
        artefactHash:
          $ref: ../events/common.schema.json#/$defs/Sha256
        fallbackOfVersion:
