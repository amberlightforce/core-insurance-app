    PogRecordTestRequest:
      type: object
      description: 'pfc.Pog.recordTest request. PRD inputs: "record data"'
      x-status: minimal
    PogRecordTestResponse:
      type: object
      description: 'pfc.Pog.recordTest result. PRD outputs: "record"'
      properties:
        record:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "record"'
    ProductImportImportRequest:
      type: object
      description: 'pfc.ProductImport.import request. PRD inputs: "legacy definition, mapping"'
      properties:
        legacyDefinition:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "legacy definition"'
        mapping:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "mapping"'
    ProductImportImportResponse:
      type: object
      description: 'pfc.ProductImport.import result. PRD outputs: "change set or dry-run lint report"'
      properties:
        changeSetOrDryRunLint:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "change set or dry-run lint report"'
    LegacyXrefGetResponse:
      type: object
      description: 'pfc.LegacyXref.get result. PRD outputs: "core codes"'
      properties:
        coreCodes:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "core codes"'
    ReferenceTableGetResponse:
      type: object
      description: 'pfc.ReferenceTable.get result. PRD outputs: "rows"'
      properties:
        rows:
          type: array
          items:
            $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "rows"'
    FallbackSource:
      type: object
      description: The version whose content the fall-back copies
      properties:
        version:
          $ref: ../events/common.schema.json#/$defs/ProductVersionNumber
        artefactHash:
          $ref: ../events/common.schema.json#/$defs/Sha256
          description: Artefact hash of the source version; the new version carries the same hash (RAT activates the same artefact, D-SL5-09)
      required:
      - version
      - artefactHash
    FallbackPreview:
      type: object
      description: Dry-run preview of an emergency fall-back. Nothing is created. Every field is always set.
      properties:
        newVersion:
          $ref: ../events/common.schema.json#/$defs/ProductVersionNumber
          description: The next free minor version (write-once copy)
        source:
          $ref: '#/components/schemas/FallbackSource'
        newBusinessWindow:
          $ref: ../events/common.schema.json#/$defs/TimeWindow
          description: New-business window of the new version, from the fall-back date
        closedWindow:
          $ref: ../events/common.schema.json#/$defs/TimeWindow
          description: New-business window of the defective version as it will stand after the fall-back, ending at the fall-back date
      required:
      - newVersion
      - source
      - newBusinessWindow
      - closedWindow
    FallbackStatus:
      type: string
      enum:
      - PENDING_APPROVAL
      - APPLIED
      - REJECTED
    FallbackView:
      type: object
      description: One emergency fall-back. Every field is always set; the nullable ones are null until known.
      properties:
        fallbackId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        productCode:
          $ref: ../events/common.schema.json#/$defs/Code
        defectiveVersion:
          $ref: ../events/common.schema.json#/$defs/ProductVersionNumber
        newVersion:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/ProductVersionNumber
          - type: 'null'
          description: The version written; null until APPLIED
        status:
          $ref: '#/components/schemas/FallbackStatus'
        reason:
          type: string
          description: The maker's reason (20 to 128 characters)
        requestedBy:
          $ref: ../events/common.schema.json#/$defs/Text
        decidedBy:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Text
          - type: 'null'
        approvalRequestId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        decidedAt:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Instant
          - type: 'null'
      required:
      - fallbackId
      - productCode
      - defectiveVersion
      - newVersion
      - status
      - reason
      - requestedBy
      - decidedBy
      - approvalRequestId
      - decidedAt
    ProductVersionEmergencyFallbackRequest:
      type: object
      description: pfc.ProductVersion.fallback request (REQ-PFC-213, D-SL5-09)
      properties:
        productCode:
          $ref: ../events/common.schema.json#/$defs/Code
        defectiveVersion:
          $ref: ../events/common.schema.json#/$defs/ProductVersionNumber
        reason:
          type: string
          minLength: 20
          maxLength: 128
          description: Why the version is defective (20 to 128 characters). No personal data.
      required:
      - productCode
      - defectiveVersion
      - reason
    ProductVersionEmergencyFallbackResponse:
      type: object
      description: 'pfc.ProductVersion.fallback result: the preview on a dry run, otherwise the PENDING_APPROVAL fall-back'
      properties:
        dryRun:
          type: boolean
        preview:
          oneOf:
          - $ref: '#/components/schemas/FallbackPreview'
          - type: 'null'
          description: Always set on a dry run, null otherwise
        fallbackId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: Null on a dry run
        status:
          oneOf:
          - $ref: '#/components/schemas/FallbackStatus'
          - type: 'null'
          description: PENDING_APPROVAL for a real call; null on a dry run
        approvalRequestId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: In-process PLT approval request (type PFC.Fallback, authority PFC.EmergencyChange); null on a dry run
      required:
      - dryRun
      - preview
      - fallbackId
      - status
      - approvalRequestId
    ProductVersionDecideFallbackRequest:
      type: object
      description: pfc.ProductVersion.decideFallback request
      properties:
        fallbackId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
        reason:
          type: string
          minLength: 1
          maxLength: 128
          description: Reason of the checker (required for REJECT). No personal data.
      required:
      - fallbackId
      - decision
      - reason
    ProductVersionDecideFallbackResponse:
      type: object
      properties:
        fallback:
          $ref: '#/components/schemas/FallbackView'
      required:
      - fallback
