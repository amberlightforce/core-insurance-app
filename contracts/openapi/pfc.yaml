        changeSetState:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "change set state"'
        validation:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "validation"'
    ChangeSetAbandonRequest:
      type: object
      description: pfc.ChangeSet.abandon request (BO-PFC-01)
      properties:
        changeSetId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        recordVersion:
          type: integer
          minimum: 1
      required:
      - changeSetId
      - recordVersion
    ChangeSetAbandonResponse:
      type: object
      description: 'pfc.ChangeSet.abandon result'
      properties:
        changeSetState:
          $ref: '#/components/schemas/ChangeSetState'
        validation:
          $ref: '#/components/schemas/ChangeSetValidation'
      required:
      - changeSetState
      - validation
    ProductVersionSubmitRequest:
      type: object
      description: pfc.ProductVersion.submit request (BO-PFC-04). Submits an open change set for sign-off.
      properties:
        changeSetId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        recordVersion:
          type: integer
          minimum: 1
          description: The change-set record version the submitter saw (optimistic concurrency)
      required:
      - changeSetId
      - recordVersion
    ProductVersionSubmitResponse:
      type: object
      description: 'pfc.ProductVersion.submit result: the change set (SUBMITTED on a real call), the lint result and the release request. On a dry run only the checks run and nothing is stored.'
      properties:
        dryRun:
          type: boolean
        changeSetState:
          $ref: '#/components/schemas/ChangeSetState'
        validation:
          $ref: '#/components/schemas/ChangeSetValidation'
        version:
          $ref: ../events/common.schema.json#/$defs/ProductVersionNumber
          description: The version number the draft will carry when released
        releaseId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: Null on a dry run
        approvalRequestId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: In-process PLT approval request (type PFC.Release, authority PFC.RELEASE); null on a dry run
      required:
      - dryRun
      - changeSetState
      - validation
      - version
      - releaseId
      - approvalRequestId
    ProductVersionSignOffRequest:
      type: object
      description: pfc.ProductVersion.signOff request (BO-PFC-04). The checker approves or returns a submitted change set.
      properties:
        changeSetId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        decision:
          type: string
          enum:
          - APPROVE
          - RETURN
        comment:
          type: string
          minLength: 1
          maxLength: 500
          description: Why (required for both decisions; a returned draft shows it to the author)
      required:
      - changeSetId
      - decision
      - comment
    ProductVersionSignOffResponse:
      type: object
      description: 'pfc.ProductVersion.signOff result: the approval state and the change set (SUBMITTED when approved, OPEN again when returned)'
      properties:
        approvalState:
          type: string
          enum:
          - APPROVED
          - RETURNED
        changeSetState:
          $ref: '#/components/schemas/ChangeSetState'
        releaseId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        version:
          $ref: ../events/common.schema.json#/$defs/ProductVersionNumber
      required:
      - approvalState
      - changeSetState
      - releaseId
      - version
    ProductVersionScheduleRequest:
      type: object
      description: pfc.ProductVersion.schedule request (BO-PFC-04). Sets the windows of an approved change set; the version is locked and published on the activation date.
      properties:
        changeSetId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        activationDate:
          type: string
          format: date
          description: Start of the new-business window (Athens business date). Today releases at once; a later date is scheduled.
        newBusinessTo:
          type: [string, 'null']
          format: date
          description: End of the new-business window; null or absent for open
        renewalFrom:
          type: [string, 'null']
          format: date
          description: Start of the renewal window; defaults to the activation date
        renewalTo:
          type: [string, 'null']
          format: date
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - changeSetId
      - activationDate
      - reason
    ProductVersionScheduleResponse:
      type: object
      description: 'pfc.ProductVersion.schedule result. On a dry run the windows are validated and nothing is stored.'
      properties:
        dryRun:
          type: boolean
        schedule:
          $ref: '#/components/schemas/ReleaseSchedule'
      required:
      - dryRun
      - schedule
    ReleaseSchedule:
      type: object
      description: The release of a version and its windows
      properties:
        releaseId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: Null on a dry run
        productCode:
          $ref: ../events/common.schema.json#/$defs/Code
        version:
          $ref: ../events/common.schema.json#/$defs/ProductVersionNumber
        status:
          type: string
          enum:
          - SCHEDULED
          - PUBLISHED
          - CANCELLED
        activationDate:
          type: string
          format: date
        newBusinessFrom:
          type: string
          format: date
        newBusinessTo:
          type: [string, 'null']
          format: date
        renewalFrom:
          type: string
          format: date
        renewalTo:
          type: [string, 'null']
          format: date
      required:
      - releaseId
      - productCode
      - version
      - status
      - activationDate
      - newBusinessFrom
      - newBusinessTo
      - renewalFrom
      - renewalTo
    ProductVersionCancelScheduleRequest:
      type: object
      description: pfc.ProductVersion.cancelSchedule request (BO-PFC-04). Cancels a scheduled release that has not yet been published.
      properties:
        changeSetId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - changeSetId
      - reason
    ProductVersionCancelScheduleResponse:
      type: object
      description: 'pfc.ProductVersion.cancelSchedule result: the cancelled schedule; the approved change set can be scheduled again'
      properties:
        schedule:
          $ref: '#/components/schemas/ReleaseSchedule'
      required:
      - schedule
    ProductVersionDiffResponse:
      type: object
      description: 'pfc.ProductVersion.diff result. PRD outputs: "grouped entries with classes"'
      properties:
        groupedEntriesClasses:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "grouped entries with classes"'
    ImpactAnalysisRunRequest:
      type: object
      description: 'pfc.ImpactAnalysis.run request. PRD inputs: "version"'
      properties:
        version:
          $ref: common.yaml#/components/schemas/Unspecified
