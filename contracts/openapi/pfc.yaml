components:
  securitySchemes:
    entra:
      $ref: common.yaml#/components/securitySchemes/entra
  schemas:
    ProductVersionResolveRequest:
      type: object
      properties:
        jurisdiction:
          $ref: ../events/common.schema.json#/$defs/CountryCode
        legalEntity:
          $ref: ../events/common.schema.json#/$defs/Code
        product:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Product code
        channel:
          $ref: ../events/common.schema.json#/$defs/Code
        transactionType:
          type: string
          enum:
          - NewBusiness
          - Renewal
          description: PRD-02 §9.1 row values
        predecessorHash:
          $ref: ../events/common.schema.json#/$defs/Sha256
          description: 'Renewal: predecessor''s artefact hash (REQ-PFC-167)'
      required:
      - jurisdiction
      - legalEntity
      - product
      - channel
      - transactionType
      description: 'Typed from REQ-PFC-001, REQ-PFC-167, REQ-PFC-221. PRD inputs: "jurisdiction, legalEntity, product, channel,
        transactionType (NewBusiness, Renewal), date, optional knownAt, optional predecessorHash (renewal)"'
    ProductVersionResolveResponse:
      type: object
      properties:
        version:
          $ref: ../events/common.schema.json#/$defs/ProductVersionNumber
        artefactHash:
          $ref: ../events/common.schema.json#/$defs/Sha256
        resolutionManifest:
          type: object
          properties:
            artefactHash:
              $ref: ../events/common.schema.json#/$defs/Sha256
            ratingArtefactHash:
              $ref: ../events/common.schema.json#/$defs/Sha256
              description: Floating at resolution, pinned for the term (REQ-PFC-221)
            uwRuleSetVersions:
              type: object
              additionalProperties:
                $ref: ../events/common.schema.json#/$defs/Code
              description: Rule-set version per checkpoint
            formPatternEditions:
              type: array
              items:
                $ref: ../events/common.schema.json#/$defs/Code
            referenceTableVersions:
              type: array
              items:
                $ref: ../events/common.schema.json#/$defs/Code
            paymentPlanVersions:
              type: array
              items:
                $ref: ../events/common.schema.json#/$defs/Code
          required:
          - artefactHash
          description: Resolution manifest (REQ-PFC-221)
        resolutionHash:
          $ref: ../events/common.schema.json#/$defs/Sha256
      required:
      - version
      - artefactHash
      - resolutionManifest
      - resolutionHash
      description: 'Typed from REQ-PFC-001, REQ-PFC-167, REQ-PFC-221. PRD outputs: "version, artefactHash, resolutionManifest,
        resolutionHash"'
    ArtifactGetResponse:
      type: object
      description: 'pfc.Artifact.get result. PRD outputs: "canonical JSON artefact"'
      properties:
        canonicalJsonArtefact:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "canonical JSON artefact"'
    LocalizedText:
      type: object
      description: Greek and English text; the Greek text is the binding master (REQ-PFC-058).
      properties:
        el:
          $ref: ../events/common.schema.json#/$defs/Text
        en:
          $ref: ../events/common.schema.json#/$defs/Text
      required:
      - el
      - en
    ConfigLegalStatus:
      type: string
      enum:
      - SETTLED
      - UNVERIFIED
      - DRAFT
      description: 'Legal status of a regulatory value (D-REG-01): only SETTLED values may reach production.'
    CoverageExistence:
      type: string
      enum:
      - REQUIRED
      - ELECTABLE
      - SUGGESTED
      description: Whether a coverage is compulsory, optional, or optional and pre-selected (REQ-PFC-069).
    CoverageRemoval:
      type: string
      enum:
      - BLOCK
      - ALLOWED
      description: Removal rule of a coverage (REQ-PFC-071); BLOCK refuses removal with PFC-VAL-REMOVAL-BLOCKED.
    CoveredParty:
      type: string
      enum:
      - FIRST_PARTY
      - THIRD_PARTY
    TermKind:
      type: string
      enum:
      - OPTION_LIST
      - RANGE
      - DIRECT
      - BOOLEAN
      - ENUMERATION
      description: Coverage-term kind (REQ-PFC-073).
    TermValueType:
      type: string
      enum:
      - MONEY
      - PERCENTAGE
      - COUNT
      - DAYS
      - HOURS
      - OTHER
      description: Value type of a term (REQ-PFC-075).
    TermModelType:
      type: string
      enum:
      - LIMIT
      - SUB_LIMIT
      - DEDUCTIBLE
      - SUM_INSURED
      - BENEFIT
      - WAITING_PERIOD
      - INDEMNITY_PERIOD
      - CO_INSURANCE
      description: Term semantics (REQ-PFC-076).
    AggregationBasis:
      type: string
      enum:
      - PER_INJURED_PERSON
      - PER_ACCIDENT
      - PER_CLAIM
      - AGGREGATE_PER_TERM
      - PER_ITEM
      description: Basis on which a limit aggregates (REQ-PFC-076).
    FinalBinding:
      type: object
      description: 'Binding of a term to a final MKT configuration key (REQ-PFC-085). The product holds the KEY, never the statutory
        value; `valueAtEffectiveDate` is filled from MKT once the configuration resolver is bound (null until then).'
      properties:
        key:
          $ref: ../events/common.schema.json#/$defs/Text
          description: MKT configuration key, for example gr.mtpl.min_bi_per_person
        layer:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Configuration layer holding the final, for example COUNTRY
        legalStatus:
          $ref: '#/components/schemas/ConfigLegalStatus'
        source:
          $ref: ../events/common.schema.json#/$defs/Text
          description: PRD requirement or legal source citation (D-REG-01)
        valueAtEffectiveDate:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Decimal
          - type: 'null'
      required:
      - key
      - layer
      - legalStatus
      - source
    TermOption:
      type: object
      properties:
        code:
          $ref: ../events/common.schema.json#/$defs/Code
        value:
          $ref: ../events/common.schema.json#/$defs/Decimal
        currency:
          $ref: ../events/common.schema.json#/$defs/CurrencyCode
        name:
          $ref: '#/components/schemas/LocalizedText'
        illustrative:
          type: boolean
          description: True when the option is test data, not an approved commercial value (D-SLC-04).
        source:
          $ref: ../events/common.schema.json#/$defs/Text
          description: Where the value comes from (PRD reference), when it is a stated value
      required:
      - code
      - value
      - name
    TermRange:
      type: object
      properties:
        minimum:
          $ref: ../events/common.schema.json#/$defs/Decimal
        maximum:
          $ref: ../events/common.schema.json#/$defs/Decimal
        step:
          $ref: ../events/common.schema.json#/$defs/Decimal
        default:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Decimal
