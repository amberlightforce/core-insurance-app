components:
  securitySchemes:
    entra:
      $ref: common.yaml#/components/securitySchemes/entra
  schemas:
    SubmissionCreateRequest:
      type: object
      properties:
        accountId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: PTY account. Optional until pty.Account is built (SL-POL); the policyholder party is then the reference
        policyholderPartyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: PTY party of the policyholder (PrimaryNamedInsured, REQ-POL-288); checked through pty.Party.get
        product:
          $ref: ../events/common.schema.json#/$defs/Code
        producerCode:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Producer of record; checked through pty.ProducerCode.validate (REQ-POL-174). Absent for direct business
        channel:
          $ref: ../events/common.schema.json#/$defs/Code
          description: R-84 channel code (e.g. STAFF, WEB_DIRECT, BROKER_PORTAL, PARTNER_API, AI_AGENT)
        effectiveAt:
          $ref: ../events/common.schema.json#/$defs/Instant
          description: Requested term start; never before now for new business (REQ-POL-137)
        quoteType:
          type: string
          enum:
          - QUICK
          - FULL
          description: Quick or full quote (REQ-POL-011)
        currency:
          $ref: ../events/common.schema.json#/$defs/CurrencyCode
          description: Term currency; defaults to the stamp's configured currency
      required:
      - policyholderPartyId
      - product
      - channel
      - effectiveAt
      - quoteType
      description: 'Typed from REQ-POL-001, REQ-POL-145. PRD inputs: "accountId, product, producerCode, channel, effectiveAt,
        quoteType". SL-POL: the term is annual (REQ-POL-040 subset).'
    SubmissionCreateResponse:
      type: object
      properties:
        jobId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        jobNumber:
          $ref: ../events/common.schema.json#/$defs/BusinessNumber
          description: Job (quote) number from PLT numbering (REQ-POL-047)
        policyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: Policy id reserved for the submission (event ordering key); the policy exists once bound
        state:
          $ref: '#/components/schemas/JobStateCode'
        productVersion:
          $ref: ../events/common.schema.json#/$defs/ProductVersionNumber
        expirationAt:
          $ref: ../events/common.schema.json#/$defs/Instant
          description: Term end (exclusive)
        describeModel:
          $ref: ../events/common.schema.json#/$defs/OpenObject
          description: pfc.Product.describe model
        versionNo:
          type: integer
          description: Quote version number
          minimum: 1
        manifest:
          type: object
          properties:
            artefactHash:
              $ref: ../events/common.schema.json#/$defs/Sha256
            ratingArtefactHash:
              $ref: ../events/common.schema.json#/$defs/Sha256
              description: Floating at resolution, pinned for the term (REQ-PFC-221)
            uwRuleSetVersions:
              type: object
              additionalProperties:
                $ref: ../events/common.schema.json#/$defs/Code
              description: Rule-set version per checkpoint
            formPatternEditions:
              type: array
              items:
                $ref: ../events/common.schema.json#/$defs/Code
            referenceTableVersions:
              type: array
              items:
                $ref: ../events/common.schema.json#/$defs/Code
            paymentPlanVersions:
              type: array
              items:
                $ref: ../events/common.schema.json#/$defs/Code
          required:
          - artefactHash
          description: Resolution manifest (REQ-PFC-221)
      required:
      - jobId
      - jobNumber
      - policyId
      - state
      - productVersion
      - expirationAt
      - versionNo
      - manifest
      description: 'Typed from REQ-POL-001, REQ-POL-145. PRD outputs: "jobId, describe model, version, manifest"'
    JobStateCode:
      type: string
      enum:
      - DRAFT
      - QUOTED
      - BOUND
      - SCHEDULED
      - RESCINDED
      - WITHDRAWN
      - DECLINED
      - NOT_TAKEN
      - EXPIRED
      description: Job state (contract §3.2.4, D-CON-08b)
    Vehicle:
      type: object
      properties:
        locator:
          $ref: ../events/common.schema.json#/$defs/Text
          description: Static locator (UUIDv7, REQ-POL-036); assigned by POL when absent
        plate:
          $ref: ../events/common.schema.json#/$defs/Text
          description: Registration plate as entered
        plateNormalised:
          $ref: ../events/common.schema.json#/$defs/Text
          description: Plate normalised by IdValidator VEHICLE_PLATE (REQ-POL-279); output only
        vin:
          $ref: ../events/common.schema.json#/$defs/Text
        make:
          $ref: ../events/common.schema.json#/$defs/Text
        model:
          $ref: ../events/common.schema.json#/$defs/Text
        firstRegistrationYear:
          type: integer
          minimum: 1900
          maximum: 2200
        engineCapacityCc:
          type: integer
          minimum: 1
          maximum: 20000
          description: Engine capacity (PFC vehicle field; a rating input)
        use:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Vehicle use code from the PFC vehicle element
        value:
          $ref: ../events/common.schema.json#/$defs/Money
        fields:
          $ref: ../events/common.schema.json#/$defs/OpenObject
          description: Further PFC vehicle element fields (REQ-POL-277, REQ-POL-299)
      required:
      - plate
      description: Vehicle element of the risk tree (REQ-POL-277)
    Driver:
      type: object
      properties:
        locator:
          $ref: ../events/common.schema.json#/$defs/Text
          description: Static locator (UUIDv7, REQ-POL-036); assigned by POL when absent
        partyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: PTY person of the driver (REQ-POL-280)
        driverType:
          type: string
          enum:
          - MAIN
          - OCCASIONAL
          - EXCLUDED
          description: Excluded drivers are named persons not covered (REQ-POL-283)
        yearFirstLicensed:
          type: integer
          minimum: 1900
          maximum: 2200
        vehicleLocator:
          $ref: ../events/common.schema.json#/$defs/Text
          description: Vehicle the driver is assigned to (REQ-POL-282)
        usagePercent:
          type: integer
          minimum: 0
          maximum: 100
        claimsLast5Years:
          type: integer
          minimum: 0
          maximum: 50
          description: At-fault claims in the last five years (PFC driver field, question Q-CLAIMS-5Y)
        fields:
          $ref: ../events/common.schema.json#/$defs/OpenObject
          description: Further PFC driver element fields (REQ-POL-299); gender is never captured
      required:
      - partyId
      - driverType
      description: PolicyDriver element of the risk tree (REQ-POL-280)
    CoverageSelection:
      type: object
      properties:
        coverageCode:
          $ref: ../events/common.schema.json#/$defs/Code
        elementLocator:
          $ref: ../events/common.schema.json#/$defs/Text
          description: Element the coverage attaches to (a vehicle locator); absent for policy-level coverages
        selected:
          type: boolean
        options:
          $ref: ../events/common.schema.json#/$defs/OpenObject
          description: Coverage terms and options from the PFC catalogue (REQ-POL-292)
      required:
      - coverageCode
      - selected
      description: A coverage selection (REQ-POL-292)
    QuestionAnswers:
      type: object
      properties:
        questionSetCode:
          $ref: ../events/common.schema.json#/$defs/Code
        questionSetVersion:
          $ref: ../events/common.schema.json#/$defs/Text
        answers:
          $ref: ../events/common.schema.json#/$defs/OpenObject
      required:
      - questionSetCode
      - answers
      description: Answered question set stored on the quote version (REQ-POL-149)
    RiskTree:
      type: object
      properties:
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
        drivers:
          type: array
          items:
            $ref: '#/components/schemas/Driver'
        coverages:
          type: array
          items:
            $ref: '#/components/schemas/CoverageSelection'
        questionSets:
          type: array
          items:
            $ref: '#/components/schemas/QuestionAnswers'
      required:
      - vehicles
      - drivers
      - coverages
      - questionSets
