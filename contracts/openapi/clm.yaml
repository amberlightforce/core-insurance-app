    TransactionSetBuildRequest:
      type: object
      properties:
        claimId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        transactions:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                - RESERVE
                - PAYMENT
                - RECOVERY_RESERVE
                - RECOVERY
                description: Claim financial transaction kind (REQ-CLM-003)
              exposureId:
                $ref: ../events/common.schema.json#/$defs/Uuid
              costType:
                $ref: ../events/common.schema.json#/$defs/Code
              costCategory:
                $ref: ../events/common.schema.json#/$defs/Code
              amount:
                $ref: ../events/common.schema.json#/$defs/Money
              payeePartyId:
                $ref: ../events/common.schema.json#/$defs/Uuid
                description: Payment transactions
              payeeAccountId:
                $ref: ../events/common.schema.json#/$defs/Uuid
                description: BIL payee account (REQ-BIL-343), captured with clm.PayeeAccount.capture
              reason:
                $ref: ../events/common.schema.json#/$defs/Code
                description: Reason code; required for every manual reserve change (REQ-CLM-098, CLM-ERR-RESERVE-REASON)
              paymentType:
                type: string
                enum:
                - PARTIAL
                - FINAL
                description: Payment transactions (REQ-CLM-119; default PARTIAL). A FINAL payment proposes the release of the
                  line's remaining open reserve in the same set (REQ-CLM-099)
            required:
            - kind
            - exposureId
            - costType
            - costCategory
            - amount
            description: 'Claim financial transaction on a reserve line (exposure × cost type × cost category). SL2-CLM-MONEY:
              kinds RESERVE and PAYMENT, EUR only (D-SL2-06), at most one payment per set; cost types and categories from the
              illustrative motor list (D-SL2-04: INDEMNITY → VEHICLE_REPAIR, TOTAL_LOSS; EXPENSE_ALLOCATED → ASSESSOR_FEE)'
          minItems: 1
      required:
      - claimId
      - transactions
      description: 'Typed from REQ-CLM-003, REQ-CLM-107. PRD inputs: "transactions". Builds a Draft set: reserve lines are
        created on first use (REQ-CLM-093), an eroding payment above the open reserve adds a reserve increase to the same set
        (REQ-CLM-097, auto-adjust on by default) and a FINAL payment proposes the release of the remainder (REQ-CLM-099).
        With dryRun nothing is stored (preview only).'
    TransactionSetBuildResponse:
      type: object
      properties:
        setId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        status:
          $ref: ../events/common.schema.json#/$defs/Code
        contentHash:
          $ref: ../events/common.schema.json#/$defs/Sha256
