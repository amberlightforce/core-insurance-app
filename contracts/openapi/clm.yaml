                $ref: ../events/common.schema.json#/$defs/Money
                description: Open reserve before the set
              after:
                $ref: ../events/common.schema.json#/$defs/Money
                description: Open reserve after the set
              paidBefore:
                $ref: ../events/common.schema.json#/$defs/Money
