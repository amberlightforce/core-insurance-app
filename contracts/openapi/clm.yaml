        reserveLineId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        costType:
          $ref: ../events/common.schema.json#/$defs/Code
        costCategory:
          $ref: ../events/common.schema.json#/$defs/Code
        amount:
          $ref: ../events/common.schema.json#/$defs/Money
        functionalAmount:
          $ref: ../events/common.schema.json#/$defs/Money
        groupAmount:
          $ref: ../events/common.schema.json#/$defs/Money
        eroding:
          type: boolean
        paymentType:
          $ref: ../events/common.schema.json#/$defs/Code
        claimPaymentId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        reasonCode:
          $ref: ../events/common.schema.json#/$defs/Code
        proposed:
