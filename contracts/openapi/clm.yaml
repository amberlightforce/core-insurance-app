components:
  securitySchemes:
    entra:
      $ref: common.yaml#/components/securitySchemes/entra
  schemas:
    FnolSubmitRequest:
      type: object
      properties:
        lineOfBusiness:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Line of business (the slice accepts MOTOR, D-SL2-01)
        policyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: Policy chosen in the FNOL policy lookup (pol.Policy.search, REQ-CLM-047); cover is verified on its snapshot at lossAt (REQ-CLM-002)
        policyNumber:
          $ref: ../events/common.schema.json#/$defs/BusinessNumber
          description: Optional cross-check; when given it must equal the policy number on the snapshot
        lossAt:
          $ref: ../events/common.schema.json#/$defs/Instant
          description: Loss date and time (business fact, not a time-travel input); never in the future, never after noticeOn (REQ-CLM-030)
        noticeOn:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/LocalDate
          - type: 'null'
          description: Notice date; defaults to today in Europe/Athens from the PLT time service (REQ-CLM-030)
        lossCause:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Loss cause from the line's code list (REQ-CLM-030)
        lossLocation:
          type: string
          minLength: 1
          maxLength: 500
          description: Loss location as free description (REQ-CLM-030). May hold personal data; encrypted at rest, never in lists, events or URLs
        description:
          type: string
          minLength: 1
          maxLength: 4000
          description: Free-text description (REQ-CLM-030, ≤ 4,000). May hold personal data; encrypted at rest, never in lists, events or URLs
        lossData:
          $ref: ../events/common.schema.json#/$defs/OpenObject
          description: Line-specific loss data; kept only inside the encrypted FNOL snapshot (REQ-CLM-044)
        reporter:
          type: object
          properties:
            partyId:
              $ref: ../events/common.schema.json#/$defs/Uuid
            relationship:
              $ref: ../events/common.schema.json#/$defs/Code
              description: Relationship to the insured (default INSURED)
            adHoc:
              $ref: ../events/common.schema.json#/$defs/OpenObject
        involvedParties:
          type: array
          items:
            $ref: ../events/common.schema.json#/$defs/OpenObject
        incidents:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/FnolIncidentInput'
        exposures:
          type: array
          maxItems: 10
          description: Exposure proposals confirmed by the user (REQ-CLM-065); in the slice own-damage style exposures for the insured
          items:
            $ref: '#/components/schemas/FnolExposureInput'
        duplicateDecision:
          oneOf:
          - $ref: '#/components/schemas/DuplicateDecision'
          - type: 'null'
        attachmentRefs:
          type: array
          items:
            $ref: ../events/common.schema.json#/$defs/Uuid
        channel:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Shared channel code list (R-84, REQ-CLM-036)
        receiptMedium:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Code
          - type: 'null'
          description: TELEPHONE, EMAIL, LETTER, FAX, SMS, IN_PERSON, ELECTRONIC (REQ-CLM-036)
        channelMetadata:
          $ref: ../events/common.schema.json#/$defs/OpenObject
        liabilityFacts:
          $ref: '#/components/schemas/LiabilityFacts'
          description: Optional liability facts captured at FNOL (D-SL4-17)
      description: 'Mandatory: lineOfBusiness, policyId, lossAt, lossCause, lossLocation, description, channel; they are not schema-required so that
        a missing one is CLM-ERR-FNOL-001 naming the field (REQ-CLM-030), not a parse error. Typed from REQ-CLM-001, REQ-CLM-030, REQ-CLM-036, REQ-CLM-041,
        REQ-CLM-065 (SL2-CLM-CORE). PRD inputs: "FNOL payload". A missing required field is CLM-ERR-FNOL-001 naming the field.'
    FnolIncidentInput:
      type: object
      description: An incident of the loss (REQ-CLM-064). The slice records vehicle incidents only; no injury (P3) fields.
      properties:
        incidentType:
          type: string
          enum:
          - VEHICLE
        vehicleRef:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Insured vehicle reference from the snapshot (vehicle id or plate)
        drivable:
          type:
          - boolean
          - 'null'
        damageAreas:
          type: array
          items:
            $ref: ../events/common.schema.json#/$defs/Code
      required:
      - incidentType
    FnolExposureInput:
      type: object
      description: A confirmed exposure proposal (REQ-CLM-062, REQ-CLM-065); the claimant is the insured.
      properties:
        kind:
          $ref: '#/components/schemas/ExposureKind'
        coverageCode:
          $ref: ../events/common.schema.json#/$defs/Code
      required:
      - kind
      - coverageCode
    DuplicateDecision:
      type: object
      description: The user's choice for probable duplicates (REQ-CLM-041); merge is a later work package.
      properties:
        action:
          type: string
          enum:
          - LINK
          - OVERRIDE
        linkedClaimId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: The existing claim (required for LINK)
        reasonCode:
          $ref: ../events/common.schema.json#/$defs/Code
      required:
      - action
      - reasonCode
    ExposureKind:
      type: string
      description: Exposure kind (REQ-CLM-062)
      enum:
      - OWN_DAMAGE
      - MTPL_PD
      - MTPL_BI
      - THEFT
      - GLASS
      - ASSISTANCE
      - LEGAL_PROTECTION
      - PROPERTY_BUILDING
      - CONTENTS
      - ALTERNATIVE_ACCOMMODATION
      - LIABILITY_PROPERTY
      - LIABILITY_INJURY
      - FS_OWN_SETTLEMENT
    CoverageIndication:
      type: object
      description: Coverage indication from the snapshot (REQ-CLM-048), an indication until a coverage decision is recorded.
      properties:
        coverageCode:
          $ref: ../events/common.schema.json#/$defs/Code
        indication:
          type: string
          enum:
          - COVERED
          - NOT_COVERED
          - IN_QUESTION
          description: COVERED = the code is a selected coverage of the in-force snapshot; NOT_COVERED = not on the snapshot; IN_QUESTION = the policy was not in force at the loss date (REQ-CLM-049)
      required:
      - coverageCode
      - indication
    DuplicateCandidate:
      type: object
      description: A probable duplicate (REQ-CLM-041) with its match reasons.
      properties:
        claimId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        claimNumber:
          $ref: ../events/common.schema.json#/$defs/BusinessNumber
        reasons:
          type: array
          items:
            $ref: ../events/common.schema.json#/$defs/Code
      required:
      - claimId
      - claimNumber
      - reasons
    FnolIssue:
      type: object
      description: A finding of clm.Fnol.validate.
      properties:
        code:
          type: string
          description: Error code the submit would return (e.g. CLM-ERR-FNOL-001)
        field:
          type:
          - string
          - 'null'
        message:
          type: string
      required:
      - code
      - message
    FnolSubmitResponse:
      type: object
      properties:
        claimId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        claimNumber:
          $ref: ../events/common.schema.json#/$defs/BusinessNumber
        claim:
          $ref: '#/components/schemas/ClaimSummary'
        exposures:
          type: array
          items:
            $ref: '#/components/schemas/ExposureView'
        coverageIndications:
          type: array
          items:
            $ref: '#/components/schemas/CoverageIndication'
        duplicateCandidates:
          type: array
          items:
            $ref: '#/components/schemas/DuplicateCandidate'
        handlingSegment:
          $ref: ../events/common.schema.json#/$defs/Code
        assignment:
          type: object
          properties:
            assigneeType:
              type: string
              enum:
              - USER
              - GROUP
              - QUEUE
              description: WRK assignee kind
            assigneeId:
              type: string
        requiredDocuments:
          type: array
          items:
            $ref: ../events/common.schema.json#/$defs/Code
      required:
      - claimId
      - claimNumber
      - claim
      - exposures
      - coverageIndications
      - duplicateCandidates
      - handlingSegment
      description: 'Typed from REQ-CLM-001 (SL2-CLM-CORE). PRD outputs: "claim, exposures, checklist, assignment". Holds no free text (stored by the idempotency store).'
    FnolSaveDraftRequest:
      type: object
      description: 'clm.Fnol.saveDraft request. PRD inputs: "FNOL payload"'
      properties:
        fnolPayload:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "FNOL payload"'
    FnolSaveDraftResponse:
      type: object
      description: 'clm.Fnol.saveDraft result. PRD outputs: "claim, exposures, checklist, assignment"'
      properties:
        claim:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "claim"'
        exposures:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "exposures"'
        checklist:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "checklist"'
        assignment:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "assignment"'
    FnolGetResponse:
      type: object
      description: 'clm.Fnol.get result: the immutable FNOL snapshot as submitted (REQ-CLM-044). Typed by SL2-CLM-CORE.'
      properties:
        fnolId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        claimId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        claimNumber:
          $ref: ../events/common.schema.json#/$defs/BusinessNumber
        channel:
          $ref: ../events/common.schema.json#/$defs/Code
        reporterPartyId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
        submittedAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        submittedBy:
          type: string
        payload:
          $ref: '#/components/schemas/FnolSubmitRequest'
      required:
      - fnolId
      - claimId
      - claimNumber
      - channel
      - submittedAt
      - submittedBy
      - payload
    FnolValidateRequest:
      type: object
      description: 'clm.Fnol.validate request: the FNOL payload a submit would send (no claim, number or event is created).'
      properties:
        fnol:
          $ref: '#/components/schemas/FnolSubmitRequest'
      required:
      - fnol
    FnolValidateResponse:
      type: object
      description: 'clm.Fnol.validate result (SL2-CLM-CORE): the findings a submit would raise, coverage indications and duplicate candidates.'
      properties:
        valid:
          type: boolean
        issues:
          type: array
          items:
            $ref: '#/components/schemas/FnolIssue'
        policyNumber:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/BusinessNumber
          - type: 'null'
        policyInForce:
          type:
          - boolean
          - 'null'
        policyStatusAtLoss:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Code
          - type: 'null'
        coverageIndications:
          type: array
          items:
            $ref: '#/components/schemas/CoverageIndication'
        duplicateCandidates:
          type: array
          items:
            $ref: '#/components/schemas/DuplicateCandidate'
      required:
      - valid
      - issues
      - coverageIndications
      - duplicateCandidates
    ClaimSummary:
      type: object
      description: The claim header without free text (lists, command results, idempotency store).
      properties:
        claimId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        claimNumber:
          $ref: ../events/common.schema.json#/$defs/BusinessNumber
        policyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        policyNumber:
          $ref: ../events/common.schema.json#/$defs/BusinessNumber
        insuredPartyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        snapshotRef:
          type: string
        snapshotKnownAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        snapshotStatus:
          type: string
          enum:
          - PENDING
          - VERIFIED
          - REVERIFICATION_REQUIRED
        policyInForceAtLoss:
          type: boolean
        policyStatusAtLoss:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Code
          - type: 'null'
        productCode:
          $ref: ../events/common.schema.json#/$defs/Code
        productVersion:
          type:
          - string
          - 'null'
        lineOfBusiness:
          $ref: ../events/common.schema.json#/$defs/Code
        lossAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        lossDate:
          $ref: ../events/common.schema.json#/$defs/LocalDate
        noticeOn:
          $ref: ../events/common.schema.json#/$defs/LocalDate
        lossCause:
          $ref: ../events/common.schema.json#/$defs/Code
        channel:
          $ref: ../events/common.schema.json#/$defs/Code
        handlingSegment:
          $ref: ../events/common.schema.json#/$defs/Code
        status:
          type: string
          enum:
          - DRAFT
          - OPEN
          - CLOSED
        subStatus:
          oneOf:
          - $ref: '#/components/schemas/ClaimSubStatus'
          - type: 'null'
        outcome:
          oneOf:
          - $ref: '#/components/schemas/ClaimOutcome'
          - type: 'null'
        coverageInQuestion:
          type: boolean
        duplicateOfClaimId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
        handler:
          type:
          - string
          - 'null'
        openDays:
          type: integer
          minimum: 0
          description: Days since notice (REQ-CLM-075); frozen at closure
        recordVersion:
          type: integer
          minimum: 1
        createdAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        closedAt:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Instant
          - type: 'null'
      required:
      - claimId
      - claimNumber
      - policyId
      - policyNumber
      - insuredPartyId
      - snapshotRef
      - snapshotKnownAt
      - snapshotStatus
      - policyInForceAtLoss
      - productCode
      - lineOfBusiness
      - lossAt
      - lossDate
      - noticeOn
      - lossCause
      - channel
      - handlingSegment
      - status
      - coverageInQuestion
      - openDays
      - recordVersion
      - createdAt
    LiabilityFacts:
      type: object
      description: Liability facts of a motor claim (REQ-CLM-076 subset, REQ-CLM-144, REQ-CLM-155; D-SL4-17). Set at FNOL or by clm.Claim.update and
        audited; every member may be absent until known.
      properties:
        insuredFaultPct:
          $ref: ../events/common.schema.json#/$defs/Decimal
          description: Insured driver fault, 0 to 100 (decimal string, no more than 2 decimals). Subrogation is proposed when below 100 (REQ-CLM-144);
            Friendly Settlement needs 0 or 100 (D-SL4-03)
        faultSource:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Where the fault figure comes from (open Code; e.g. INSURED_STATEMENT, JOINT_REPORT, POLICE_REPORT, COUNTERPARTY_INSURER, HANDLER)
        counterpartyInsurerPartyId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: PTY organisation party of the counterparty insurer; no other vehicle plate or driver is stored (D-SL4-17)
        jointReportFlag:
          type: boolean
          description: A joint accident report (amicable statement) exists; WRK classification of the document is out of slice 4
        vehicleCount:
          type: integer
          minimum: 1
          description: Number of vehicles involved
        accidentInGreece:
          type: boolean
          description: The accident happened in Greece
    ClaimSubStatus:
      type: string
      description: Open sub-state (REQ-CLM-071)
      enum:
      - NEW
      - IN_PROGRESS
      - UNDER_INVESTIGATION
      - SETTLED
    ClaimOutcome:
      type: string
      description: Closure outcome (REQ-CLM-071)
      enum:
      - COMPLETED
      - DENIED
      - WITHDRAWN
      - DUPLICATE
      - NO_PAYMENT
    ClaimView:
      type: object
      description: The claim (REQ-CLM-061) with exposures, claimants and incidents. Free text (description, lossLocation) is shown to holders of clm.Claim.get
        only here, never in lists.
      properties:
        summary:
          $ref: '#/components/schemas/ClaimSummary'
        legalEntity:
          type: string
        jurisdiction:
          $ref: ../events/common.schema.json#/$defs/CountryCode
        lossLocation:
          type: string
        description:
          type: string
        exposures:
          type: array
          items:
            $ref: '#/components/schemas/ExposureView'
        claimants:
          type: array
          items:
            $ref: '#/components/schemas/ClaimantView'
        incidents:
          type: array
          items:
            $ref: '#/components/schemas/IncidentView'
        pendingReverification:
          type: object
          description: Present while snapshotStatus is REVERIFICATION_REQUIRED (the ReverificationRequired payload)
          properties:
            oldSnapshotRef:
              type: string
            newSnapshotRef:
              type: string
            causeEventId:
              $ref: ../events/common.schema.json#/$defs/Uuid
            raisedAt:
              $ref: ../events/common.schema.json#/$defs/Instant
          required:
          - oldSnapshotRef
          - newSnapshotRef
          - causeEventId
        liabilityFacts:
          oneOf:
          - $ref: '#/components/schemas/LiabilityFacts'
          - type: 'null'
          description: Liability facts; null until set (D-SL4-17)
      required:
      - summary
      - legalEntity
      - jurisdiction
      - lossLocation
      - description
      - exposures
      - claimants
      - incidents
    ExposureView:
      type: object
      description: An exposure (REQ-CLM-062) = one coverage × one claimant.
      properties:
        exposureId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        exposureNumber:
          $ref: ../events/common.schema.json#/$defs/BusinessNumber
        kind:
          $ref: '#/components/schemas/ExposureKind'
        coverageCode:
          $ref: ../events/common.schema.json#/$defs/Code
        claimantId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        claimantPartyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        incidentId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
        status:
          type: string
          enum:
          - OPEN
          - CLOSED
        outcome:
          type:
          - string
          - 'null'
        coverageIndication:
          type: string
          enum:
          - COVERED
          - NOT_COVERED
          - IN_QUESTION
        coverageDecision:
          type: string
          enum:
          - PENDING
          - COVERED
          - COVERED_WITH_RESERVATION
          - PARTIALLY_COVERED
          - NOT_COVERED
        duplicateReason:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Code
          - type: 'null'
        createdAt:
          $ref: ../events/common.schema.json#/$defs/Instant
      required:
      - exposureId
      - exposureNumber
      - kind
      - coverageCode
      - claimantId
      - claimantPartyId
      - status
      - coverageIndication
      - coverageDecision
      - createdAt
    ClaimantView:
      type: object
      description: A claimant (REQ-CLM-066 subset) referring to a PTY party.
      properties:
        claimantId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        partyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        claimantType:
          type: string
          enum:
          - INSURED
          - THIRD_PARTY
      required:
      - claimantId
      - partyId
      - claimantType
    IncidentView:
      type: object
      description: An incident (REQ-CLM-064 subset, vehicle only in the slice).
      properties:
        incidentId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        incidentType:
          type: string
          enum:
          - VEHICLE
        vehicleRef:
          type:
          - string
          - 'null'
        drivable:
          type:
          - boolean
          - 'null'
        damageAreas:
          type: array
          items:
            $ref: ../events/common.schema.json#/$defs/Code
      required:
      - incidentId
      - incidentType
      - damageAreas
    ClaimGetResponse:
      type: object
      description: 'clm.Claim.get result. PRD outputs: "claim"'
      properties:
        claim:
