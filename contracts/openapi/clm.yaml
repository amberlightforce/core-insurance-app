      description: 'clm.Dsar.rectify request. PRD inputs: "party, corrections"'
      properties:
        party:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "party"'
        corrections:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "corrections"'
    DsarRectifyResponse:
      type: object
      description: 'clm.Dsar.rectify result. PRD outputs: "result"'
      properties:
        result:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "result"'
    DsarRestrictRequest:
      type: object
      description: 'clm.Dsar.restrict request. PRD inputs: "party, scope"'
      properties:
        party:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "party"'
        scope:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "scope"'
    DsarRestrictResponse:
      type: object
      description: 'clm.Dsar.restrict result. PRD outputs: "result"'
      properties:
        result:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "result"'
    DsarPurgeRequest:
      type: object
      description: 'clm.Dsar.purge request. PRD inputs: "party or scope"'
      properties:
        party:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "party or scope" (optional)'
        scope:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "party or scope" (optional)'
      oneOf:
      - required:
        - party
      - required:
        - scope
    DsarPurgeResponse:
      type: object
      description: 'clm.Dsar.purge result. PRD outputs: "result"'
      properties:
        result:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "result"'

    RecoveryCreateRequest:
      type: object
      description: clm.Recovery.create request (REQ-CLM-143, -144, -145). Creates the case Open; the recovery reserve is raised through a transaction
        set with a RECOVERY_RESERVE line carrying recoveryId.
      properties:
        claimId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        exposureId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: Optional exposure
        type:
          type: string
          enum:
          - SUBROGATION
          - SALVAGE
          description: SUBROGATION or SALVAGE only in slice 4
        counterpartyPartyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: 'PTY party: the at-fault insurer (subrogation) or the buyer (salvage)'
        expectedAmount:
          $ref: ../events/common.schema.json#/$defs/Money
        salvage:
          $ref: '#/components/schemas/SalvageDetails'
          description: Required for SALVAGE, refused for SUBROGATION
        allocationRule:
          type: string
          enum:
          - PRO_RATA_PAID
          - SPECIFIED
          description: Default PRO_RATA_PAID
        reason:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Reason code (REQ-CLM-102 for the recovery reserve raised later)
      required:
      - claimId
      - type
      - counterpartyPartyId
      - expectedAmount
      - reason
    RecoveryCreateResponse:
      type: object
      description: clm.Recovery.create result
      properties:
        recovery:
          $ref: '#/components/schemas/RecoveryView'
      required:
      - recovery
    RecoveryGetResponse:
      type: object
      description: clm.Recovery.get result
      properties:
        recovery:
          $ref: '#/components/schemas/RecoveryView'
      required:
      - recovery
    RecoveryListPage:
      allOf:
      - $ref: common.yaml#/components/schemas/PageEnvelope
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/RecoveryView'
      description: Page of clm.Recovery.list results (cursor pagination, contract §3.5.5)
    RecoveryRecordMilestoneRequest:
      type: object
      description: clm.Recovery.recordMilestone request (REQ-CLM-147). Some milestones move the state (e.g. SETTLEMENT_AGREED -> Agreed).
      properties:
        recoveryId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        expectedRecordVersion:
          type: integer
          minimum: 1
        milestone:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Milestone code (open Code; e.g. COUNTERPARTY_ACKNOWLEDGED, LIABILITY_ACCEPTED, SETTLEMENT_AGREED, SALVAGE_SOLD)
        occurredOn:
          $ref: ../events/common.schema.json#/$defs/LocalDate
        note:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Text
          - type: 'null'
        salvage:
          $ref: '#/components/schemas/SalvageDetails'
          description: SALVAGE_SOLD requires buyerPartyId and salePrice; the case becomes Agreed
      required:
      - recoveryId
      - expectedRecordVersion
      - milestone
      - occurredOn
    RecoveryRecordMilestoneResponse:
      type: object
      description: clm.Recovery.recordMilestone result
      properties:
        recovery:
          $ref: '#/components/schemas/RecoveryView'
      required:
      - recovery
    RecoveryDemandRequest:
      type: object
      description: clm.Recovery.demand request (REQ-CLM-147, REQ-BIL-346). Registers a BIL receivable (source CLM_CLAIM_PAYMENT, purpose SALVAGE or
        SUBROGATION); the case becomes Demanded. No cash moves in CLM.
      properties:
        recoveryId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        expectedRecordVersion:
          type: integer
          minimum: 1
        amount:
          $ref: ../events/common.schema.json#/$defs/Money
          description: Amount demanded; at most the expected amount
        dueDate:
          $ref: ../events/common.schema.json#/$defs/LocalDate
          description: Due date of the BIL receivable
        allocationRule:
          type: string
          enum:
          - PRO_RATA_PAID
          - SPECIFIED
        allocation:
          type: array
          items:
            $ref: '#/components/schemas/RecoveryAllocationLine'
          description: Required when allocationRule is SPECIFIED; must sum to the amount (CLM-ERR-ALLOCATION)
      required:
      - recoveryId
      - expectedRecordVersion
      - amount
      - dueDate
    RecoveryDemandResponse:
      type: object
      description: clm.Recovery.demand result
      properties:
        recovery:
          $ref: '#/components/schemas/RecoveryView'
        receivableId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: BIL receivable
        billingAccountId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: Counterparty billing account of type CLAIM_RECOVERY
        paymentReference:
          type: string
          description: Reference the payer quotes; staff record the receipt with bil.Payment.take
      required:
      - recovery
      - receivableId
      - billingAccountId
      - paymentReference
    RecoveryWriteOffRequest:
      type: object
      description: clm.Recovery.writeOff request (REQ-CLM-149 subset, CLM.RECOVERY_WRITEOFF, D-SL4-07). Checked on the aggregate; above the handler's
        authority the set is referred.
      properties:
        recoveryId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        expectedRecordVersion:
          type: integer
          minimum: 1
        amount:
          $ref: ../events/common.schema.json#/$defs/Money
          description: Amount written off (at most the open recovery reserve plus the unreceived expected amount)
        reason:
          $ref: ../events/common.schema.json#/$defs/Code
      required:
      - recoveryId
      - expectedRecordVersion
      - amount
      - reason
    RecoveryWriteOffResponse:
      type: object
      description: clm.Recovery.writeOff result
      properties:
        recovery:
          $ref: '#/components/schemas/RecoveryView'
        outcome:
          type: string
          enum:
          - WRITTEN_OFF
          - PENDING_APPROVAL
        setId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: The transaction set that releases the recovery reserve
        approvalRequestId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: PLT approval request when referred
      required:
      - recovery
      - outcome
    FsEvaluateRequest:
      type: object
      description: 'clm.FriendlySettlement.evaluate request: the claim facts come from the claim and its liability facts (D-SL4-17), never from the
        client.'
      properties:
        claimId:
          $ref: ../events/common.schema.json#/$defs/Uuid
      required:
      - claimId
    FsEvaluateResponse:
      type: object
      description: clm.FriendlySettlement.evaluate result
      properties:
        fsCase:
          $ref: '#/components/schemas/FsCaseView'
        eligibility:
          $ref: '#/components/schemas/FsEligibility'
      required:
      - fsCase
      - eligibility
    FsOpenOwnSettlementRequest:
      type: object
      description: clm.FriendlySettlement.openOwnSettlement request (REQ-CLM-157). The FS value is the stored clearing value; the client sends no
        amount.
      properties:
        fsCaseId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        expectedRecordVersion:
          type: integer
          minimum: 1
        claimantPartyId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: Claimant (default the insured)
      required:
      - fsCaseId
      - expectedRecordVersion
    FsOpenOwnSettlementResponse:
      type: object
      description: clm.FriendlySettlement.openOwnSettlement result
      properties:
        fsCase:
          $ref: '#/components/schemas/FsCaseView'
        exposureId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: The FS_OWN_SETTLEMENT exposure
        recoveryId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: The FRIENDLY_SETTLEMENT recovery; raise its recovery reserve at the clearing value with a RECOVERY_RESERVE line
      required:
      - fsCase
      - exposureId
      - recoveryId
    FsSubmitRequest:
      type: object
      description: 'clm.FriendlySettlement.submit request (REQ-CLM-159, submit part): calls IFriendlySettlementClearing.SubmitAsync once and publishes
        FriendlySettlementSubmitted once.'
      properties:
        fsCaseId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        expectedRecordVersion:
          type: integer
          minimum: 1
      required:
      - fsCaseId
      - expectedRecordVersion
    FsSubmitResponse:
      type: object
      description: clm.FriendlySettlement.submit result
      properties:
        fsCase:
          $ref: '#/components/schemas/FsCaseView'
        clearingReference:
          $ref: ../events/common.schema.json#/$defs/Text
      required:
      - fsCase
      - clearingReference
    FsGetResponse:
      type: object
      description: clm.FriendlySettlement.get result
      properties:
        fsCase:
          $ref: '#/components/schemas/FsCaseView'
      required:
      - fsCase
    FsListPage:
      allOf:
      - $ref: common.yaml#/components/schemas/PageEnvelope
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/FsCaseView'
      description: Page of clm.FriendlySettlement.list results (cursor pagination, contract §3.5.5)
    FsImportStatementRequest:
      type: object
      description: 'clm.FriendlySettlement.importStatement request (REQ-CLM-160): CLM asks the SPI for the statement (SettlementStatementAsync); in
        slice 4 the stub builds it from its own store in a documented JSON test format.'
      properties:
        period:
          $ref: ../events/common.schema.json#/$defs/DatePeriod
          description: Statement period (a calendar month, half-open [from, to) Athens dates)
        counterpartyCode:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Code
          - type: 'null'
          description: Optional counterparty filter
      required:
      - period
    FsImportStatementResponse:
      type: object
      description: 'clm.FriendlySettlement.importStatement result: lines are matched to cases at once; matched lines record FS recoveries and settle
        CLEARING payables in evidence-backed system sets.'
      properties:
        statement:
          $ref: '#/components/schemas/FsStatementView'
      required:
      - statement
    FsGetStatementResponse:
      type: object
      description: clm.FriendlySettlement.getStatement result
      properties:
        statement:
          $ref: '#/components/schemas/FsStatementView'
      required:
      - statement
    FsApproveNetRequest:
      type: object
      description: 'clm.FriendlySettlement.approveNet request (REQ-CLM-160, -264): approves the net of one counterparty under CLM.FS_NET_SETTLEMENT
        (four-eyes above the threshold) and hands it to BIL (bil.Disbursement.request source FS_CLEARING method CLEARING, or bil.Receivable.register
        source FS_CLEARING).'
      properties:
        fsStatementId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        counterpartyCode:
          $ref: ../events/common.schema.json#/$defs/Code
        expectedRecordVersion:
          type: integer
          minimum: 1
        expectedNet:
          $ref: ../events/common.schema.json#/$defs/Money
          description: The net the approver saw; a different computed net is CLM-ERR-STALE. The net is never taken from the client.
      required:
      - fsStatementId
      - counterpartyCode
      - expectedRecordVersion
      - expectedNet
    FsApproveNetResponse:
      type: object
      description: clm.FriendlySettlement.approveNet result
      properties:
        statement:
          $ref: '#/components/schemas/FsStatementView'
        net:
          $ref: '#/components/schemas/FsNetView'
        outcome:
          type: string
          enum:
          - REQUESTED
          - PENDING_APPROVAL
          description: PENDING_APPROVAL when the amount is above the maker's authority (PLT approval opened)
      required:
      - statement
      - net
      - outcome
