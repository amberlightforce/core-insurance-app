      - required:
        - keep
    CoverageDecideResponse:
      type: object
      description: 'clm.Coverage.decide result. PRD outputs: "decision record"'
      properties:
        decisionRecord:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "decision record"'
    CoverageReverifyRequest:
      type: object
      description: 'clm.Coverage.reverify request (REQ-CLM-058). A human decides after ReverificationRequired: KEEP the claim''s current snapshot ref, or
        ADOPT the new one. Never automatic (REQ-CLM-002). PRD inputs: "decision, reasons; adopt or keep".'
      properties:
        claimId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        decision:
          type: string
          enum:
          - KEEP
          - ADOPT
        reasonCode:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Reason from the configured list; PRD "reasons"
        comment:
          $ref: ../events/common.schema.json#/$defs/Text
        expectedNewSnapshotRef:
          type: string
          description: The new snapshot ref the decision was taken against. Required for ADOPT and checked for KEEP when given; if POL superseded again meanwhile
            the call fails with CLM-ERR-SNAPSHOT-MISMATCH.
      required:
      - claimId
      - decision
      - reasonCode
    CoverageReverifyResponse:
      type: object
      description: 'clm.Coverage.reverify result. PRD outputs: "decision record"'
      properties:
        claimId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        decisionRecordId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        decision:
          type: string
          enum:
          - KEEP
          - ADOPT
        snapshotStatus:
          type: string
          enum:
          - PENDING
          - VERIFIED
          - REVERIFICATION_REQUIRED
          description: VERIFIED after the decision (always set)
        snapshotRef:
          type: string
          description: The claim's snapshot ref after the decision (the new ref for ADOPT, unchanged for KEEP)
        previousSnapshotRef:
          type: string
        coverageInQuestion:
          type: boolean
          description: True when adoption removed the cover of an exposure; new payments on it are refused until cleared
        decidedAt:
          $ref: ../events/common.schema.json#/$defs/Instant
      required:
      - claimId
      - decisionRecordId
      - decision
      - snapshotStatus
      - snapshotRef
      - coverageInQuestion
      - decidedAt
    TransactionSetBuildRequest:
      type: object
      properties:
        claimId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        transactions:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                - RESERVE
                - PAYMENT
                - RECOVERY_RESERVE
                - RECOVERY
                description: Claim financial transaction kind (REQ-CLM-003)
              exposureId:
                $ref: ../events/common.schema.json#/$defs/Uuid
              costType:
                $ref: ../events/common.schema.json#/$defs/Code
              costCategory:
                $ref: ../events/common.schema.json#/$defs/Code
              amount:
                $ref: ../events/common.schema.json#/$defs/Money
              payeePartyId:
                $ref: ../events/common.schema.json#/$defs/Uuid
                description: Payment transactions
              payeeAccountId:
                $ref: ../events/common.schema.json#/$defs/Uuid
                description: BIL payee account (REQ-BIL-343), captured with clm.PayeeAccount.capture
              reason:
                $ref: ../events/common.schema.json#/$defs/Code
                description: Reason code; required for every manual reserve change (REQ-CLM-098, CLM-ERR-RESERVE-REASON)
              paymentType:
                type: string
                enum:
                - PARTIAL
                - FINAL
                description: Payment transactions (REQ-CLM-119; default PARTIAL). A FINAL payment proposes the release of the line's remaining open
                  reserve in the same set (REQ-CLM-099)
              recoveryId:
                $ref: ../events/common.schema.json#/$defs/Uuid
                description: Recovery case of the line; required for kinds RECOVERY_RESERVE and RECOVERY (a recovery-reserve increase is checked under
                  CLM.RESERVE on the exposure total of open recovery reserve, D-SL4-07). Kind RECOVERY is accepted only from evidence-backed system
                  sets, never from a client (PITFALLS 7)
            required:
            - kind
            - exposureId
            - costType
            - costCategory
            - amount
            description: 'Claim financial transaction on a reserve line (exposure × cost type × cost category). SL2-CLM-MONEY: kinds RESERVE and PAYMENT,
              EUR only (D-SL2-06), at most one payment per set; cost types and categories from the illustrative motor list (D-SL2-04: INDEMNITY →
              VEHICLE_REPAIR, TOTAL_LOSS; EXPENSE_ALLOCATED → ASSESSOR_FEE)'
          minItems: 1
      required:
      - claimId
      - transactions
      description: 'Typed from REQ-CLM-003, REQ-CLM-107. PRD inputs: "transactions". Builds a Draft set: reserve lines are created on first use (REQ-CLM-093),
        an eroding payment above the open reserve adds a reserve increase to the same set (REQ-CLM-097, auto-adjust on by default) and a FINAL payment
        proposes the release of the remainder (REQ-CLM-099). With dryRun nothing is stored (preview only).'
    TransactionSetBuildResponse:
      type: object
      properties:
        setId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        status:
          $ref: ../events/common.schema.json#/$defs/Code
        contentHash:
          $ref: ../events/common.schema.json#/$defs/Sha256
        preview:
          type: array
          items:
            type: object
            properties:
              exposureId:
                $ref: ../events/common.schema.json#/$defs/Uuid
              costType:
                $ref: ../events/common.schema.json#/$defs/Code
              costCategory:
                $ref: ../events/common.schema.json#/$defs/Code
              before:
                $ref: ../events/common.schema.json#/$defs/Money
                description: Open reserve before the set
              after:
                $ref: ../events/common.schema.json#/$defs/Money
                description: Open reserve after the set
              paidBefore:
                $ref: ../events/common.schema.json#/$defs/Money
              paidAfter:
                $ref: ../events/common.schema.json#/$defs/Money
          description: Balances before → after per line (REQ-CLM-107)
        checks:
          type: array
          items:
            $ref: common.yaml#/components/schemas/Unspecified
        set:
          $ref: '#/components/schemas/TransactionSetView'
        authorityPreview:
          type: array
          items:
            $ref: '#/components/schemas/AuthorityPreviewItem'
          description: 'Dry-run only: what submitting the set would do under authority (type, cost type, aggregate amount, WITHIN/REFER/DENY, role).
            Always set on a dry run, absent otherwise'
      required:
      - setId
      - status
      - preview
      description: 'Typed from REQ-CLM-003, REQ-CLM-107. PRD outputs: "set with preview, checks, approval request"'
    AuthorityPreviewItem:
      type: object
      description: One authority preview line of a dry-run build (D-SL4-14).
      properties:
        type:
          type: string
          description: Authority type (CLM.RESERVE, CLM.PAYMENT, CLM.RECOVERY_WRITEOFF)
        costType:
          $ref: ../events/common.schema.json#/$defs/Code
        amount:
          $ref: ../events/common.schema.json#/$defs/Money
          description: The aggregate the authority is checked on (never per line, PITFALLS 1)
        basis:
          type: string
          enum:
          - EXPOSURE_TOTAL_RESERVE
          - EXPOSURE_TOTAL_RECOVERY_RESERVE
          - RESERVE_DECREASE
          - PAYMENT
          - CLAIM_CUMULATIVE_PAID
        outcome:
          type: string
          enum:
          - WITHIN
          - REFER
          - DENY
          description: WITHIN = ALLOW; REFER = needs the referral role; DENY = CLM-ERR-AUTHORITY on submit
        role:
          oneOf:
          - type: string
          - type: 'null'
          description: Referral role when outcome is REFER (e.g. Staff.ClaimsManager); null otherwise
      required:
      - type
      - costType
      - amount
      - basis
      - outcome
    TransactionSetView:
      type: object
      description: A claim transaction set (PRD-07 §7.1 TransactionSet, §7.3.2) with its transactions and derived states
      properties:
        setId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        claimId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        status:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - PENDING_APPROVAL
          - APPROVED
          - REJECTED
          - POSTED
        contentHash:
          $ref: ../events/common.schema.json#/$defs/Sha256
          description: SHA-256 of the canonical set (RFC 8785)
        maker:
          type: string
          description: Actor who built the set
        approvalRequestId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: PLT approval request when referred (REQ-CLM-109)
        approvalPayloadHash:
          $ref: ../events/common.schema.json#/$defs/Sha256
          description: Hash the PLT approval is bound to (the set content hash, or the disbursement content hash of the set's payment)
        fourEyes:
          type: boolean
        rejectionReason:
          $ref: ../events/common.schema.json#/$defs/Code
        createdAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        submittedAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        decidedAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/FinancialTransactionView'
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/SetApprovalView'
          description: One PLT approval request per referred (authority type, cost type) (D-SL2-13); the set executes when all are approved
        approvalDiff:
          oneOf:
          - $ref: '#/components/schemas/ApprovalDiff'
          - type: 'null'
          description: Before/after per line; always set while the set is PENDING_APPROVAL, null otherwise
        systemRecorded:
          type: boolean
          description: True for an evidence-backed set recorded by the system (maker = system principal); such sets never take amounts from a client
            (PITFALLS 7)
        evidenceRef:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Text
          - type: 'null'
          description: Evidence reference of a system-recorded set (BIL allocation id, FS notification or statement line); always set when systemRecorded
      required:
      - setId
      - claimId
      - status
      - contentHash
      - transactions
    SetApprovalView:
      type: object
      description: One PLT approval request of a referred set and the authority it must cover (D-SL2-13)
      properties:
        approvalRequestId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        approvalType:
          type: string
          description: CLM.CLAIM_PAYMENT (subject the payment) or CLM.TRANSACTION_SET
        authorityType:
          type: string
        costType:
          $ref: ../events/common.schema.json#/$defs/Code
        amount:
          $ref: ../events/common.schema.json#/$defs/Money
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
        decidedAt:
          $ref: ../events/common.schema.json#/$defs/Instant
      required:
      - approvalRequestId
      - approvalType
      - authorityType
      - costType
      - amount
      - status
    ApprovalDiffLine:
      type: object
      description: Before/after of one line of a set (REQ-CLM-107, IB-07 approve-the-diff).
      properties:
        kind:
          type: string
          enum:
          - RESERVE
          - PAYMENT
          - RECOVERY_RESERVE
          - RECOVERY
        exposureId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        costType:
          $ref: ../events/common.schema.json#/$defs/Code
        costCategory:
          $ref: ../events/common.schema.json#/$defs/Code
        recoveryId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
        before:
          $ref: ../events/common.schema.json#/$defs/Money
          description: Open amount of the reserve line (or open recovery reserve) before the set
        after:
          $ref: ../events/common.schema.json#/$defs/Money
          description: Open amount after the set
        paidBefore:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Money
          - type: 'null'
        paidAfter:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Money
          - type: 'null'
        delta:
          $ref: ../events/common.schema.json#/$defs/Money
          description: The set amount on this line
      required:
      - kind
      - exposureId
      - costType
      - costCategory
      - before
      - after
      - delta
    ApprovalDiff:
      type: object
      description: Typed approval diff sent with the PLT approval request and shown in the approval inbox (D-SL4-14). Approvers decide on this diff;
        they cannot edit amounts (REQ-CLM-116).
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalDiffLine'
        contentHash:
          $ref: ../events/common.schema.json#/$defs/Sha256
          description: The content hash the approval is bound to
      required:
      - lines
      - contentHash
    FinancialTransactionView:
