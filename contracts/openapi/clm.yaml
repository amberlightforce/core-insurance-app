      properties:
        decision:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "decision"'
        reasons:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "reasons"'
        adopt:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "adopt or keep" (optional)'
        keep:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "adopt or keep" (optional)'
      oneOf:
      - required:
