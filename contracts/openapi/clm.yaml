          $ref: ../events/common.schema.json#/$defs/Uuid
        claimId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        status:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - PENDING_APPROVAL
          - APPROVED
          - REJECTED
          - POSTED
        contentHash:
          $ref: ../events/common.schema.json#/$defs/Sha256
        maker:
          type: string
        fourEyes:
          type: boolean
        transactionCount:
          type: integer
          minimum: 0
        hasPayment:
          type: boolean
        systemRecorded:
          type: boolean
        createdAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        submittedAt:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Instant
          - type: 'null'
        decidedAt:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Instant
          - type: 'null'
      required:
      - setId
      - claimId
      - status
      - contentHash
      - maker
      - transactionCount
      - hasPayment
      - createdAt
    TransactionSetListPage:
      allOf:
      - $ref: common.yaml#/components/schemas/PageEnvelope
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/TransactionSetListItem'
      description: Page of clm.TransactionSet.list results (cursor pagination, contract §3.5.5)
    ClaimPaymentView:
      type: object
      description: 'A claim payment (PRD-07 §7.1 ClaimPayment, §7.3.3). No IBAN: the BIL payee account id and the masked account only (R-38)'
      properties:
        claimPaymentId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        setId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        exposureId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        payeePartyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        payeeAccountId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        maskedAccount:
          type: string
        method:
          $ref: ../events/common.schema.json#/$defs/Code
          description: 'Payment method (open Code): SEPA_CT, SEPA_INST, VENDOR, OFFSET or CLEARING (Friendly Settlement at-fault leg: no disbursement,
            settled through its statement, D-SL4-02)'
        paymentType:
          $ref: ../events/common.schema.json#/$defs/Code
        amount:
          $ref: ../events/common.schema.json#/$defs/Money
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - ON_HOLD
          - SUBMITTED
          - ISSUED
          - CLEARED
          - REJECTED
          - VOIDED
          - STOPPED
          - RETURNED
        holdReason:
          $ref: ../events/common.schema.json#/$defs/Code
        disbursementId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        approvalEvidenceRef:
          type: string
        createdAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        submittedAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        issuedAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        clearedAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        reissueOf:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: The payment this one reissues (REQ-CLM-127); always set on a reissued payment, null otherwise
        fiscalMark:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Text
          - type: 'null'
          description: MARK of the fiscal settlement receipt, stored from FiscalDocRegistered (D-SL4-11); null until registered, always null for CLEARING
        fsStatementId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: FS statement of a CLEARING payment; always set for method CLEARING
      required:
      - claimPaymentId
      - setId
      - exposureId
      - payeePartyId
      - payeeAccountId
      - amount
      - status
    RecoveryType:
      type: string
      enum:
      - SUBROGATION
      - SALVAGE
      - DEDUCTIBLE
      - FRIENDLY_SETTLEMENT
      - GUARANTEE_FUND
      - GREEN_CARD
      - CONTRIBUTION
      - OTHER
      description: Recovery type (PRD-07 §7.1). Slice 4 builds SUBROGATION and SALVAGE (clm.Recovery.create) and FRIENDLY_SETTLEMENT (created by clm.FriendlySettlement.openOwnSettlement);
        the others are refused with CLM-ERR-VALIDATION.
    RecoveryState:
      type: string
      enum:
      - OPEN
      - DEMANDED
      - DISPUTED
      - AGREED
      - IN_ARBITRATION
      - IN_LITIGATION
      - CLOSED
      - WRITTEN_OFF
      description: 'Recovery lifecycle (PRD-07 §7.3.4): Open -> Demanded -> Agreed -> Closed; Demanded -> Disputed -> InArbitration | InLitigation
        | Agreed | WrittenOff; any open -> WrittenOff (CLM.RECOVERY_WRITEOFF); Closed -> Open on new information. Illegal moves are CLM-ERR-RECOVERY-STATE.'
    SalvageDetails:
      type: object
      description: 'Salvage fields of a SALVAGE recovery (REQ-CLM-145): estimate, buyer party, sale price.'
      properties:
        estimate:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Money
          - type: 'null'
          description: Estimated salvage value (the recovery reserve is raised to it)
        buyerPartyId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: PTY party of the salvage buyer (id only)
        salePrice:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Money
          - type: 'null'
          description: Sale price once sold; the recovery is recorded at the sale price when BIL allocates the cash (REQ-CLM-145)
        soldOn:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/LocalDate
          - type: 'null'
          description: Sale date
    RecoveryAllocationLine:
      type: object
      description: User-specified allocation of a recovery to a reserve line (REQ-CLM-151). The allocation must sum to the recovered amount and name
        lines of the claim (CLM-ERR-ALLOCATION).
      properties:
        exposureId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        costType:
          $ref: ../events/common.schema.json#/$defs/Code
        costCategory:
          $ref: ../events/common.schema.json#/$defs/Code
        amount:
          $ref: ../events/common.schema.json#/$defs/Money
      required:
      - exposureId
      - costType
      - costCategory
      - amount
    RecoveryMilestoneView:
      type: object
      description: A recorded milestone of a recovery case (REQ-CLM-147).
      properties:
        milestone:
          $ref: ../events/common.schema.json#/$defs/Code
        occurredOn:
          $ref: ../events/common.schema.json#/$defs/LocalDate
        recordedAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        recordedBy:
          type: string
        note:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Text
          - type: 'null'
      required:
      - milestone
      - occurredOn
      - recordedAt
    RecoveryView:
      type: object
      description: A recovery case (PRD-07 §7.1 Recovery). Cash is only ever recorded from BIL evidence (D-SL4-06).
      properties:
        recoveryId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        claimId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        exposureId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: Exposure the recovery relates to; null for a claim-level recovery
        type:
          $ref: '#/components/schemas/RecoveryType'
        state:
          $ref: '#/components/schemas/RecoveryState'
        counterpartyPartyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: PTY party of the counterparty (insurer, salvage buyer, clearing counterparty)
        expectedAmount:
          $ref: ../events/common.schema.json#/$defs/Money
          description: Expected recovery (REQ-CLM-144)
        recoveryReserve:
          $ref: ../events/common.schema.json#/$defs/Money
          description: Open recovery reserve of the case; always set (Σ recovery reserves − Σ recoveries, never below zero)
        recoveredAmount:
          $ref: ../events/common.schema.json#/$defs/Money
          description: Σ recoveries recorded for the case; always set
        allocationRule:
          type: string
          enum:
          - PRO_RATA_PAID
          - SPECIFIED
          description: 'REQ-CLM-151 / BR-CLM-039: default pro rata to paid; SPECIFIED = the allocation of the demand'
        salvage:
          oneOf:
          - $ref: '#/components/schemas/SalvageDetails'
          - type: 'null'
          description: Always set for SALVAGE, null otherwise
        milestones:
          type: array
          items:
            $ref: '#/components/schemas/RecoveryMilestoneView'
        receivableId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: BIL receivable registered by the demand (D-SL4-06); null before the demand. Always set from DEMANDED on
        paymentReference:
          oneOf:
          - type: string
          - type: 'null'
          description: BIL payment reference the payer quotes; set with receivableId
        fsCaseId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: FS case for type FRIENDLY_SETTLEMENT
        fsStatementId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: FS statement that settled the recovery, once matched
        demandedOn:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/LocalDate
          - type: 'null'
        createdAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        recordVersion:
          type: integer
          minimum: 1
      required:
      - recoveryId
      - claimId
      - type
      - state
      - counterpartyPartyId
      - expectedAmount
      - recoveryReserve
      - recoveredAmount
      - allocationRule
      - milestones
      - createdAt
      - recordVersion
    FsCaseRole:
      type: string
      enum:
      - OWN_INSURER
      - AT_FAULT_INSURER
      description: 'Role of the legal entity in the case (PRD-07 §7.1 FsCase): OWN_INSURER pays its own insured and recovers from the at-fault insurer;
        AT_FAULT_INSURER receives a clearing notification and owes through the statement.'
    FsCaseState:
      type: string
      enum:
      - ELIGIBILITY_PENDING
      - ELIGIBLE
      - NOT_ELIGIBLE
      - SUBMITTED
      - ACCEPTED
      - DISPUTED
      - REJECTED
      - SETTLED
      - RECONCILED
      description: FsCase lifecycle (PRD-07 §7.3.5). Slice 4 reaches SUBMITTED, SETTLED and RECONCILED; ACCEPTED, DISPUTED and REJECTED need the unbuilt
        dispute path (D-SL4-01).
    FsEligibility:
      type: object
      description: Stored result of IFriendlySettlementClearing.EvaluateEligibilityAsync (REQ-CLM-155, REQ-MKT-313).
      properties:
        result:
          type: string
          enum:
          - ELIGIBLE
          - NOT_ELIGIBLE
          - NOT_APPLICABLE
          description: NOT_APPLICABLE when the pack has no Friendly Settlement (Cyprus stub); the SPI is not called when the capability is off
        reasons:
          type: array
          items:
            $ref: ../events/common.schema.json#/$defs/Code
          description: Reason codes (e.g. COUNTERPARTY_NOT_MEMBER, AMOUNT_ABOVE_LIMIT, VEHICLE_COUNT, NOT_IN_GREECE, LIABILITY_NOT_CLEAR); always
            set, empty when eligible
        ruleId:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Eligibility rule id; always set
        ruleVersion:
          $ref: ../events/common.schema.json#/$defs/Text
          description: Rule version; always set
        legalStatus:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Legal status of the values used (UNVERIFIED for the stub, D-SL4-03); always set
        provisional:
          type: boolean
          description: True while legalStatus is not Settled; refused in Production (PITFALLS 36); always set
        clearingValue:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Money
          - type: 'null'
          description: Clearing value of the claim; set when eligible
        clearingValueBasis:
          oneOf:
          - type: string
            enum:
            - ACTUAL
            - AVERAGE
          - type: 'null'
          description: ACTUAL in slice 4 (averages unknown, D-SL4-03); set when eligible
      required:
      - result
      - reasons
      - ruleId
      - ruleVersion
      - legalStatus
      - provisional
    FsCaseView:
      type: object
      description: A Friendly Settlement case (PRD-07 §7.1 FsCase).
      properties:
        fsCaseId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        claimId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        role:
          $ref: '#/components/schemas/FsCaseRole'
        state:
          $ref: '#/components/schemas/FsCaseState'
        counterpartyCode:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Counterparty insurer code (company code from the pack member list)
        counterpartyPartyId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: PTY organisation party of the counterparty insurer
        eligibility:
          oneOf:
          - $ref: '#/components/schemas/FsEligibility'
          - type: 'null'
          description: Latest stored evaluation; null before the first evaluation
        clearingValue:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Money
          - type: 'null'
          description: Clearing value of the case
        clearingReference:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Text
          - type: 'null'
          description: Reference returned by submit (OWN_INSURER) or received in the notification (AT_FAULT_INSURER)
        ownSettlementExposureId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: FS_OWN_SETTLEMENT exposure (OWN_INSURER), set by openOwnSettlement
        recoveryId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: Recovery case of type FRIENDLY_SETTLEMENT holding the FS receivable (OWN_INSURER)
        atFaultPaymentId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: CLEARING payment (AT_FAULT_INSURER)
        fsStatementId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: Statement that matched the case
        statementLineRef:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Text
          - type: 'null'
          description: Statement line that matched the case
        expectedGainLoss:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Money
          - type: 'null'
          description: Clearing value minus paid amount; 0.00 for basis ACTUAL
        createdAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        recordVersion:
          type: integer
          minimum: 1
      required:
      - fsCaseId
      - claimId
      - role
      - state
      - counterpartyCode
      - createdAt
      - recordVersion
    FsStatementLine:
      type: object
      description: A statement line (REQ-CLM-160).
      properties:
        lineRef:
          $ref: ../events/common.schema.json#/$defs/Text
          description: Statement line reference
        clearingReference:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Text
          - type: 'null'
        direction:
          type: string
          enum:
          - RECEIVABLE
          - PAYABLE
          description: RECEIVABLE = the counterparty owes us (own-insurer case); PAYABLE = we owe (at-fault case)
        amount:
          $ref: ../events/common.schema.json#/$defs/Money
        counterpartyCode:
          $ref: ../events/common.schema.json#/$defs/Code
        matchStatus:
          type: string
          enum:
          - MATCHED
          - UNMATCHED
          - DIFFERENCE
          description: UNMATCHED and DIFFERENCE lines are exceptions and block the net of their counterparty
        fsCaseId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: Matched case; always set when MATCHED or DIFFERENCE
        claimId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
        difference:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Money
          - type: 'null'
          description: Statement amount minus case clearing value, when DIFFERENCE
      required:
      - lineRef
      - direction
      - amount
      - counterpartyCode
      - matchStatus
    FsNetStatus:
      type: string
      enum:
      - PENDING
      - APPROVAL_REQUESTED
      - REQUESTED
      - SETTLED
      - REJECTED
      description: 'Net settlement status. PRD-07 §7.1: Pending, Requested, Settled, Rejected; slice 4 adds APPROVAL_REQUESTED between Pending and
        Requested (CLM.FS_NET_SETTLEMENT four-eyes). A rejected or stopped net returns to PENDING (REQ-CLM-264).'
    FsNetView:
      type: object
      description: Net of one counterparty on a statement.
      properties:
        counterpartyCode:
          $ref: ../events/common.schema.json#/$defs/Code
        counterpartyPartyId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
        direction:
          type: string
          enum:
          - PAYABLE
          - RECEIVABLE
          description: PAYABLE = we pay the clearing office through a BIL FS_CLEARING disbursement; RECEIVABLE = BIL receivable with source FS_CLEARING
        amount:
          $ref: ../events/common.schema.json#/$defs/Money
          description: 'Net per counterparty and statement: Σ receivable lines − Σ payable lines (absolute value, direction separate)'
        status:
          $ref: '#/components/schemas/FsNetStatus'
        approvalRequestId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: PLT approval request (CLM.FS_NET_SETTLEMENT)
        statementRef:
          $ref: ../events/common.schema.json#/$defs/Text
          description: Statement reference shared with BIL (the FS_CLEARING statementReference / receivable statement ref); always set
        bilReferenceType:
          oneOf:
          - type: string
            enum:
            - DISBURSEMENT
            - RECEIVABLE
          - type: 'null'
          description: Set from REQUESTED on
        bilReferenceId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: BIL disbursement or receivable id; set from REQUESTED on
      required:
      - counterpartyCode
      - direction
      - amount
      - status
      - statementRef
    FsStatementView:
      type: object
      description: A Friendly Settlement statement (PRD-07 §7.1 FsStatement); one per period per legal entity.
      properties:
        fsStatementId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        period:
          $ref: ../events/common.schema.json#/$defs/DatePeriod
        reconciliation:
          type: string
          enum:
          - EXCEPTIONS_OPEN
          - MATCHED
          description: MATCHED when every line is matched; a net can only be approved then (CLM-ERR-ALLOCATION otherwise)
        lines:
          type: array
          items:
            $ref: '#/components/schemas/FsStatementLine'
        nets:
          type: array
          items:
            $ref: '#/components/schemas/FsNetView'
        exceptionCount:
          type: integer
          minimum: 0
        importedAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        recordVersion:
          type: integer
          minimum: 1
      required:
      - fsStatementId
      - period
      - reconciliation
      - lines
      - nets
      - exceptionCount
      - importedAt
      - recordVersion
    PaymentListPage:
      allOf:
      - $ref: common.yaml#/components/schemas/PageEnvelope
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/ClaimPaymentView'
      description: Page of clm.Payment.list results (cursor pagination, contract §3.5.5)
    PayeeAccountCaptureRequest:
      type: object
      description: 'clm.PayeeAccount.capture (REQ-CLM-123, REQ-CLM-131): registers the payee''s bank account with BIL
        (bil.PayeeAccount.create, purpose CLAIM_PAYMENT) in the claim''s context. The IBAN is P2: passed to BIL only, never
        stored, logged, audited or published by CLM'
      properties:
        claimId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        partyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: The payee (the insured or a claimant of the claim)
        iban:
          type: string
          minLength: 15
          maxLength: 42
          description: IBAN (ISO 13616). P2.
        holderName:
          type: string
          minLength: 1
          maxLength: 140
        evidenceRef:
          type: string
          maxLength: 200
          description: Change evidence (document reference)
      required:
      - claimId
      - partyId
      - iban
      - holderName
    ClaimPayeeAccountView:
      type: object
      description: CLM's read model of a BIL payee account (PRD-07 §7.1 PayeeAccountView); masked only
      properties:
        payeeAccountId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        partyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        claimId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        maskedIban:
          type: string
          description: Last four characters, masked
        verificationStatus:
          $ref: ../events/common.schema.json#/$defs/Code
        coolingOffUntil:
          $ref: ../events/common.schema.json#/$defs/LocalDate
        change:
          type: boolean
        capturedAt:
          $ref: ../events/common.schema.json#/$defs/Instant
      required:
      - payeeAccountId
      - partyId
      - maskedIban
      - verificationStatus
    PayeeAccountCaptureResponse:
      type: object
      properties:
        payeeAccount:
          $ref: '#/components/schemas/ClaimPayeeAccountView'
      required:
      - payeeAccount
    PayeeAccountListPage:
      allOf:
      - $ref: common.yaml#/components/schemas/PageEnvelope
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/ClaimPayeeAccountView'
      description: Page of clm.PayeeAccount.list results (cursor pagination, contract §3.5.5)
    TransactionSetSubmitRequest:
      type: object
      properties:
        setId:
          $ref: ../events/common.schema.json#/$defs/Uuid
      required:
      - setId
      description: 'Typed from REQ-CLM-108, REQ-CLM-109. PRD inputs: "transactions"'
    TransactionSetSubmitResponse:
      type: object
      properties:
        setId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        status:
          $ref: ../events/common.schema.json#/$defs/Code
        approvalRequestId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        authorityChecks:
          type: array
          items:
            type: object
            properties:
              checkId:
                $ref: ../events/common.schema.json#/$defs/Uuid
              decision:
                type: string
                enum:
                - ALLOW
                - REFER
                - DENY
                description: plt.Authority.check
              txnId:
                $ref: ../events/common.schema.json#/$defs/Uuid
                description: Not set since D-SL2-13 (checks are per requirement, not per transaction)
              type:
                type: string
                description: Authority type (CLM.RESERVE, CLM.PAYMENT)
              costType:
                $ref: ../events/common.schema.json#/$defs/Code
              basis:
                type: string
                enum:
                - EXPOSURE_TOTAL_RESERVE
                - EXPOSURE_TOTAL_RECOVERY_RESERVE
                - RESERVE_DECREASE
                - PAYMENT
                - CLAIM_CUMULATIVE_PAID
                description: What the amount is (D-SL2-13, REQ-CLM-108)
              amount:
                $ref: ../events/common.schema.json#/$defs/Money
              referralRole:
                type: string
        set:
          $ref: '#/components/schemas/TransactionSetView'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/ClaimPaymentView'
          description: Payments of the set (Submitted to BIL when the set is approved within authority)
      required:
