  /api/rat/v1/dsar/export:
    post:
      operationId: rat.Dsar.export
      summary: DSAR fan-out target
      description: |-
        DSAR fan-out target

        PRD inputs: party's policy and quote refs
        PRD outputs: worksheet package
      tags:
      - Dsar
      x-requirement:
      - REQ-RAT-231
      x-wave: W3
      x-work-packages:
      - W3-RAT-02
      x-status: full
      x-maturity: pre-release
      x-operation-kind: command
      x-idempotency: required
      x-dry-run: false
      x-dry-run-note: 'PRD: Idempotency-Key'
      x-in-process: true
      x-exposure:
      - internal
      x-consumers:
      - CMP
      x-permission: rat.Dsar.export
      x-error-codes:
      - code: RAT-ERR-IDEMPOTENCY-MISMATCH
        note: contract §3.5.3 (replay with a different payload)
        status: 409
      x-source:
      - PRD-03 §9.1 l.1229
      parameters:
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/AcceptLanguage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DsarExportRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DsarExportResponse'
        '400':
          $ref: common.yaml#/components/responses/BadRequest
        '401':
          $ref: common.yaml#/components/responses/Unauthorized
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '409':
          $ref: common.yaml#/components/responses/Conflict
        '422':
          $ref: common.yaml#/components/responses/UnprocessableContent
        '500':
          $ref: common.yaml#/components/responses/InternalError
