  schemas:
    RateRateRequest:
      type: object
      properties:
        envelope:
          type: object
          properties:
            legalEntity:
              $ref: ../events/common.schema.json#/$defs/Code
            jurisdiction:
              $ref: ../events/common.schema.json#/$defs/CountryCode
            productCode:
              $ref: ../events/common.schema.json#/$defs/Code
            productArtefactHash:
              $ref: ../events/common.schema.json#/$defs/Sha256
            ratingArtefactHash:
              $ref: ../events/common.schema.json#/$defs/Sha256
            configurationHash:
              $ref: ../events/common.schema.json#/$defs/Sha256
            mode:
              type: string
              enum:
              - FULL
              - ENDORSEMENT
              - QUICK
              - RENEWAL
              - DRY_RUN
              description: Rating mode (REQ-RAT-038..041; DRY_RUN per PRD-03 §9.1; CANDIDATE is RAT-internal, REQ-RAT-043)
            transactionType:
              $ref: ../events/common.schema.json#/$defs/Code
            ratingBasisDate:
              $ref: ../events/common.schema.json#/$defs/LocalDate
            taxPointDate:
              $ref: ../events/common.schema.json#/$defs/LocalDate
            currency:
              $ref: ../events/common.schema.json#/$defs/CurrencyCode
            channel:
              $ref: ../events/common.schema.json#/$defs/Code
            producerCode:
              $ref: ../events/common.schema.json#/$defs/Code
            lineage:
              type: object
              properties:
                quoteId:
                  $ref: ../events/common.schema.json#/$defs/Uuid
                jobId:
                  $ref: ../events/common.schema.json#/$defs/Uuid
                transactionId:
                  $ref: ../events/common.schema.json#/$defs/Uuid
              description: Business lineage keys (contract D5)
            origin:
              type: string
              enum:
              - LIVE
              - MIGRATION
              description: REQ-RAT-044
          required:
          - legalEntity
          - jurisdiction
          - productCode
          - productArtefactHash
          - ratingArtefactHash
          - configurationHash
          - mode
          - transactionType
          - ratingBasisDate
          - currency
          description: Rating envelope (REQ-RAT-030)
        segments:
          type: array
          items:
            type: object
            properties:
              segmentId:
                type: string
                description: Segment id
              validPeriod:
                $ref: ../events/common.schema.json#/$defs/DatePeriod
              riskTree:
                $ref: ../events/common.schema.json#/$defs/OpenObject
                description: Risk tree snapshot; validated against the artefact's input schema (REQ-RAT-031)
            required:
            - segmentId
            - validPeriod
            - riskTree
          description: Segments (REQ-RAT-035)
          minItems: 1
        policyInputs:
          $ref: ../events/common.schema.json#/$defs/OpenObject
        history:
          $ref: ../events/common.schema.json#/$defs/OpenObject
        modificationRefs:
          type: array
          items:
            $ref: ../events/common.schema.json#/$defs/Uuid
          description: Pricing modifications (REQ-RAT-005)
        priorRates:
          type: array
          items:
            $ref: common.yaml#/components/schemas/Unspecified
          description: 'Renewal: prior annual rates (REQ-RAT-041)'
        explain:
          type: boolean
          description: Return explanation
      required:
      - envelope
      - segments
      description: 'Typed from REQ-RAT-001, REQ-RAT-030, REQ-RAT-035, REQ-RAT-036, REQ-RAT-038..041. PRD inputs: "envelope
        (`REQ-RAT-030`), segments, policy inputs, history, modifications refs, prior rates (renewal), explain flag"'
    RateRateResponse:
      type: object
      properties:
        rates:
          type: array
          items:
            type: object
            properties:
              segmentId:
                type: string
              elementId:
                type: string
              chargeType:
                $ref: ../events/common.schema.json#/$defs/Code
              chargeCategory:
                $ref: ../events/common.schema.json#/$defs/Code
              coverageCode:
                $ref: ../events/common.schema.json#/$defs/Code
              annualRate:
                $ref: ../events/common.schema.json#/$defs/Decimal
                description: Annual rate, scale 4
              currency:
                $ref: ../events/common.schema.json#/$defs/CurrencyCode
              ratingStep:
                type: string
              handling:
                type: string
                enum:
                - FLAT
                - PRORATABLE
                description: From PFC (REQ-RAT-036)
            required:
            - segmentId
            - elementId
            - chargeType
            - annualRate
            - currency
        taxes:
          type: array
          items:
            $ref: common.yaml#/components/schemas/Unspecified
