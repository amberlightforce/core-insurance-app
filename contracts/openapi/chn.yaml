  /api/chn/v1/agent/mcp:
    post:
      operationId: chn.Agent.mcp
      summary: MCP AI agent facade (tools/list, tools/call, resources/read)
      description: Agent facade (PRD-12 §9.1.1 `chn.Agent.tools/list`, `tools/call`, `resources/read`; tool catalogue §9.1.4).
        One JSON-RPC endpoint carries the three MCP methods, so they share one operationId here; `x-mcp-methods` lists the
        PRD names. Idempotency key per call = MCP request id + delegating subject (PRD). STATE_CHANGING tools with a ticket
        return a confirmation ticket (`chn.Ticket.*`).
      tags:
      - Agent
      x-requirement:
      - REQ-CHN-003
      - REQ-CHN-260..REQ-CHN-278
      x-anchor:
      - REQ-CHN-003
      x-wave: W8
      x-work-packages:
      - W8-CHN-01
      x-status: full
      x-name-derived: true
      x-prd-name:
      - chn.Agent.tools/list
      - chn.Agent.tools/call
      - chn.Agent.resources/read
      x-mcp-methods:
      - tools/list
      - tools/call
      - resources/read
      x-mcp-tools:
      - tool: product_info
        cls: READ
        transactionType: PRODUCT_READ
        ownerOperations:
        - pfc.Product.describe
        - doc.Ipid.get
        scope: product.read
        ticketRequired: 'No'
      - tool: quote_motor_dry_run
        cls: DRY_RUN
        transactionType: QUOTE_NEW
        ownerOperations:
        - pol.Submission.create
        - pol.Job.quote
        scope: motor.quote
        ticketRequired: 'No'
      - tool: explain_price
        cls: READ
        transactionType: QUOTE_READ
        ownerOperations:
        - rat.Breakdown.get
        - rat.Worksheet.explain
        scope: motor.quote
        ticketRequired: 'No'
      - tool: quote_motor_save
        cls: STATE_CHANGING
        transactionType: QUOTE_NEW
        ownerOperations:
        - pol.Submission.create
        scope: motor.quote
        ticketRequired: No (no legal effect; matrix `agent_without_ticket`)
      - tool: quote_motor_bind
        cls: STATE_CHANGING
        transactionType: BIND_NEW
        ownerOperations:
        - pol.Job.bind
        scope: motor.bind
        ticketRequired: 'Yes'
      - tool: policy_summary
        cls: READ
        transactionType: POLICY_READ
        ownerOperations:
        - pol.Policy.get
        scope: policy.read
        ticketRequired: 'No'
      - tool: policy_change_preview
        cls: DRY_RUN
        transactionType: per intent (CHANGE_ADDRESS, ADD_DRIVER …)
        ownerOperations:
        - pol.PolicyChange.create
        scope: policy.change.preview
        ticketRequired: 'No'
      - tool: policy_change_submit
        cls: STATE_CHANGING
        transactionType: per intent
        ownerOperations:
        - pol.Job.bind
        - wrk.Request.submit
        scope: policy.change
        ticketRequired: 'Yes'
      - tool: cancellation_request
        cls: STATE_CHANGING
        transactionType: CANCEL_REQUEST
        ownerOperations:
        - pol.Cancellation.create
        - wrk.Request.submit
        scope: policy.cancel.request
        ticketRequired: 'Yes'
      - tool: billing_status
        cls: READ
        transactionType: BILLING_READ
        ownerOperations:
        - bil.BillingAccount.get
        scope: billing.read
        ticketRequired: 'No'
      - tool: payment_link_create
        cls: STATE_CHANGING
        transactionType: PAY
        ownerOperations:
        - bil.Payment.take
        scope: billing.pay
        ticketRequired: No (link creation has no financial effect; payment itself needs the human)
      - tool: claim_report_draft
        cls: STATE_CHANGING
        transactionType: FNOL
        ownerOperations:
        - clm.Fnol.saveDraft
        - clm.Fnol.validate
        scope: claim.report
        ticketRequired: 'No'
      - tool: claim_report_submit
        cls: STATE_CHANGING
        transactionType: FNOL
        ownerOperations:
        - clm.Fnol.submit
        scope: claim.report
        ticketRequired: 'Yes'
      - tool: claim_status
        cls: READ
        transactionType: CLAIM_READ
        ownerOperations:
        - clm.ClaimTracking.get
        scope: claim.read
        ticketRequired: 'No'
      - tool: documents_list` / `document_get
        cls: READ
        transactionType: DOCUMENT_READ
        ownerOperations:
        - doc.Document.listForObject
        scope: document.read
        ticketRequired: 'No'
      - tool: request_submit
        cls: STATE_CHANGING
        transactionType: GENERAL_REQUEST
        ownerOperations:
        - wrk.Request.submit
        scope: request.submit
        ticketRequired: No (request creation is not a legal act)
      - tool: search` (staff agents only)
        cls: READ
        transactionType: SEARCH
        ownerOperations:
        - wrk.Search.global
        scope: search
        ticketRequired: 'No'
      x-operation-kind: command
      x-idempotency: required
      x-dry-run: false
      x-dry-run-note: DRY_RUN tools (quote_motor_dry_run, policy_change_preview) call owner operations with dryRun
      x-maturity: pre-release
      x-exposure:
      - partner
      x-permission: chn.Agent.mcp
      x-error-codes:
      - code: CHN-ERR-IDEMPOTENCY-MISMATCH
        status: 409
        note: contract §3.5.3
      x-error-notes: 'PRD: 401, 403 insufficient_scope, 429'
      x-source:
      - PRD-12 §9.1.1 l.1841
      - PRD-12 §9.1.4
      parameters:
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/Traceparent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentMcpRequest'
      responses:
        '200':
          description: JSON-RPC response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMcpResponse'
        '400':
          $ref: common.yaml#/components/responses/BadRequest
        '401':
          $ref: common.yaml#/components/responses/Unauthorized
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '409':
          $ref: common.yaml#/components/responses/Conflict
        '429':
          $ref: common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: common.yaml#/components/responses/InternalError
      security:
      - partnerClientCredentials: []
      - entra: []
