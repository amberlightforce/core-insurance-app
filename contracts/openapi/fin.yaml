    PostingRulesListItem:
      type: object
      description: 'One posting rule of a rule-set version in force (REQ-FIN-048, -050). FIN posts from BIL BillingEntryPosted (REQ-FIN-036, D-SLC-12): each sub-ledger line of an entry is matched to exactly one rule by entry type, source sub-ledger account and the optional charge-category and charge-type qualifiers (most qualifiers wins, REQ-FIN-049). The rule names the book account, fixed or derived from the charge type GL key through the account-derivation table; side and amount are those of the source line, so a balanced entry yields a balanced journal.'
      properties:
        ruleSetId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        ruleSetVersion:
          type: integer
          minimum: 1
        ruleSetStatus:
          type: string
          enum:
          - ACTIVE
          - SUPERSEDED
        legalEntity:
          $ref: ../events/common.schema.json#/$defs/Code
        book:
          $ref: ../events/common.schema.json#/$defs/Code
        effectiveFrom:
          $ref: ../events/common.schema.json#/$defs/LocalDate
        contentHash:
          $ref: ../events/common.schema.json#/$defs/Sha256
        ruleCode:
          $ref: ../events/common.schema.json#/$defs/Code
        sourceEventType:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Registry name of the posting source, e.g. bil.BillingEntryPosted
        entryType:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Entry type of the source fact (BillingEntryPosted payload eventType, e.g. WRITTEN)
        sourceAccount:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Sub-ledger account of the source line (PRD-06 LA-xx)
        chargeCategory:
          description: Charge-category qualifier; null matches any
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Code
          - type: 'null'
        chargeType:
          description: Charge-type qualifier; null matches any
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Code
          - type: 'null'
        specificity:
          type: integer
          minimum: 0
          description: Number of qualifiers; the most specific matching rule wins (REQ-FIN-049)
        account:
          description: Fixed book account; null when derived
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Code
          - type: 'null'
        accountOrigin:
          description: Origin of the fixed account's code; null when derived
          oneOf:
          - $ref: '#/components/schemas/FinAccountCodeOrigin'
          - type: 'null'
        deriveFrom:
          description: Account derivation source (REQ-FIN-050); null when the account is fixed
          oneOf:
          - type: string
            enum:
            - GL_KEY
          - type: 'null'
        description:
          $ref: '#/components/schemas/FinLocalizedText'
      required:
      - ruleSetId
      - ruleSetVersion
      - ruleSetStatus
      - legalEntity
      - book
      - effectiveFrom
      - contentHash
      - ruleCode
      - sourceEventType
      - entryType
      - sourceAccount
      - specificity
      - description
