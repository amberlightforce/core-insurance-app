components:
  securitySchemes:
    entra:
      $ref: common.yaml#/components/securitySchemes/entra
  schemas:
    PartySearchItem:
      type: object
      description: 'Typed by SL-0 from REQ-PTY-001, REQ-PTY-069. One ranked pty.Party.search result; P2 values masked (REQ-PTY-044).'
      properties:
        partyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        partyNumber:
          $ref: ../events/common.schema.json#/$defs/BusinessNumber
        partyType:
          $ref: '#/components/schemas/PartyType'
        status:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Party status (PRD-01 §7.3, upper-snake code)
        displayName:
          type: string
          description: Display name in the native script
        displayNameLatin:
          type:
          - string
          - 'null'
          description: Latin display name (as on ID document when held, else generated), null when the native name is Latin
        maskedIdentifier:
          oneOf:
          - $ref: '#/components/schemas/MaskedIdentifier'
          - type: 'null'
        primaryPostcode:
          type:
          - string
          - 'null'
        primaryLocality:
          type:
          - string
          - 'null'
        matchQuality:
          type: string
          enum:
          - EXACT
          - PREFIX
          - FUZZY
          description: Exact and prefix matches rank before fuzzy matches (REQ-PTY-066)
        similarity:
          $ref: ../events/common.schema.json#/$defs/Decimal
          description: Trigram similarity of the best-matching key, 0..1 as a decimal string
      required:
      - partyId
      - partyNumber
      - partyType
      - status
      - displayName
      - matchQuality
      - similarity
    PartySearchCriteria:
      type: object
      description: 'Body of pty.Party.searchByCriteria (D-SLC-05). At least one criterion.'
      properties:
        criteria:
          type:
          - string
          - 'null'
          maxLength: 200
          description: 'Single search box (SCR-PTY-01): a name in any script, a party number or an identifier value (at least 2 characters)'
        name:
          type:
          - string
          - 'null'
          maxLength: 200
        identifierScheme:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Identifier scheme for an exact search through the blind index (REQ-PTY-060); needs identifierValue
        identifierValue:
          type:
          - string
          - 'null'
          maxLength: 100
          description: Identifier value (P2; never logged)
        partyNumber:
          type:
          - string
          - 'null'
          maxLength: 64
    MaskedIdentifier:
      type: object
      description: An identifier shown masked (last three characters only, REQ-PTY-044).
      properties:
        scheme:
          $ref: ../events/common.schema.json#/$defs/Code
        maskedValue:
          type: string
      required:
      - scheme
      - maskedValue
    PartyType:
      type: string
      enum:
      - PERSON
      - ORGANISATION
      description: Person or Organisation, immutable (REQ-PTY-030)
    PartyView:
      type: object
      description: 'Typed by SL-0 from REQ-PTY-001, REQ-PTY-012, REQ-PTY-031, REQ-PTY-035, REQ-PTY-044. The party as valid at validAt and known at knownAt.'
      properties:
        partyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        partyNumber:
          $ref: ../events/common.schema.json#/$defs/BusinessNumber
        partyType:
          $ref: '#/components/schemas/PartyType'
        status:
          $ref: ../events/common.schema.json#/$defs/Code
        legalEntity:
          type: string
          description: Legal entity code of the row (REQ-PTY-035)
        jurisdiction:
          $ref: ../events/common.schema.json#/$defs/CountryCode
        preferredLanguage:
          $ref: ../events/common.schema.json#/$defs/LanguageCode
        recordVersion:
          type: integer
          minimum: 1
          description: Optimistic concurrency version (REQ-PTY-043)
        birthDate:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/LocalDate
          - type: 'null'
          description: P2; null when masked (see p2Revealed) or not held
        p2Revealed:
          type: boolean
          description: True when P2 values are shown unmasked (permission pty.Party.revealP2 and a purpose; the view is audited)
        names:
          type: array
          items:
            $ref: '#/components/schemas/PartyNameView'
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/PartyIdentifierView'
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/PartyAddressView'
        contactPoints:
          type: array
          items:
            $ref: '#/components/schemas/ContactPointView'
        createdAt:
          $ref: ../events/common.schema.json#/$defs/Instant
      required:
      - partyId
      - partyNumber
      - partyType
      - status
      - legalEntity
      - jurisdiction
      - preferredLanguage
      - recordVersion
      - p2Revealed
      - names
      - identifiers
      - addresses
      - contactPoints
      - createdAt
    PartyNameView:
      type: object
      description: One name form (REQ-PTY-061..063).
      properties:
        form:
          type: string
          enum:
          - NATIVE
          - LATIN_GENERATED
          - LATIN_AS_ON_DOCUMENT
        script:
          type: string
          description: ISO 15924 script code (Grek, Latn, Cyrl, ...)
        givenNames:
          type:
          - string
          - 'null'
        familyName:
          type:
          - string
          - 'null'
        fatherName:
          type:
          - string
          - 'null'
        motherName:
          type:
          - string
          - 'null'
        organisationName:
          type:
          - string
          - 'null'
        tradeName:
