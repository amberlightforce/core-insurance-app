      description: Page of pty.ProducerCode.search results (cursor pagination, contract §3.5.5)
    IntermediaryCreateRequest:
      type: object
      description: 'pty.Intermediary.create request. Typed by SL-0 from REQ-PTY-187, REQ-PTY-188, REQ-PTY-204, REQ-PTY-205 (subset). The intermediary is an existing party; a producer code is issued through the numbering service.'
      properties:
        partyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        intermediaryType:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Category code from the country pack's intermediary category list (REQ-PTY-187)
        register:
          $ref: '#/components/schemas/IntermediaryRegisterInput'
        authorities:
          $ref: '#/components/schemas/ProducerAuthorities'
        validFrom:
          $ref: ../events/common.schema.json#/$defs/LocalDate
          description: First day the producer code is valid
      required:
      - partyId
      - intermediaryType
      - register
      - authorities
      - validFrom
    IntermediaryRegisterInput:
      type: object
      description: Register data recorded by manual verification (REQ-PTY-188, REQ-PTY-189 Greece pack manual verification).
      properties:
        registerName:
          type: string
          minLength: 1
          maxLength: 200
        chamber:
          type: string
          minLength: 1
          maxLength: 200
        registerNumber:
          type: string
          minLength: 1
          maxLength: 50
        registrationCategory:
          $ref: ../events/common.schema.json#/$defs/Code
        registrationDate:
          $ref: ../events/common.schema.json#/$defs/LocalDate
        registerStatus:
          $ref: '#/components/schemas/RegisterStatus'
        verificationLink:
          type:
          - string
          - 'null'
          maxLength: 500
        evidenceRef:
          type:
          - string
          - 'null'
          maxLength: 200
      required:
      - registerName
      - chamber
      - registerNumber
      - registrationCategory
      - registrationDate
      - registerStatus
    RegisterStatus:
      type: string
      enum:
      - ACTIVE
      - SUSPENDED
      - DELETED
      description: Register / authorisation status (REQ-PTY-190)
    ProducerAuthorities:
      type: object
      description: Authorities per producer code (REQ-PTY-205); limits arrive with W2-PTY-04.
      properties:
        collectPremium:
          type: boolean
        issueCoverNotes:
          type: boolean
        bindWithinAuthority:
          type: boolean
        serviceOnly:
          type: boolean
      required:
      - collectPremium
      - issueCoverNotes
      - bindWithinAuthority
      - serviceOnly
    IntermediaryStatus:
      type: string
      enum:
      - ONBOARDING
      - ACTIVE
      - SUSPENDED
      - TERMINATED
      description: Intermediary lifecycle (REQ-PTY-198)
    IntermediaryView:
      type: object
      properties:
        intermediaryId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        partyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        partyNumber:
          $ref: ../events/common.schema.json#/$defs/BusinessNumber
        name:
          type: string
        intermediaryType:
          $ref: ../events/common.schema.json#/$defs/Code
        status:
          $ref: '#/components/schemas/IntermediaryStatus'
        registerNumber:
          type: string
        registerStatus:
          $ref: '#/components/schemas/RegisterStatus'
        producerCode:
          $ref: ../events/common.schema.json#/$defs/Code
        producerCodeStatus:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - TERMINATED
        authorities:
          $ref: '#/components/schemas/ProducerAuthorities'
        validFrom:
          $ref: ../events/common.schema.json#/$defs/LocalDate
        recordVersion:
          type: integer
          minimum: 1
        parentIntermediaryId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: Hierarchy parent (REQ-PTY-193)
        cpdStatus:
          type: string
          enum:
          - COMPLIANT
          - AT_RISK
          - NON_COMPLIANT
          description: Computed from the CPD hours table (REQ-PTY-191)
      required:
      - intermediaryId
      - partyId
      - partyNumber
      - name
      - intermediaryType
      - status
      - registerNumber
      - registerStatus
      - producerCode
      - producerCodeStatus
      - authorities
      - validFrom
      - recordVersion
    IntermediaryCreateResponse:
      type: object
      description: 'pty.Intermediary.create result. Typed by SL-0.'
      properties:
        intermediary:
          $ref: '#/components/schemas/IntermediaryView'
      required:
      - intermediary
    IntermediaryUpdateRequest:
      type: object
      description: 'pty.Intermediary.update request. Typed by SL-0 for the lifecycle transition Onboarding → Active only (REQ-PTY-198); other attributes arrive with W2-PTY-04.'
      properties:
        status:
          $ref: '#/components/schemas/IntermediaryStatus'
        expectedRecordVersion:
          type: integer
          minimum: 1
          description: Optimistic concurrency (REQ-PTY-043)
        reason:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Code
          - type: 'null'
      required:
      - status
      - expectedRecordVersion
    IntermediaryUpdateResponse:
      type: object
      description: 'pty.Intermediary.update result. Typed by SL-0.'
      properties:
        intermediary:
          $ref: '#/components/schemas/IntermediaryView'
      required:
      - intermediary
    IntermediarySuspendRequest:
      type: object
      description: 'pty.Intermediary.suspend request (REQ-PTY-198, REQ-PTY-190): Active to Suspended; validate then refuses the producer codes.'
      properties:
        intermediaryId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        expectedRecordVersion:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - intermediaryId
      - expectedRecordVersion
      - reason
    IntermediarySuspendResponse:
      type: object
      description: 'pty.Intermediary.suspend result.'
      properties:
        intermediary:
          $ref: '#/components/schemas/IntermediaryView'
      required:
      - intermediary
    IntermediaryTerminateRequest:
      type: object
      description: 'pty.Intermediary.terminate request (REQ-PTY-198, REQ-PTY-202): ends every producer code of the intermediary on the effective date.'
      properties:
        intermediaryId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        expectedRecordVersion:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 500
        effectiveDate:
          $ref: ../events/common.schema.json#/$defs/LocalDate
          description: Last-day boundary of the producer codes (defaults to today)
      required:
      - intermediaryId
      - expectedRecordVersion
      - reason
    IntermediaryTerminateResponse:
      type: object
      description: 'pty.Intermediary.terminate result.'
      properties:
        intermediary:
          $ref: '#/components/schemas/IntermediaryView'
        terminatedProducerCodes:
          type: array
          items:
            $ref: ../events/common.schema.json#/$defs/Code
      required:
      - intermediary
      - terminatedProducerCodes
    IntermediaryImportRegisterRequest:
      type: object
      description: 'pty.Intermediary.importRegister request. A register extract (CSV with header, or JSON array) matched to intermediaries by register number; re-importing the same file changes nothing.'
      properties:
        format:
          type: string
          enum:
          - CSV
          - JSON
        content:
          type: string
          maxLength: 5000000
          description: 'Rows with registerNumber, registerStatus (ACTIVE, SUSPENDED, DELETED), optional registerName, chamber, registrationCategory, cpdYear, cpdHours, parentRegisterNumber'
      required:
      - format
      - content
    IntermediaryImportRegisterResponse:
      type: object
      description: 'pty.Intermediary.importRegister result.'
      properties:
        processed:
          type: integer
        updated:
          type: integer
        unchanged:
          type: integer
        unmatchedRegisterNumbers:
          type: array
          items:
            type: string
        rejectedRows:
          type: array
          items:
            type: string
          description: 'Row number and reason of each invalid row'
      required:
      - processed
      - updated
      - unchanged
      - unmatchedRegisterNumbers
      - rejectedRows
    ProducerOfRecordEntry:
      type: object
      description: 'One producer-of-record segment of a policy (BO-PTY-09, REQ-PTY-218): the producer code responsible from validFrom until validTo (open end = still responsible). Append-only: a change supersedes rows (status SUPERSEDED) and never rewrites them.'
      properties:
        porId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        policyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        policyTermId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: The term in whose context the change was made
        intermediaryId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        producerCode:
          $ref: ../events/common.schema.json#/$defs/Code
        validFrom:
          $ref: ../events/common.schema.json#/$defs/LocalDate
        validTo:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/LocalDate
          - type: 'null'
          description: First day the code is no longer responsible; null = open ended
        reason:
          type: string
          enum:
          - BROKER_OF_RECORD_LETTER
          - INTERMEDIARY_LEFT
          - CUSTOMER_REQUEST
          - PORTFOLIO_TRANSFER
          - CORRECTION
          - OTHER
        note:
          oneOf:
          - type: string
            maxLength: 500
          - type: 'null'
        commissionConsequence:
          type: string
          enum:
          - NEW_PRODUCER_FROM_DATE
          - OLD_PRODUCER_KEEPS_EARNED
          - OLD_PRODUCER_KEEPS_ALL
          description: Which producer earns the commission on the term from the effective date
        splitShare:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Decimal
          - type: 'null'
          description: Percent (above 0, at most 100) of the commission the new producer earns when it is shared with the previous one
        letterReference:
          oneOf:
          - type: string
            maxLength: 100
          - type: 'null'
          description: Broker-of-record letter reference; required when the responsible intermediary changes
        transferId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: Set when the row came from a bulk transfer
        status:
          type: string
          enum:
          - CURRENT
          - SUPERSEDED
          description: SUPERSEDED rows are history (a later change or a cancellation replaced them)
        recordedAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        recordedBy:
          type: string
      required:
      - porId
      - policyId
      - policyTermId
      - intermediaryId
      - producerCode
      - validFrom
      - reason
      - commissionConsequence
      - status
      - recordedAt
      - recordedBy
    ProducerOfRecordGetResponse:
      type: object
      description: 'pty.ProducerOfRecord.get result (BO-PTY-09): the producer of record of a policy on a date and the whole history, oldest first'
      properties:
        policyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        date:
          $ref: ../events/common.schema.json#/$defs/LocalDate
        current:
          oneOf:
          - $ref: '#/components/schemas/ProducerOfRecordEntry'
          - type: 'null'
          description: The segment responsible on the date; null when no change was ever recorded (the term's own producer code applies)
        history:
          type: array
          items:
            $ref: '#/components/schemas/ProducerOfRecordEntry'
      required:
      - policyId
      - date
      - history
    ProducerOfRecordChangeRequest:
      type: object
      description: 'pty.ProducerOfRecord.change request (BO-PTY-09, REQ-PTY-218): change the producer of record of a policy term mid-term without a policy transaction. The new code must be active, its intermediary not suspended or terminated, and the product appointed. A change of intermediary needs the broker-of-record letter reference. The effective date must be inside the term and after the commission settled date. Supports dry-run.'
      properties:
        termId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        producerCode:
          $ref: ../events/common.schema.json#/$defs/Code
        effectiveDate:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/LocalDate
          - type: 'null'
          description: Required unless atRenewal is true
        atRenewal:
          type: boolean
          description: true = the change starts on the first day after the term (the renewal); the effective date is then ignored
        reason:
          type: string
          enum:
          - BROKER_OF_RECORD_LETTER
          - INTERMEDIARY_LEFT
          - CUSTOMER_REQUEST
          - PORTFOLIO_TRANSFER
          - CORRECTION
          - OTHER
        note:
          oneOf:
          - type: string
            maxLength: 500
          - type: 'null'
        commissionConsequence:
          type: string
          enum:
          - NEW_PRODUCER_FROM_DATE
          - OLD_PRODUCER_KEEPS_EARNED
          - OLD_PRODUCER_KEEPS_ALL
        splitShare:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Decimal
          - type: 'null'
        letterReference:
          oneOf:
          - type: string
            maxLength: 100
          - type: 'null'
      required:
      - termId
      - producerCode
      - reason
      - commissionConsequence
    ProducerOfRecordChangeResponse:
      type: object
      description: 'pty.ProducerOfRecord.change result'
      properties:
        entry:
          $ref: '#/components/schemas/ProducerOfRecordEntry'
        previousProducerCode:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Code
          - type: 'null'
      required:
      - entry
    ProducerOfRecordBulkTransferItem:
      type: object
      description: One policy term of a bulk transfer
      properties:
        termId:
          $ref: ../events/common.schema.json#/$defs/Uuid
      required:
      - termId
    ProducerOfRecordBulkTransferRequest:
      type: object
      description: 'pty.ProducerOfRecord.bulkTransfer request (BO-PTY-09): move the given policy terms to one producer code with the same rules as change, one result per term (a refused term does not stop the others). At most 500 terms. Supports dry-run.'
      properties:
        terms:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/ProducerOfRecordBulkTransferItem'
        producerCode:
          $ref: ../events/common.schema.json#/$defs/Code
        effectiveDate:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/LocalDate
          - type: 'null'
        atRenewal:
          type: boolean
        reason:
          type: string
          enum:
          - BROKER_OF_RECORD_LETTER
          - INTERMEDIARY_LEFT
          - CUSTOMER_REQUEST
          - PORTFOLIO_TRANSFER
          - CORRECTION
          - OTHER
        note:
          oneOf:
          - type: string
            maxLength: 500
          - type: 'null'
        commissionConsequence:
          type: string
          enum:
          - NEW_PRODUCER_FROM_DATE
          - OLD_PRODUCER_KEEPS_EARNED
          - OLD_PRODUCER_KEEPS_ALL
        letterReference:
          oneOf:
          - type: string
            maxLength: 100
          - type: 'null'
      required:
      - terms
      - producerCode
      - reason
      - commissionConsequence
    ProducerOfRecordBulkTransferResult:
      type: object
      description: Outcome of one term in a bulk transfer
      properties:
        termId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        outcome:
          type: string
          enum:
          - TRANSFERRED
          - REFUSED
        errorCode:
          oneOf:
          - type: string
            maxLength: 100
          - type: 'null'
        message:
          oneOf:
          - type: string
            maxLength: 500
          - type: 'null'
        entry:
          oneOf:
          - $ref: '#/components/schemas/ProducerOfRecordEntry'
          - type: 'null'
      required:
      - termId
      - outcome
    ProducerOfRecordBulkTransferResponse:
      type: object
      description: 'pty.ProducerOfRecord.bulkTransfer result: per-term outcome'
      properties:
        transferId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        transferred:
          type: integer
        refused:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProducerOfRecordBulkTransferResult'
      required:
      - transferId
      - transferred
      - refused
      - results
    ProducerOfRecordCancelRequest:
      type: object
      description: 'pty.ProducerOfRecord.cancel request (BO-PTY-09): withdraw a change that has not taken effect yet (validFrom after today); the previous producer carries on. A change already in force cannot be cancelled: change it again.'
      properties:
        porId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - porId
      - reason
    ProducerOfRecordCancelResponse:
      type: object
      description: 'pty.ProducerOfRecord.cancel result: the policy history after the cancellation'
      properties:
        policyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        history:
          type: array
          items:
            $ref: '#/components/schemas/ProducerOfRecordEntry'
      required:
      - policyId
      - history
    CommissionAgreementResolveRequest:
      type: object
      description: 'pty.CommissionAgreement.resolve request (BO-PTY-11, REQ-PTY-010): which commission rate applies on a date. Give the policy (the producer of record on the date is found, with any split) or the intermediary directly. Nothing is written.'
      properties:
        policyId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: The policy whose producer of record on the date earns the commission; when it has no producer-of-record change, give intermediaryId
        intermediaryId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: The intermediary to resolve for when the policy has no producer-of-record change (the term's own producer) or no policy is given
        productCode:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Code
          - type: 'null'
        lineOfBusiness:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Code
          - type: 'null'
        date:
          $ref: ../events/common.schema.json#/$defs/LocalDate
          description: The date the agreement version must be in force
        businessType:
          type: string
          enum:
          - NEW_BUSINESS
          - RENEWAL
        basis:
          type: string
          enum:
          - NET_PREMIUM
          - GROSS_PREMIUM
      required:
      - date
      - businessType
      - basis
    CommissionResolvedProducer:
      type: object
      description: 'One producer that earns a share of the commission and the rate that applies to it (BO-PTY-11). resolved=false means no commission is due to this producer, with the reason.'
      properties:
        intermediaryId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        producerCode:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Code
          - type: 'null'
        role:
          type: string
          enum:
          - PRODUCER
          - PREVIOUS_PRODUCER
        sharePct:
          $ref: ../events/common.schema.json#/$defs/Decimal
          description: Percent of the commission this producer earns (100 when not split)
        resolved:
          type: boolean
        reason:
          oneOf:
          - type: string
            enum:
            - NO_AGREEMENT
            - NO_RATE_LINE
          - type: 'null'
        agreementId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
        versionId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
        versionNo:
          oneOf:
          - type: integer
          - type: 'null'
        scopeKey:
          oneOf:
          - type: string
          - type: 'null'
          description: product|line of the agreement that won, "*" for all
        rateLine:
          oneOf:
          - $ref: '#/components/schemas/CommissionRateLine'
          - type: 'null'
        explanation:
          type: array
          items:
            type: string
          description: 'Why this line won, in order: scopes considered most specific first, then business type, then line'
      required:
      - intermediaryId
      - role
      - sharePct
      - resolved
      - explanation
    CommissionAgreementResolveResponse:
      type: object
      description: 'pty.CommissionAgreement.resolve result (BO-PTY-11). outcome NO_COMMISSION is explicit, never a silent zero: reason says why. Same inputs always give the same answer.'
      properties:
        date:
          $ref: ../events/common.schema.json#/$defs/LocalDate
        outcome:
          type: string
          enum:
          - RESOLVED
          - NO_COMMISSION
        reason:
          oneOf:
          - type: string
            enum:
            - NO_PRODUCER
            - NO_AGREEMENT
            - NO_RATE_LINE
            - PRODUCER_KEEPS_ALL_NOT_FOUND
          - type: 'null'
        reasonText:
          oneOf:
          - type: string
          - type: 'null'
        producers:
          type: array
          items:
            $ref: '#/components/schemas/CommissionResolvedProducer'
      required:
      - date
      - outcome
      - producers
    CommissionRateLine:
      type: object
      description: One commission rate of a version, for a kind of business, optionally a line of business, on a premium basis
      properties:
        businessType:
          type: string
          enum:
          - NEW_BUSINESS
          - RENEWAL
          - ANY
        lineOfBusiness:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Code
          - type: 'null'
          description: Null = every line
        basis:
          type: string
          enum:
          - NET_PREMIUM
          - GROSS_PREMIUM
        ratePct:
          $ref: ../events/common.schema.json#/$defs/Decimal
          description: Commission rate in percent, 0 to the maximum, at most 4 decimals (decimal string)
      required:
      - businessType
      - basis
      - ratePct
    CommissionAgreementVersionView:
      type: object
      description: A version of a commission agreement. Once ACTIVE it is never edited; a change is a new version.
      properties:
        versionId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        agreementId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        versionNo:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - DRAFT
          - PENDING_APPROVAL
          - ACTIVE
          - REJECTED
        effectiveFrom:
          $ref: ../events/common.schema.json#/$defs/LocalDate
        effectiveTo:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/LocalDate
          - type: 'null'
          description: Last day in force, derived from the next ACTIVE version; null while it is the latest
        expectedAnnualVolume:
          $ref: ../events/common.schema.json#/$defs/Money
        maxRatePct:
          $ref: ../events/common.schema.json#/$defs/Decimal
        rateLines:
          type: array
          items:
            $ref: '#/components/schemas/CommissionRateLine'
        contentHash:
          $ref: ../events/common.schema.json#/$defs/Sha256
        approvalRequestId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
        notes:
          oneOf:
          - type: string
          - type: 'null'
        createdBy:
          type: string
        createdAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        submittedBy:
          oneOf:
          - type: string
          - type: 'null'
        decidedBy:
          oneOf:
          - type: string
          - type: 'null'
        decidedAt:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Instant
          - type: 'null'
        decisionComment:
          oneOf:
          - type: string
          - type: 'null'
      required:
      - versionId
      - agreementId
      - versionNo
      - status
      - effectiveFrom
      - expectedAnnualVolume
      - maxRatePct
      - rateLines
      - contentHash
      - createdBy
      - createdAt
    CommissionAgreementView:
      type: object
      description: A commission agreement (BO-PTY-10, REQ-PTY-010) of one intermediary for one scope, with its versions
      properties:
        agreementId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        intermediaryId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        productCode:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Code
          - type: 'null'
        lineOfBusiness:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Code
          - type: 'null'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/CommissionAgreementVersionView'
      required:
      - agreementId
      - intermediaryId
      - versions
    CommissionFieldChange:
      type: object
      description: A scalar field that differs between two versions
      properties:
        field:
          type: string
        from:
          oneOf:
          - type: string
          - type: 'null'
        to:
          oneOf:
          - type: string
          - type: 'null'
      required:
      - field
    CommissionRateLineChange:
      type: object
      description: A rate line added, removed or changed between two versions (lines match on business type, line of business and basis)
      properties:
        kind:
          type: string
          enum:
          - ADDED
          - REMOVED
          - CHANGED
        businessType:
          type: string
        lineOfBusiness:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Code
          - type: 'null'
        basis:
          type: string
        fromRatePct:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Decimal
          - type: 'null'
        toRatePct:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Decimal
          - type: 'null'
      required:
      - kind
      - businessType
      - basis
    CommissionAgreementGetResponse:
      type: object
      description: 'pty.CommissionAgreement.get result (BO-PTY-10): the agreement with all its versions, oldest first'
      properties:
        agreement:
          $ref: '#/components/schemas/CommissionAgreementView'
      required:
      - agreement
    CommissionAgreementCreateVersionRequest:
      type: object
      description: 'pty.CommissionAgreement.createVersion request (BO-PTY-10). Creates the agreement for the scope (intermediary, optional product and line) when it does not exist and adds a DRAFT version. Refused for an intermediary that is not ACTIVE, for a rate above the maximum, for an effective date at or before the settled date and for an effective date not after the latest version.'
      properties:
        intermediaryId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        productCode:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Code
          - type: 'null'
          description: Product the agreement is limited to; null = every product
        lineOfBusiness:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Code
          - type: 'null'
          description: Line of business the agreement is limited to; null = every line
        effectiveFrom:
          $ref: ../events/common.schema.json#/$defs/LocalDate
        expectedAnnualVolume:
          $ref: ../events/common.schema.json#/$defs/Money
          description: Expected annual premium volume (EUR); with the highest rate it decides who may approve
        rateLines:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/CommissionRateLine'
        notes:
          oneOf:
          - type: string
            maxLength: 1000
          - type: 'null'
      required:
      - intermediaryId
      - effectiveFrom
      - expectedAnnualVolume
      - rateLines
    CommissionAgreementCreateVersionResponse:
      type: object
      description: 'pty.CommissionAgreement.createVersion result'
      properties:
        agreement:
          $ref: '#/components/schemas/CommissionAgreementView'
        version:
          $ref: '#/components/schemas/CommissionAgreementVersionView'
      required:
      - agreement
      - version
    CommissionAgreementSubmitRequest:
      type: object
      description: 'pty.CommissionAgreement.submit request (BO-PTY-10): DRAFT to PENDING_APPROVAL; the submitter becomes the maker of the PLT approval request.'
      properties:
        versionId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        reason:
          oneOf:
          - type: string
            maxLength: 500
          - type: 'null'
      required:
      - versionId
    CommissionAgreementSubmitResponse:
      type: object
      description: 'pty.CommissionAgreement.submit result'
      properties:
        version:
          $ref: '#/components/schemas/CommissionAgreementVersionView'
      required:
      - version
    CommissionAgreementApproveRequest:
      type: object
      description: 'pty.CommissionAgreement.approve request (BO-PTY-10): the checker approves or rejects a PENDING_APPROVAL version. The maker and anyone who edited it cannot decide (PLT-ERR-SELF-APPROVAL, PLT-ERR-EDITOR-CANNOT-APPROVE); the checker needs commission authority for the expected volume and the highest rate. Supports dry-run.'
      properties:
        versionId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
        comment:
          oneOf:
          - type: string
            maxLength: 500
          - type: 'null'
        contentHash:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Sha256
          - type: 'null'
          description: Hash of the content the checker reviewed; when given it must match the stored version
      required:
      - versionId
      - decision
    CommissionAgreementApproveResponse:
      type: object
      description: 'pty.CommissionAgreement.approve result'
      properties:
        version:
          $ref: '#/components/schemas/CommissionAgreementVersionView'
      required:
      - version
    CommissionAgreementCompareResponse:
      type: object
      description: 'pty.CommissionAgreement.compare result (BO-PTY-10): what differs between two versions of one agreement'
      properties:
        agreementId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        fromVersionId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        toVersionId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        identical:
          type: boolean
        fieldChanges:
          type: array
          items:
            $ref: '#/components/schemas/CommissionFieldChange'
        rateLineChanges:
          type: array
          items:
            $ref: '#/components/schemas/CommissionRateLineChange'
      required:
      - agreementId
      - fromVersionId
      - toVersionId
      - identical
      - fieldChanges
      - rateLineChanges
