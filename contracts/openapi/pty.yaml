      properties:
        policyId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
        intermediaryId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
        productCode:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Code
          - type: 'null'
        date:
          $ref: ../events/common.schema.json#/$defs/LocalDate
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/CommissionSimulateLine'
      required:
      - date
      - lines
    CommissionAllocation:
      type: object
      description: The commission one producer earns on a simulated line
      properties:
        intermediaryId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        producerCode:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Code
          - type: 'null'
        sharePct:
          $ref: ../events/common.schema.json#/$defs/Decimal
        ratePct:
          $ref: ../events/common.schema.json#/$defs/Decimal
        commission:
          $ref: ../events/common.schema.json#/$defs/Money
        versionId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        explanation:
          type: array
          items:
            type: string
      required:
      - intermediaryId
      - sharePct
      - ratePct
      - commission
      - versionId
      - explanation
    CommissionSimulatedLine:
      type: object
      description: The commission of one simulated premium line
      properties:
        lineIndex:
          type: integer
        premium:
          $ref: ../events/common.schema.json#/$defs/Money
        outcome:
          type: string
          enum:
          - RESOLVED
          - NO_COMMISSION
        reason:
          oneOf:
          - type: string
          - type: 'null'
        reasonText:
          oneOf:
          - type: string
          - type: 'null'
        commission:
          $ref: ../events/common.schema.json#/$defs/Money
          description: Total commission of the line (the allocations add up to it exactly); zero with outcome NO_COMMISSION
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/CommissionAllocation'
        unresolved:
          type: array
          items:
            $ref: '#/components/schemas/CommissionResolvedProducer'
          description: Producers with no commission on this line, with the reason
      required:
      - lineIndex
      - premium
      - outcome
      - commission
      - allocations
      - unresolved
    CommissionAgreementSimulateResponse:
      type: object
      description: 'pty.CommissionAgreement.simulate result (BO-PTY-11). A line without an agreement in force is an explicit NO_COMMISSION line with its reason.'
      properties:
        lines:
