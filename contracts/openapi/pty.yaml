        validFrom:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/LocalDate
          - type: 'null'
          description: First day of the relationship; default today
        validTo:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/LocalDate
          - type: 'null'
      required:
      - fromPartyId
      - toPartyId
      - relationshipType
    RelationshipView:
      type: object
      description: 'A party relationship as known at the asked time.'
      properties:
        relationshipId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        fromPartyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        toPartyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        relationshipType:
          $ref: ../events/common.schema.json#/$defs/Code
        validPeriod:
          $ref: ../events/common.schema.json#/$defs/DatePeriod
      required:
      - relationshipId
      - fromPartyId
      - toPartyId
      - relationshipType
      - validPeriod
    RelationshipAddResponse:
      type: object
      description: 'pty.Relationship.add result.'
      properties:
        relationship:
          $ref: '#/components/schemas/RelationshipView'
      required:
      - relationship
    RelationshipEndRequest:
      type: object
      description: 'pty.Relationship.end request (BO-PTY-03): end-dates a relationship.'
      properties:
        relationshipId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        validTo:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/LocalDate
          - type: 'null'
          description: Day the relationship ends (exclusive); default today
      required:
      - relationshipId
    RelationshipEndResponse:
      type: object
      description: 'pty.Relationship.end result.'
      properties:
        relationship:
          $ref: '#/components/schemas/RelationshipView'
      required:
      - relationship
    RelationshipQueryItem:
      $ref: '#/components/schemas/RelationshipView'
    RelationshipQueryPage:
      allOf:
      - $ref: common.yaml#/components/schemas/PageEnvelope
      - type: object
        properties:
          items:
