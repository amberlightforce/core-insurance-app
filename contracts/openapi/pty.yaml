          items:
            $ref: '#/components/schemas/PartyIdentifierView'
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/PartyAddressView'
        contactPoints:
          type: array
          items:
            $ref: '#/components/schemas/ContactPointView'
        createdAt:
          $ref: ../events/common.schema.json#/$defs/Instant
      required:
      - partyId
      - partyNumber
      - partyType
      - status
      - legalEntity
      - jurisdiction
      - preferredLanguage
      - recordVersion
      - p2Revealed
      - names
      - identifiers
      - addresses
      - contactPoints
      - createdAt
