          $ref: '#/components/schemas/ContactPointType'
        value:
          type: string
          minLength: 1
          maxLength: 254
        purpose:
          $ref: '#/components/schemas/ContactPointPurpose'
        primary:
          type: boolean
      required:
      - type
      - value
    PartyCreateRequest:
      type: object
      description: 'pty.Party.create request. Typed by SL-0 from REQ-PTY-001, REQ-PTY-012, REQ-PTY-030..032. Exactly one of person / organisation, matching partyType.'
      properties:
        partyType:
          $ref: '#/components/schemas/PartyType'
        person:
          oneOf:
          - $ref: '#/components/schemas/PersonInput'
          - type: 'null'
        organisation:
          oneOf:
          - $ref: '#/components/schemas/OrganisationInput'
          - type: 'null'
        preferredLanguage:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/LanguageCode
          - type: 'null'
          description: Default from the jurisdiction (REQ-PTY-041)
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/IdentifierInput'
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/AddressInput'
        contactPoints:
          type: array
          items:
            $ref: '#/components/schemas/ContactPointInput'
        reason:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Code
          - type: 'null'
          description: Change reason code (REQ-PTY-038)
      required:
      - partyType
    PartyCreateResponse:
      type: object
      description: 'pty.Party.create result. Typed by SL-0. An identifier already held by another party is refused with PTY-ERR-DUPLICATE-IDENTIFIER, whose Problem Details name the existing party (REQ-PTY-052).'
      properties:
        party:
          $ref: '#/components/schemas/PartyView'
        duplicateSuggestions:
          type: array
          description: Possible duplicates found by name and birth date (exact identifier conflicts are refused instead)
          items:
            $ref: '#/components/schemas/PartySearchItem'
        missingData:
          type: array
          description: Recommended data not supplied (warnings, never errors)
          items:
            $ref: ../events/common.schema.json#/$defs/Code
      required:
      - party
      - duplicateSuggestions
      - missingData
    PartySearchPage:
      allOf:
      - $ref: common.yaml#/components/schemas/PageEnvelope
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/PartySearchItem'
      description: Page of pty.Party.search results (cursor pagination, contract §3.5.5)
    PartyUpdateRequest:
      type: object
      description: 'pty.Party.update request (BO-PTY-01). Name, birth date and language change of a party; omitted parts stay as they are. The name change is bitemporal (effective today, history kept) and the search keys are rebuilt.'
      properties:
        expectedRecordVersion:
          type: integer
          minimum: 1
          description: Optimistic concurrency (REQ-PTY-043); a stale value is refused with PTY-ERR-STALE
        person:
          oneOf:
          - $ref: '#/components/schemas/PersonUpdateInput'
          - type: 'null'
        organisation:
          oneOf:
          - $ref: '#/components/schemas/OrganisationInput'
          - type: 'null'
        preferredLanguage:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/LanguageCode
          - type: 'null'
        reason:
          type:
          - string
          - 'null'
          maxLength: 64
      required:
      - expectedRecordVersion
    PersonUpdateInput:
      type: object
      description: 'Person changes of pty.Party.update. givenNames and familyName are given together (a new name replaces the old); birthDate alone changes only the birth date.'
      properties:
        givenNames:
          type:
          - string
          - 'null'
          maxLength: 200
        familyName:
          type:
          - string
          - 'null'
          maxLength: 200
        fatherName:
          type:
          - string
          - 'null'
          maxLength: 200
        motherName:
          type:
          - string
          - 'null'
          maxLength: 200
        birthDate:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/LocalDate
          - type: 'null'
    PartyUpdateResponse:
      type: object
      description: 'pty.Party.update result (BO-PTY-01): the party after the change, with possible duplicates of the new name.'
      properties:
        party:
          $ref: '#/components/schemas/PartyView'
        duplicateSuggestions:
          type: array
          items:
            $ref: '#/components/schemas/PartySearchItem'
        missingData:
          type: array
          items:
            $ref: ../events/common.schema.json#/$defs/Code
      required:
      - party
      - duplicateSuggestions
      - missingData
    PartyValidateRequest:
      type: object
      description: 'pty.Party.validate request (BO-PTY-01): the data of a would-be pty.Party.create, checked without saving.'
      properties:
        partyData:
          $ref: '#/components/schemas/PartyCreateRequest'
      required:
      - partyData
    PartyValidateResponse:
      type: object
      description: 'pty.Party.validate result (BO-PTY-01): rule violations of the create rules (none = valid) and possible duplicates.'
      properties:
        issues:
          type: array
          items:
            $ref: '#/components/schemas/PartyValidationIssue'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/PartySearchItem'
      required:
      - issues
      - candidates
    PartyValidationIssue:
      type: object
      description: One rule violation of pty.Party.validate.
      properties:
        field:
          type: string
        code:
          $ref: ../events/common.schema.json#/$defs/Code
        message:
          type: string
      required:
      - field
      - code
      - message
    PartyMergeRequest:
      type: object
      description: 'pty.Party.merge request (BO-PTY-05): merge `mergedPartyId` into `survivorPartyId` (the survivor keeps its id). Goes to a checker through a PLT approval; nothing changes until it is approved.'
      properties:
        survivorPartyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        mergedPartyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - survivorPartyId
      - mergedPartyId
      - reason
    PartyMergeResponse:
      type: object
      description: 'pty.Party.merge result: the merge record (PENDING_APPROVAL) with its approval request id.'
      properties:
        merge:
          $ref: '#/components/schemas/PartyMergeView'
      required:
      - merge
    PartyMergeView:
      type: object
      description: 'A merge record (pty.party_merge). Status PENDING_APPROVAL, EXECUTED, REJECTED or UNMERGED.'
      properties:
        mergeId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        survivorPartyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        mergedPartyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        survivorPartyNumber:
          type: string
        mergedPartyNumber:
          type: string
        status:
          type: string
          enum:
          - PENDING_APPROVAL
          - EXECUTED
          - REJECTED
          - UNMERGED
        reason:
          type: string
        requestedBy:
          type: string
        requestedAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        approvalRequestId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
        decidedBy:
          type:
          - string
          - 'null'
        decidedAt:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Instant
          - type: 'null'
        decisionComment:
          type:
          - string
          - 'null'
        executedAt:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Instant
          - type: 'null'
        unmergeWindowEnd:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Instant
          - type: 'null'
          description: Until when the merge can be unmerged (set when executed)
        unmergedAt:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Instant
          - type: 'null'
        unmergedBy:
          type:
          - string
          - 'null'
        priorStatus:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Code
          - type: 'null'
          description: Status the absorbed party had before the merge; restored on unmerge
      required:
      - mergeId
      - survivorPartyId
      - mergedPartyId
      - survivorPartyNumber
      - mergedPartyNumber
      - status
      - reason
      - requestedBy
      - requestedAt
    PartyMergePage:
      allOf:
      - $ref: common.yaml#/components/schemas/PageEnvelope
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/PartyMergeView'
      description: Page of pty.Party.mergeList results
    PartyMergeApproveRequest:
      type: object
      description: 'pty.Party.approveMerge request (BO-PTY-05): the checker approves or rejects a PENDING_APPROVAL merge. The maker cannot decide (PLT-ERR-SELF-APPROVAL); the checker needs the merge authority.'
      properties:
        mergeId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
        comment:
          oneOf:
          - type: string
            maxLength: 500
          - type: 'null'
      required:
      - mergeId
      - decision
    PartyMergeApproveResponse:
      type: object
      description: 'pty.Party.approveMerge result: the merge record after the decision (EXECUTED or REJECTED).'
      properties:
        merge:
          $ref: '#/components/schemas/PartyMergeView'
      required:
      - merge
    PartyUnmergeRequest:
      type: object
      description: 'pty.Party.unmerge request (BO-PTY-05): reverses an EXECUTED merge while its unmerge window is open (PTY-ERR-WINDOW-CLOSED otherwise).'
      properties:
        mergeId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - mergeId
      - reason
    PartyUnmergeResponse:
      type: object
      description: 'pty.Party.unmerge result: the merge record (UNMERGED) and the restored party.'
      properties:
        merge:
          $ref: '#/components/schemas/PartyMergeView'
        restoredPartyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
      required:
      - merge
      - restoredPartyId
    PartySurvivorResponse:
      type: object
      description: 'pty.Party.resolveSurvivor result: the party that survives the merge chain of the requested party.'
      properties:
        requestedPartyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        survivorPartyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        survivorPartyNumber:
          type: string
        merged:
          type: boolean
          description: True when the requested party was merged into the survivor
        mergeId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: The last merge on the chain
      required:
      - requestedPartyId
      - survivorPartyId
      - survivorPartyNumber
      - merged
    DuplicateCandidate:
      type: object
      description: 'One suspected duplicate pair of pty.Party.duplicates (BO-PTY-05): score 0..100 and the reasons (AFM_EXACT, NAME_AND_BIRTH_DATE, NAME). P2 values masked.'
      properties:
        candidateKey:
          type: string
          description: Stable key of the pair (the two party ids, ordered)
        score:
          type: integer
          minimum: 0
          maximum: 100
        reasons:
          type: array
          items:
            $ref: ../events/common.schema.json#/$defs/Code
        partyA:
          $ref: '#/components/schemas/PartySearchItem'
        partyB:
          $ref: '#/components/schemas/PartySearchItem'
        mergeBlockedReason:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Code
          - type: 'null'
          description: Set when the pair can never be merged (IDENTIFIER_CONFLICT)
      required:
      - candidateKey
      - score
      - reasons
      - partyA
      - partyB
    DuplicateCandidatePage:
      allOf:
      - $ref: common.yaml#/components/schemas/PageEnvelope
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/DuplicateCandidate'
      description: Page of pty.Party.duplicates results
    IdentifierVerifyRequest:
      type: object
      description: 'pty.Identifier.verify request (BO-PTY-01): re-checks the current identifier of a scheme with the bound IdValidator.'
      properties:
        partyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        scheme:
          $ref: ../events/common.schema.json#/$defs/Code
      required:
      - partyId
      - scheme
    IdentifierVerifyResponse:
      type: object
      description: 'pty.Identifier.verify result (BO-PTY-01). valid = the IdValidator accepts the value (format and check digit). No registry or VIES adapter is bound yet, so a valid value stays SELF_DECLARED (source ID_VALIDATOR) and an invalid one becomes VERIFICATION_FAILED.'
      properties:
        status:
          type: string
          enum:
          - SELF_DECLARED
          - DOCUMENT_VERIFIED
          - REGISTRY_VERIFIED
          - VERIFICATION_FAILED
          - EXPIRED
        valid:
          type: boolean
        suggestions:
          type: array
          items:
            type: string
      required:
      - status
      - valid
      - suggestions
    PartyRoleAssignRequest:
      type: object
      description: 'pty.PartyRole.assign request (BO-PTY-03, REQ-PTY-002). Gives a party a role, optionally within a context object (a policy, claim, account...). The same party, role type and context cannot hold two overlapping periods (PTY-ERR-ROLE-DUPLICATE). A VENDOR role needs the party to have a verified AFM (vendor master, REQ-PTY-096).'
      properties:
        partyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        roleType:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Role catalogue code, for example POLICYHOLDER, INSURED, BENEFICIARY, CLAIMANT, PAYEE, VENDOR
        contextRef:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/ObjectRef
          - type: 'null'
          description: The business object the role is held in; null for a party-level role
        validFrom:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/LocalDate
          - type: 'null'
          description: First day of the role; default today
        validTo:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/LocalDate
          - type: 'null'
          description: Day the role ends (exclusive); null for open-ended
      required:
      - partyId
      - roleType
    PartyRoleView:
      type: object
      description: 'A party role as known at the asked time.'
      properties:
        roleId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        partyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        roleType:
          $ref: ../events/common.schema.json#/$defs/Code
        contextRef:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/ObjectRef
          - type: 'null'
        validPeriod:
          $ref: ../events/common.schema.json#/$defs/DatePeriod
      required:
      - roleId
      - partyId
      - roleType
      - contextRef
      - validPeriod
    PartyRoleAssignResponse:
      type: object
      description: 'pty.PartyRole.assign result.'
      properties:
        role:
          $ref: '#/components/schemas/PartyRoleView'
      required:
      - role
    PartyRoleEndRequest:
      type: object
      description: 'pty.PartyRole.end request (BO-PTY-03): end-dates a role (bitemporal, the earlier record stays in the history).'
      properties:
        roleId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        validTo:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/LocalDate
          - type: 'null'
          description: Day the role ends (exclusive); default today. Must be after the role start.
      required:
      - roleId
    PartyRoleEndResponse:
      type: object
      description: 'pty.PartyRole.end result.'
      properties:
        role:
          $ref: '#/components/schemas/PartyRoleView'
      required:
      - role
    PartyRoleQueryItem:
      $ref: '#/components/schemas/PartyRoleView'
    PartyRoleQueryPage:
      allOf:
      - $ref: common.yaml#/components/schemas/PageEnvelope
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/PartyRoleQueryItem'
      description: Page of pty.PartyRole.query results (cursor pagination, contract §3.5.5)
    RelationshipAddRequest:
      type: object
      description: 'pty.Relationship.add request (BO-PTY-03, REQ-PTY-104). A directed link from one party to another (from SPOUSE_OF to, PARENT_OF, SUBSIDIARY_OF...). Hierarchical types refuse a cycle (PTY-ERR-RELATIONSHIP-CYCLE); the same pair and type cannot overlap in time (PTY-ERR-OVERLAP).'
      properties:
