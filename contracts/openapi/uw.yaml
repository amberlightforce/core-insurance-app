          items:
            type: array
            items:
              $ref: '#/components/schemas/ReferralListItem'
          counts:
            $ref: '#/components/schemas/ReferralQueueCounts'
        required:
        - counts
      description: Page of uw.Referral.list results (cursor pagination, contract §3.5.5) with the queue counts
    ReferralDriverAgeBand:
      type: string
