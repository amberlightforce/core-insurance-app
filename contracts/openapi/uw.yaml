      - MINE
      description: Workbench queue (D-USR-13). MINE - the OPEN referrals the caller can decide now (D-SL5-03/04; the dry
        decide check per Open issue; refused with UW-ERR-VALIDATION above 500 open referrals in the legal entity). OPEN - a job issue waits for a decision; APPROVED_TODAY - an issue of the job
        was approved on the legal entity's business day; REJECTED - a rejection still stands on the job; DECIDED_BY_ME_TODAY
        - the caller decided an issue of the job today.
    ReferralStatusCode:
      type: string
      enum:
      - Open
      - Rejected
      - Approved
      description: Status of the referred job derived from its issues - Open while an issue waits, else Rejected while a
        rejection stands, else Approved.
    ReferralQueueCounts:
      type: object
      description: Jobs in each workbench queue of the caller's legal entity.
      properties:
        open:
          type: integer
          minimum: 0
        approvedToday:
          type: integer
          minimum: 0
        rejected:
          type: integer
          minimum: 0
        decidedByMeToday:
          type: integer
          minimum: 0
        mine:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Open referrals the caller can decide (the MINE queue; same computation). Null when the legal entity has
            more than 500 open referrals and the count is not computed.
      required:
      - open
      - approvedToday
      - rejected
      - decidedByMeToday
      - mine
    ReferralCustomer:
      type: object
      description: The policyholder as PTY's masked view shows it (P1 name only, never a P2 value).
      properties:
        partyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        partyNumber:
          type: string
        displayName:
          type:
          - string
          - 'null'
          description: Family and given names, or the organisation name (P1)
      required:
      - partyId
      - partyNumber
    ReferralReason:
      type: object
      description: One issue of the job shown as a reason chip.
      properties:
        issueId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        issueType:
          $ref: ../events/common.schema.json#/$defs/Code
        ruleId:
          type: string
        status:
          $ref: '#/components/schemas/IssueStatusCode'
        observed:
          type:
          - string
          - 'null'
          description: The fact value the rule read, from the stored derived facts (vehicle age in years, vehicle value, or the
            youngest driver's age band; never a birth date). Null when the facts were not recorded.
        limit:
          type:
          - string
          - 'null'
          description: The rule's declared threshold (the rule set's explain.limit). Null when the rule declares none; then
            limitUnavailableReason is set.
        limitUnavailableReason:
          type:
          - string
          - 'null'
          description: Why limit is null, e.g. RULE_DECLARES_NO_LIMIT. Always set when limit is null.
      required:
      - issueId
      - issueType
      - ruleId
      - status
      - observed
      - limit
      - limitUnavailableReason
    ReferralListItem:
      type: object
      description: 'uw.Referral.list result: one referred job (D-USR-13).'
      properties:
        jobRef:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: POL job id
        jobNumber:
          type:
          - string
          - 'null'
          description: POL job (quote) number; null when POL does not return the job
        jobState:
          type:
          - string
          - 'null'
          description: POL job state (e.g. QUOTED, BOUND)
        productCode:
          type:
          - string
          - 'null'
        customer:
          oneOf:
          - $ref: '#/components/schemas/ReferralCustomer'
          - type: 'null'
        premiumTotal:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Money
          - type: 'null'
          description: Total premium of the current quote version (premium plus taxes)
        effectiveDate:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/LocalDate
          - type: 'null'
          description: Policy start date (Europe/Athens business date)
        referralStatus:
          $ref: '#/components/schemas/ReferralStatusCode'
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/ReferralReason'
          description: The job's issues in the queue's scope (Open, Rejected and Approved; closed and invalidated ones are history)
        raisedAt:
          $ref: ../events/common.schema.json#/$defs/Instant
          description: When the oldest of these issues was raised
        lastDecidedAt:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Instant
          - type: 'null'
        lastDecidedBy:
          type:
          - string
          - 'null'
        callerWorkedOnJob:
          type: boolean
          description: The caller created, edited, quoted, bound or evaluated the job and may not decide its issues (SOD-UW-02)
      required:
      - jobRef
      - referralStatus
      - reasons
      - raisedAt
      - callerWorkedOnJob
    ReferralListPage:
      allOf:
      - $ref: common.yaml#/components/schemas/PageEnvelope
