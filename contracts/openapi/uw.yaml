          - type: 'null'
        engineCapacityCc:
          type:
          - integer
          - 'null'
        usage:
          type:
          - string
          - 'null'
    ReferralDriverFacts:
      type: object
      description: The driver facts the rules read, without personal data
      properties:
        youngestAgeBand:
          oneOf:
          - $ref: '#/components/schemas/ReferralDriverAgeBand'
          - type: 'null'
        claimsLast5Years:
          type:
          - integer
          - 'null'
    ReferralRiskFacts:
      type: object
      description: Risk facts recorded by the latest evaluation of the job (POL's in-process evaluation)
      properties:
        evaluatedAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        effectiveDate:
          $ref: ../events/common.schema.json#/$defs/LocalDate
        ruleSetCode:
          type: string
        ruleSetVersion:
          type: string
        dataStatus:
          type: string
          description: ILLUSTRATIVE_TEST_DATA or APPROVED
        vehicle:
          $ref: '#/components/schemas/ReferralVehicleFacts'
        driver:
          $ref: '#/components/schemas/ReferralDriverFacts'
      required:
      - evaluatedAt
      - effectiveDate
      - ruleSetCode
      - ruleSetVersion
      - dataStatus
      - vehicle
      - driver
    ReferralView:
      type: object
      description: A referred job with what the decider needs (D-USR-13)
      properties:
        summary:
          $ref: '#/components/schemas/ReferralListItem'
        productVersion:
          type:
          - string
          - 'null'
        expirationDate:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/LocalDate
          - type: 'null'
        producerCode:
          type:
          - string
          - 'null'
        quoteVersionNo:
          type:
          - integer
          - 'null'
        premium:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Money
          - type: 'null'
        taxes:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Money
          - type: 'null'
        facts:
          oneOf:
          - $ref: '#/components/schemas/ReferralRiskFacts'
          - type: 'null'
          description: Null when no evaluation recorded the facts (evaluations before this slice)
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ReferralIssue'
          description: Every issue of the job, oldest first, with its decision (the previous decisions) and whether the caller
            can decide it
        decidability:
          $ref: '#/components/schemas/ReferralDecidability'
      required:
      - summary
      - issues
      - decidability
    DecidabilityReason:
      type: string
      enum:
      - SOD_CREATOR
      - SOD_PARTICIPANT
      - SOD_PRODUCER
      - SOD_EVALUATOR
      - NOT_HUMAN
      - NO_AUTHORITY
      - NOT_OPEN
      description: Why the caller cannot decide now. SOD_CREATOR - created the job; SOD_PARTICIPANT - edited or otherwise worked
        on the job; SOD_PRODUCER - is the job's producer; SOD_EVALUATOR - ran or bound an evaluation of the job; NOT_HUMAN - the
        actor is not a person (REQ-UW-115); NO_AUTHORITY - UW.ISSUE_APPROVAL for the issue type is refused or refers up; NOT_OPEN -
        the issue is not Open. SOD-UW-02, BR-UW-013.
    AuthorityPreview:
      type: object
      description: The dry UW.ISSUE_APPROVAL check for the issue type (no check record, approval request or audit event is written).
        A preview, never an authorisation; uw.Issue.decide re-runs the check.
      properties:
        type:
          type: string
          description: Authority type code (UW.ISSUE_APPROVAL)
        issueType:
          $ref: ../events/common.schema.json#/$defs/Code
        outcome:
          type: string
          enum:
          - ALLOW
          - REFER
          - DENY
        sourceGrantId:
          type:
          - string
          - 'null'
          description: The grant that decided (allow) or was exceeded (refer)
      required:
      - type
      - issueType
      - outcome
    IssueDecidability:
      type: object
      description: Whether the caller can decide one issue now, and why not (always set).
      properties:
        canDecide:
          type: boolean
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/DecidabilityReason'
        authority:
          $ref: '#/components/schemas/AuthorityPreview'
      required:
      - canDecide
      - reasons
      - authority
    ReferralDecidability:
      type: object
      description: Whether the caller can decide the referral now. canDecide is true only when it is true for every Open issue and
        at least one issue is Open.
      properties:
        canDecide:
          type: boolean
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/DecidabilityReason'
          description: The distinct reasons across the Open issues (NOT_OPEN when no issue is Open)
      required:
      - canDecide
      - reasons
    ReferralIssue:
      type: object
      description: One issue of a referred job with the caller's decidability (the wrapper keeps IssueListItem unchanged for uw.Issue.list).
      properties:
        issue:
          $ref: '#/components/schemas/IssueListItem'
        decidability:
          $ref: '#/components/schemas/IssueDecidability'
      required:
      - issue
      - decidability
