components:
  securitySchemes:
    entra:
      $ref: common.yaml#/components/securitySchemes/entra
  schemas:
    RulesEvaluateRequest:
      type: object
      properties:
        jobRef:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: POL job id
        checkpoint:
          type: string
          enum:
          - PRE_QUOTE
          - PRE_BIND
          - PRE_ISSUE
          - RENEWAL
          description: REQ-UW-001
        snapshotRef:
          type: string
          description: POL risk snapshot reference (REQ-POL-002)
        snapshotHash:
          $ref: ../events/common.schema.json#/$defs/Sha256
          description: Idempotency is job ref + snapshot hash (PRD-04 §9.1)
        signals:
          type: array
          items:
            $ref: common.yaml#/components/schemas/Unspecified
          description: RAT referral signals (REQ-RAT-006)
        productCode:
          $ref: ../events/common.schema.json#/$defs/Code
          description: SL-RAT-UW - selects the rule set (REQ-UW-043)
        effectiveDate:
          $ref: ../events/common.schema.json#/$defs/LocalDate
          description: SL-RAT-UW - the date the rule-set version and the risk are evaluated at
        riskSnapshot:
          $ref: ../events/common.schema.json#/$defs/OpenObject
          description: SL-RAT-UW - the POL risk snapshot passed in-process; validated against the rule set's input schema (REQ-UW-055)
        jobParticipants:
          type: array
          maxItems: 200
          items:
            type: string
            maxLength: 200
          description: POL in-process only - actors who created, edited, quoted or bound the job (BR-UW-013 / SOD-UW-02); stored
            with the evaluation, they may not decide the job's issues
        producerCode:
          type:
          - string
          - 'null'
          maxLength: 64
          description: POL in-process only - producer code on the job (SOD-UW-02), stored with the evaluation
      required:
      - jobRef
      - checkpoint
      - snapshotRef
      description: 'Typed from REQ-UW-001, REQ-UW-055..058. PRD inputs: "job ref, checkpoint, snapshot ref, signals, dryRun"'
    RulesEvaluateResponse:
      type: object
      properties:
        evaluationId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        lane:
          $ref: ../events/common.schema.json#/$defs/Code
        issues:
          type: array
          items:
            type: object
            properties:
              issueId:
                $ref: ../events/common.schema.json#/$defs/Uuid
              issueType:
                $ref: ../events/common.schema.json#/$defs/Code
                description: Issue type code
              severity:
                $ref: ../events/common.schema.json#/$defs/Code
              blockingPoint:
                $ref: ../events/common.schema.json#/$defs/BlockingPoint
              issueKey:
                type: string
                description: Issue key, e.g. `driver:<driverRef>` (REQ-UW-001)
              lane:
                $ref: ../events/common.schema.json#/$defs/Code
              explanationKeys:
                type: array
                items:
                  type: string
              approvalStatus:
                $ref: ../events/common.schema.json#/$defs/Code
                description: Issue state (PRD-04 §7.3)
            required:
            - issueId
            - issueType
            - blockingPoint
            - issueKey
            - approvalStatus
            description: UW issue as returned by evaluate (REQ-UW-001)
        outcome:
          type: string
          enum:
          - ACCEPT
          - REFER
          - DECLINE
          description: SL-RAT-UW - the decision of the evaluation, derived from the hits (decline beats refer beats accept)
        reasons:
          type: array
          items:
            type: object
            properties:
              ruleId:
                type: string
              issueType:
                $ref: ../events/common.schema.json#/$defs/Code
              outcome:
                type: string
                enum:
                - REFER
                - DECLINE
                - WARN
              messageEn:
                type: string
              messageEl:
                type: string
            required:
            - ruleId
            - issueType
            - outcome
            - messageEn
            - messageEl
          description: SL-RAT-UW - why the outcome is not ACCEPT, in both languages (REQ-UW-061)
        dataStatus:
          type: string
          description: ILLUSTRATIVE_TEST_DATA when the rule set is made-up test data, not an underwriting guideline (D-SLC-04)
        warnings:
          type: array
          items:
            type: string
          description: e.g. UW-WARN-ILLUSTRATIVE-RULES
        ruleSetCode:
          $ref: ../events/common.schema.json#/$defs/Code
        ruleSetVersion:
          type: string
        ruleSetHash:
          $ref: ../events/common.schema.json#/$defs/Sha256
          description: Content hash of the decision table that was evaluated (REQ-UW-042)
      required:
      - evaluationId
      - issues
      - outcome
      description: 'Typed from REQ-UW-001, REQ-UW-055..058. PRD outputs: "issues, lane, evaluation id"'
    RulesEvaluateBatchRequest:
      type: object
      description: 'uw.Rules.evaluateBatch request. PRD inputs: "selection, checkpoint, rule set"'
      properties:
        selection:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "selection"'
        checkpoint:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "checkpoint"'
        ruleSet:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "rule set"'
    RulesEvaluateBatchResponse:
      type: object
      description: 'uw.Rules.evaluateBatch result. PRD outputs: "job id, results"'
      properties:
        jobId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: 'PRD: "job id"'
        results:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "results"'
    IssueBlockingStatusResponse:
      type: object
      properties:
        blocked:
          type: boolean
          description: True when any Open, Rejected or Invalidated issue blocks the point (REQ-UW-002)
        issues:
          type: array
          items:
            type: object
            properties:
              issueId:
                $ref: ../events/common.schema.json#/$defs/Uuid
              issueType:
                $ref: ../events/common.schema.json#/$defs/Code
                description: Issue type code
              severity:
                $ref: ../events/common.schema.json#/$defs/Code
              blockingPoint:
                $ref: ../events/common.schema.json#/$defs/BlockingPoint
              issueKey:
                type: string
                description: Issue key, e.g. `driver:<driverRef>` (REQ-UW-001)
              lane:
                $ref: ../events/common.schema.json#/$defs/Code
              explanationKeys:
                type: array
                items:
                  type: string
              approvalStatus:
                $ref: ../events/common.schema.json#/$defs/Code
                description: Issue state (PRD-04 §7.3)
            required:
            - issueId
            - issueType
            - blockingPoint
            - issueKey
            - approvalStatus
            description: UW issue as returned by evaluate (REQ-UW-001)
          description: Blocking issues
      required:
      - blocked
      - issues
      description: 'Typed from REQ-UW-002. PRD outputs: "blocked, issues"'
    IssueStatusCode:
      type: string
      enum:
      - Open
      - Approved
      - ApprovedWithConditions
      - Rejected
      - Invalidated
      - Closed
      description: UW issue state (PRD-04 §7.3). Open, Rejected and Invalidated block their point (BR-UW-001).
    IssueDecisionCode:
      type: string
      enum:
      - APPROVE
      - REJECT
      description: Decision on an Open issue (REQ-UW-079). APPROVE_WITH_CONDITIONS comes with the condition templates (REQ-UW-095).
    IssueDecisionView:
      type: object
      description: The decision recorded on an issue (REQ-UW-111).
      properties:
        decision:
          $ref: '#/components/schemas/IssueDecisionCode'
        decidedBy:
          type: string
          description: Actor that decided (a person, REQ-UW-115)
        decidedAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        reason:
          type: string
          description: Mandatory reason given by the decider
        message:
          type:
          - string
          - 'null'
          description: Optional message to the requester
        authorityCheckId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: plt.Authority.check id of the binding check (REQ-UW-109)
      required:
      - decision
      - decidedBy
      - decidedAt
      - reason
      - authorityCheckId
    IssueListItem:
      type: object
      description: One UW issue (REQ-UW-075).
      properties:
        id:
          $ref: ../events/common.schema.json#/$defs/Uuid
        jobRef:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: POL job id
        issueType:
          $ref: ../events/common.schema.json#/$defs/Code
        issueKey:
          type: string
          description: Issue key, e.g. `VEHICLE_AGE_REFERRAL:<elementId>` (REQ-UW-001)
        ruleId:
          type: string
          description: Raising rule of the rule set
        severity:
          $ref: ../events/common.schema.json#/$defs/Code
        blockingPoint:
          $ref: ../events/common.schema.json#/$defs/BlockingPoint
        lane:
          $ref: ../events/common.schema.json#/$defs/Code
        status:
          $ref: '#/components/schemas/IssueStatusCode'
        recordVersion:
          type: integer
          minimum: 1
          description: Optimistic concurrency version (pass it to uw.Issue.decide)
        messageEn:
          type: string
        messageEl:
          type: string
        raisedAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        raisedBy:
          type: string
          description: Actor of the evaluation that raised the issue
        decision:
          oneOf:
          - $ref: '#/components/schemas/IssueDecisionView'
          - type: 'null'
        closeReason:
          type:
          - string
          - 'null'
          description: RULE_NO_LONGER_HITS, VALUE_CHANGED (approval invalidated) or another closing reason
      required:
      - id
      - jobRef
      - issueType
      - issueKey
      - ruleId
      - severity
      - blockingPoint
      - lane
      - status
      - recordVersion
      - messageEn
      - messageEl
      - raisedAt
      - raisedBy
