          $ref: ../events/common.schema.json#/$defs/Uuid
          description: For kind CREDIT_NOTE, the invoice it corrects. Always set for a credit note, absent for an INVOICE. A credit note has its own gapless
            series (technical prefix CN) and negative-direction semantics; total is the positive credited amount.
      required:
      - invoiceId
      - invoiceNumber
      - kind
      - state
      - billingAccountId
      - policyId
      - policyTermId
      - transactionId
      - issueDate
      - dueDate
      - method
      - total
      - paid
      - open
      - totalsByCategory
    InvoiceItemView:
      type: object
      description: Invoice item traced to its POL charge (REQ-BIL-067)
      properties:
        invoiceItemId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        chargeId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        transactionId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        elementLocator:
          $ref: ../events/common.schema.json#/$defs/Text
        coverageCode:
          $ref: ../events/common.schema.json#/$defs/Code
        chargeType:
          $ref: ../events/common.schema.json#/$defs/Code
        chargeCategory:
          $ref: ../events/common.schema.json#/$defs/Code
        fiscalCategoryKey:
          $ref: ../events/common.schema.json#/$defs/Code
          description: PFC fiscal-category key of the charge type (REQ-PFC-121)
        legalStatus:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Legal status of the rate behind a tax or levy line, carried from POL (absent for premium)
        provisional:
          type: boolean
          description: True when the line rests on a value that is not Settled (D-REG-02)
        validPeriod:
          $ref: ../events/common.schema.json#/$defs/DatePeriod
        amount:
          $ref: ../events/common.schema.json#/$defs/Money
        open:
          $ref: ../events/common.schema.json#/$defs/Money
        state:
          type: string
          enum:
          - PLANNED
          - BILLED
          - OPEN
          - SETTLED
          - CANCELLED
          - WRITTEN_OFF
        transactionKind:
          type: string
          description: Transaction kind of the source POL charge (servicing items; always set there)
        cancellationSource:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Cancellation source (items from a cancellation)
        treatmentRuleId:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Treatment rule of a tax or levy item on a servicing transaction (always set there)
      required:
      - invoiceItemId
      - chargeId
      - transactionId
      - elementLocator
      - coverageCode
      - chargeType
      - chargeCategory
      - validPeriod
      - amount
      - open
      - state
    AllocationView:
      type: object
      description: One allocation row of a receipt to an invoice item (REQ-BIL-130)
      properties:
        allocationId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        receiptId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        invoiceId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        invoiceItemId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        amount:
          $ref: ../events/common.schema.json#/$defs/Money
        ruleId:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Matching or allocation rule that produced the row (e.g. REFERENCED_INVOICE, UNIQUE_OPEN_AMOUNT, MANUAL)
        source:
          type: string
          enum:
          - RULE
          - MANUAL
        reversesAllocationId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: Set on a reversal row (negative amount) - the allocation it reverses
        recordedAt:
          $ref: ../events/common.schema.json#/$defs/Instant
      required:
      - allocationId
      - receiptId
      - invoiceId
      - invoiceItemId
      - amount
      - ruleId
      - source
      - recordedAt
    InvoiceFiscalStatus:
      type: object
      description: The fiscal document CMP issued for the invoiced transaction (REQ-BIL-086, REQ-BIL-096, REQ-BIL-098). CMP
        is the sole fiscal issuer (D3); BIL stores its references for display.
      properties:
        status:
          type: string
          enum:
          - NOT_REQUESTED
          - PENDING
          - REGISTERED
          - REJECTED
          - REQUEST_FAILED
        fiscalDocumentId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        triggerPoint:
          type: string
          enum:
          - TRANSACTION
          - INVOICE
        series:
          $ref: ../events/common.schema.json#/$defs/Text
        number:
          $ref: ../events/common.schema.json#/$defs/Text
        mark:
          $ref: ../events/common.schema.json#/$defs/Text
        uid:
          $ref: ../events/common.schema.json#/$defs/Text
        documentType:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Placeholder until the myDATA document types are settled (OQ-012); never an AADE code
        rejectionCodes:
          type: array
          items:
            $ref: ../events/common.schema.json#/$defs/Code
      required:
