      - maskedIban
      - verificationStatus
    RefundView:
      type: object
      description: 'A refund (PRD-06 §7, REQ-BIL-187..190). One open refund per billing account (D-SL3-14), so authority is checked on the total.'
      properties:
        refundId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        billingAccountId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        state:
          $ref: '#/components/schemas/RefundState'
        approvalState:
          $ref: '#/components/schemas/RefundApprovalState'
        amount:
          $ref: ../events/common.schema.json#/$defs/Money
          description: Amount payable to the payee after netting; equals the sum of breakdown minus the sum of netting
        breakdown:
          type: array
          items:
            $ref: '#/components/schemas/RefundBreakdownLine'
          description: Per charge type (always set)
        netting:
          type: array
          items:
            $ref: '#/components/schemas/RefundNettingLine'
          description: Always set; empty when nothing was netted
        payee:
          $ref: '#/components/schemas/RefundPayee'
        payoutMethod:
          $ref: ../events/common.schema.json#/$defs/Code
        reasonCode:
          $ref: ../events/common.schema.json#/$defs/Code
        sourcePolicyIds:
          type: array
          items:
            $ref: ../events/common.schema.json#/$defs/Uuid
        requestedBy:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: User who proposed the refund
        decidedBy:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: User who approved or rejected; absent until decided
        decidedAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        decisionComment:
          $ref: ../events/common.schema.json#/$defs/Text
        disbursementId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: Set once the refund is approved and a disbursement exists
        proposedAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        recordVersion:
          type: integer
          minimum: 1
