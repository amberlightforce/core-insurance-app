    PaymentTakeRequest:
      type: object
      description: 'Typed from REQ-BIL-004, REQ-BIL-126, REQ-BIL-127. PRD inputs: "account, amount, method". SL-BIL records money already received
        by bank transfer or at a cashier; card and link payments need the acquirer (OI-BIL-07).'
      properties:
        billingAccountId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        amount:
          $ref: ../events/common.schema.json#/$defs/Money
          description: Amount received, in the account currency, rounded to minor units
        method:
          type: string
          enum:
          - BANK_TRANSFER
          - CASHIER
        valueDate:
          $ref: ../events/common.schema.json#/$defs/LocalDate
          description: Value date of the money; defaults to today's business date
        invoiceId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: Invoice the payer referenced (matching rule REFERENCED_INVOICE, REQ-BIL-127)
        bankReference:
          type: string
          minLength: 1
          maxLength: 140
          description: Bank transaction reference (no personal data)
        autoAllocate:
          type: boolean
          default: true
          description: Match and allocate deterministically at once (REQ-BIL-127, REQ-BIL-129)
        paymentReference:
          type: string
          minLength: 1
          maxLength: 64
          description: 'Payment reference of a receivable (D-SL4-06): matches the cash to the receivable instead of an invoice. billingAccountId must
            be the receivable''s account; a reference that matches no receivable of the account is BIL-ERR-NOT-FOUND'
        receivableId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: Receivable the payer referenced (alternative to paymentReference); the amount must equal its open amount (BIL-ERR-AMOUNT-MISMATCH,
            REQ-BIL-135)
      required:
      - billingAccountId
      - amount
      - method
    PaymentTakeResponse:
      type: object
      description: 'Typed from REQ-BIL-004, REQ-BIL-129, REQ-BIL-135. PRD outputs: "receipt or link, allocation preview". An amount that does not
        equal the matched invoice''s open amount is never allocated: it stays as unapplied cash in suspense with a reason (REQ-BIL-135).'
      properties:
        receipt:
          $ref: '#/components/schemas/ReceiptView'
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/AllocationView'
        allocationOutcome:
          type: string
          enum:
          - ALLOCATED
          - SUSPENSE
          - NOT_REQUESTED
          - RECEIVABLE_ALLOCATED
        receivableAllocation:
          oneOf:
          - type: object
            properties:
              receivableId:
                $ref: ../events/common.schema.json#/$defs/Uuid
              allocationId:
                $ref: ../events/common.schema.json#/$defs/Uuid
                description: 'The BIL allocation id: the evidence CLM records the recovery against'
              amount:
                $ref: ../events/common.schema.json#/$defs/Money
              openAmountAfter:
                $ref: ../events/common.schema.json#/$defs/Money
              status:
                $ref: '#/components/schemas/ReceivableStatus'
            required:
            - receivableId
            - allocationId
            - amount
            - openAmountAfter
            - status
          - type: 'null'
          description: Set (outcome RECEIVABLE_ALLOCATED) when the cash settled a receivable; allocations is then empty. Publishes CashAllocated with
            the receivable, claim, recovery and statement references
      required:
      - receipt
      - allocations
      - allocationOutcome
