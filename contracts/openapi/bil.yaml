          $ref: ../events/common.schema.json#/$defs/Uuid
          description: 'PRD: "receivable id"'
        billingAccountId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: Counterparty billing account
        paymentReference:
          type: string
          description: 'PRD: "payment reference"'
