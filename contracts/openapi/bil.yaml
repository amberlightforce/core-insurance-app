  - REQ-BIL-012
  x-wave: W9
  x-status: unexpanded
  x-maturity: pre-release
  note: PRD names the family only; members are named by the owning work package (no invented verbs)
  x-source:
  - PRD-06 §9.1 l.1812
components:
  securitySchemes:
    entra:
      $ref: common.yaml#/components/securitySchemes/entra
  schemas:
    BillingAccountCreateRequest:
      type: object
      description: 'bil.BillingAccount.create request. PRD inputs: "payer, currency, preferences / criteria"'
      properties:
        payer:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "payer"'
        currency:
          $ref: ../events/common.schema.json#/$defs/CurrencyCode
          description: 'PRD: "currency"'
        preferences:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "preferences"'
        criteria:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "criteria"'
    BillingAccountCreateResponse:
      type: object
      description: 'bil.BillingAccount.create result. PRD outputs: "account, balances by state"'
      properties:
        account:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "account"'
        balancesByState:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "balances by state"'
    BillingAccountGetResponse:
      type: object
      description: 'Typed from REQ-BIL-001, REQ-BIL-030. PRD outputs: "account, balances by state". Balances are sums of
        the account sub-ledger lines per money state (REQ-BIL-001 acceptance).'
      properties:
        account:
          $ref: '#/components/schemas/BillingAccountView'
        balancesByState:
          $ref: '#/components/schemas/BillingAccountBalances'
      required:
      - account
      - balancesByState
    BillingAccountView:
      type: object
      description: A billing account with its policy terms and plan instances (REQ-BIL-001, REQ-BIL-030, REQ-BIL-052)
      properties:
        billingAccountId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        accountNumber:
          $ref: ../events/common.schema.json#/$defs/BusinessNumber
          description: Billing account number from PLT numbering (scheme BILLING_ACCOUNT, REQ-BIL-030)
        payerPartyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: PTY party of the payer (P1 reference, no personal data)
        currency:
          $ref: ../events/common.schema.json#/$defs/CurrencyCode
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - CLOSING
          - CLOSED
        createdAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        terms:
          type: array
          items:
            $ref: '#/components/schemas/BillingTermView'
      required:
      - billingAccountId
      - accountNumber
      - payerPartyId
      - currency
      - status
      - createdAt
      - terms
    BillingTermView:
      type: object
      description: A policy term attached to the account with its plan instance (REQ-BIL-052)
      properties:
        policyTermId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        policyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        policyNumber:
          $ref: ../events/common.schema.json#/$defs/BusinessNumber
        termNumber:
          $ref: ../events/common.schema.json#/$defs/NonNegativeInt
        productCode:
          $ref: ../events/common.schema.json#/$defs/Code
        planCode:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Payment plan code (SL-BIL serves ANNUAL only, D-SLC-10c)
        billMode:
          type: string
          enum:
          - DIRECT_BILL
          - AGENCY_BILL
        termPeriod:
          $ref: ../events/common.schema.json#/$defs/DatePeriod
      required:
      - policyTermId
      - policyId
      - policyNumber
      - termNumber
      - productCode
      - planCode
      - billMode
      - termPeriod
    BillingAccountBalances:
      type: object
      description: Balances by money state, derived from the sub-ledger lines of the account (REQ-BIL-001, REQ-BIL-285)
      properties:
        writtenUnbilled:
          $ref: ../events/common.schema.json#/$defs/Money
          description: LA-01 written unbilled receivable
        billed:
          $ref: ../events/common.schema.json#/$defs/Money
          description: LA-02 billed receivable still open
        overdue:
          $ref: ../events/common.schema.json#/$defs/Money
          description: Open amount of Overdue invoices
        collected:
          $ref: ../events/common.schema.json#/$defs/Money
          description: Cash received on the account (LA-10 debits)
        unapplied:
          $ref: ../events/common.schema.json#/$defs/Money
          description: LA-11 suspense / unapplied cash of the account
        credit:
          $ref: ../events/common.schema.json#/$defs/Money
          description: LA-12 refunds payable / customer credit
      required:
      - writtenUnbilled
      - billed
      - overdue
      - collected
      - unapplied
      - credit
    BillingAccountSummary:
      type: object
      description: A billing account row of the search result (no terms; BO-BIL-01)
      properties:
        billingAccountId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        accountNumber:
          $ref: ../events/common.schema.json#/$defs/BusinessNumber
        payerPartyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        currency:
          $ref: ../events/common.schema.json#/$defs/CurrencyCode
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - CLOSING
          - CLOSED
        createdAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        recordVersion:
          type: integer
      required:
      - billingAccountId
      - accountNumber
      - payerPartyId
      - currency
      - status
      - createdAt
      - recordVersion
    BillingAccountSearchItem:
      type: object
      description: 'bil.BillingAccount.search item (BO-BIL-01): the account and what is still open on it'
      properties:
        account:
          $ref: '#/components/schemas/BillingAccountSummary'
        openBalance:
          $ref: ../events/common.schema.json#/$defs/Money
          description: Net billed receivable (LA-02) still open on the account; negative is customer credit
      required:
      - account
      - openBalance
    BillingAccountSearchPage:
      allOf:
