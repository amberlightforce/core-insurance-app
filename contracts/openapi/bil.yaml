          $ref: ../events/common.schema.json#/$defs/Uuid
        policyTermId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        transactionId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: Source POL transaction of the invoiced charges
        issueDate:
          $ref: ../events/common.schema.json#/$defs/LocalDate
        dueDate:
          $ref: ../events/common.schema.json#/$defs/LocalDate
        method:
          $ref: ../events/common.schema.json#/$defs/Code
        total:
          $ref: ../events/common.schema.json#/$defs/Money
        paid:
          $ref: ../events/common.schema.json#/$defs/Money
          description: Sum of allocations
        open:
          $ref: ../events/common.schema.json#/$defs/Money
          description: total − paid
        totalsByCategory:
          type: array
          items:
            $ref: ../events/common.schema.json#/$defs/CategoryTotal
        originalInvoiceId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: For kind CREDIT_NOTE, the invoice it corrects. Always set for a credit note, absent for an INVOICE. A credit note has its own gapless
            series (technical prefix CN) and negative-direction semantics; total is the positive credited amount.
      required:
      - invoiceId
      - invoiceNumber
      - kind
      - state
      - billingAccountId
      - policyId
      - policyTermId
      - transactionId
      - issueDate
      - dueDate
      - method
      - total
      - paid
      - open
      - totalsByCategory
    InvoiceItemView:
      type: object
      description: Invoice item traced to its POL charge (REQ-BIL-067)
      properties:
        invoiceItemId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        chargeId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        transactionId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        elementLocator:
          $ref: ../events/common.schema.json#/$defs/Text
        coverageCode:
          $ref: ../events/common.schema.json#/$defs/Code
        chargeType:
          $ref: ../events/common.schema.json#/$defs/Code
        chargeCategory:
          $ref: ../events/common.schema.json#/$defs/Code
        fiscalCategoryKey:
          $ref: ../events/common.schema.json#/$defs/Code
          description: PFC fiscal-category key of the charge type (REQ-PFC-121)
        legalStatus:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Legal status of the rate behind a tax or levy line, carried from POL (absent for premium)
        provisional:
          type: boolean
          description: True when the line rests on a value that is not Settled (D-REG-02)
        validPeriod:
          $ref: ../events/common.schema.json#/$defs/DatePeriod
        amount:
          $ref: ../events/common.schema.json#/$defs/Money
        open:
          $ref: ../events/common.schema.json#/$defs/Money
        state:
          type: string
          enum:
          - PLANNED
          - BILLED
          - OPEN
          - SETTLED
          - CANCELLED
          - WRITTEN_OFF
        transactionKind:
          type: string
          description: Transaction kind of the source POL charge (servicing items; always set there)
        cancellationSource:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Cancellation source (items from a cancellation)
        treatmentRuleId:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Treatment rule of a tax or levy item on a servicing transaction (always set there)
      required:
      - invoiceItemId
      - chargeId
      - transactionId
      - elementLocator
      - coverageCode
      - chargeType
      - chargeCategory
      - validPeriod
      - amount
      - open
      - state
    AllocationView:
