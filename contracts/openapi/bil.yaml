          description: Always set for CLM_CLAIM_PAYMENT
        recoveryId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: Always set for CLM_CLAIM_PAYMENT
        statementRef:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Text
          - type: 'null'
