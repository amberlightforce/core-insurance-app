      - code: BIL-ERR-VALIDATION
        status: 422
      - code: BIL-ERR-NOT-FOUND
        status: 404
      - code: BIL-ERR-NOT-ALLOCATED
        note: nothing of the receipt (or of the named allocations) is allocated any more
        status: 422
      - code: BIL-ERR-ALREADY-REVERSED
        note: a concurrent request reversed the same allocation first
        status: 409
      - code: BIL-ERR-PERIOD-LOCKED
        note: the accounting period of the allocation or of today is closed in FIN
        status: 422
      - code: BIL-ERR-ALLOCATION-REFUNDED
        note: the allocated term is part of a refund already paid out or being disbursed
        status: 422
      - code: BIL-ERR-SOD
        note: the actor has no BIL.ALLOCATION_REVERSE authority over the amount
        status: 403
      - code: BIL-ERR-STALE
        status: 409
      - code: BIL-ERR-IDEMPOTENCY-MISMATCH
