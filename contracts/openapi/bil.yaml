        payeeAccountId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: Verified payee account with purpose REFUND; defaults to the payer's verified account
        reasonCode:
          $ref: ../events/common.schema.json#/$defs/Code
        comment:
          $ref: ../events/common.schema.json#/$defs/Text
