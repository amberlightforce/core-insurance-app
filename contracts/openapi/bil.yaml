    RefundState:
      type: string
      enum:
      - PROPOSED
      - PENDING_APPROVAL
      - APPROVED
      - HELD
      - DISBURSING
      - AWAITING_PROOF
      - PAID
      - REJECTED
      - RETURNED
      description: 'Refund lifecycle (PRD-06 §6): Proposed or PendingApproval -> Rejected; Approved -> Held (refund-hold window) -> Approved; Disbursing ->
        AwaitingProof (refund via an intermediary) -> Paid; Disbursing -> Returned -> Proposed. PAID is reached at the paid point (ISSUED in Greece, D-SL3-09).'
    RefundApprovalState:
      type: string
      enum:
      - NOT_REQUIRED
      - PENDING
      - APPROVED
      - REJECTED
      description: 'NOT_REQUIRED up to the auto-approval limit (500.00 default, illustrative, D-SL3-08); PENDING until the approver decides; four-eyes at the
        maker-checker limit. The requester or an editor can never approve (SoD).'
    RefundBreakdownLine:
      type: object
      description: 'The part of a refund that comes from one charge type of one policy transaction (REQ-BIL-187). Tax and levy lines carry the treatment
        that decided them; a refund is never net of tax for a distance-withdrawal void.'
      properties:
        policyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        policyTermId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        transactionId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: The POL transaction that produced the credit
        creditNoteId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: The credit note (bil invoice of kind CREDIT_NOTE) the amount came from
        chargeType:
          $ref: ../events/common.schema.json#/$defs/Code
        chargeCategory:
          $ref: ../events/common.schema.json#/$defs/Code
        transactionKind:
          type: string
          description: Transaction kind of the credit (CANCELLATION, ENDORSEMENT_CREDIT, ...)
        cancellationSource:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Cancellation source when the credit comes from a cancellation
        treatmentRuleId:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Treatment rule of a tax or levy line
        legalStatus:
          $ref: ../events/common.schema.json#/$defs/Code
        provisional:
          type: boolean
          description: True when the line rests on a value that is not Settled (D-REG-02)
        amount:
          $ref: ../events/common.schema.json#/$defs/Money
          description: Positive amount refunded for this line
      required:
      - policyId
      - policyTermId
      - transactionId
      - chargeType
      - chargeCategory
      - amount
    RefundNettingLine:
      type: object
      description: 'Netting against amounts the customer owes on the same account (REQ-BIL-187). A refund is the account credit left after netting.'
      properties:
        kind:
          type: string
          enum:
          - OPEN_INVOICE
          - OFFSET_CREDIT
          description: OPEN_INVOICE = an unpaid invoice the credit was applied to; OFFSET_CREDIT = another credit on the account
        invoiceId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        amount:
          $ref: ../events/common.schema.json#/$defs/Money
          description: Positive amount netted
      required:
      - kind
      - amount
    RefundPayee:
      type: object
      description: 'The payee of a refund. The IBAN is P2 and is never returned; only the masked form is shown (REQ-BIL-345).'
      properties:
        payeePartyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        payeeAccountId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: A verified bil.PayeeAccount with purpose REFUND (D-SL3-14)
        maskedIban:
          type: string
