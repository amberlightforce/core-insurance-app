        billingAccountId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        newPayerPartyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        effectiveDate:
          $ref: ../events/common.schema.json#/$defs/LocalDate
          description: Not after today (a future-dated change is not supported yet); defaults to today
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: Why; kept in the audit record
      required:
      - billingAccountId
      - newPayerPartyId
      - reason
    BillingAccountChangePayerResponse:
      type: object
      description: 'bil.BillingAccount.changePayer result'
      properties:
        account:
          $ref: '#/components/schemas/BillingAccountView'
        balancesByState:
          $ref: '#/components/schemas/BillingAccountBalances'
