    DisbursementBatchPrepareRequest:
      type: object
      description: 'bil.DisbursementBatch.prepare request (BO-BIL-10). Groups the Approved non-claim disbursements (BIL_COMMISSION, BIL_LEVY,
        TAX_REMITTANCE, BIL_OTHER) that are not yet in a batch into one SEPA pain.001 credit-transfer file paid from the bank account
        on the value date. Without disbursementIds every eligible Approved item with a requested value date on or before it is taken;
        with them, an item that is not eligible (stopped, in a batch, payee not VoP-verified) refuses the call (BIL-ERR-HELD-ITEMS).'
