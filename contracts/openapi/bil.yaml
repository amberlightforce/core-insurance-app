      required:
      - mandateId
    MandateCancelResponse:
      type: object
      description: 'bil.Mandate.cancel result'
      properties:
        mandate:
          $ref: '#/components/schemas/MandateView'
      required:
      - mandate
    MandateGetResponse:
      type: object
      description: 'bil.Mandate.get result'
      properties:
        mandate:
          $ref: '#/components/schemas/MandateView'
      required:
      - mandate
    PaymentTakeRequest:
      type: object
      description: 'Typed from REQ-BIL-004, REQ-BIL-126, REQ-BIL-127. PRD inputs: "account, amount, method". SL-BIL records money already received
        by bank transfer or at a cashier; card and link payments need the acquirer (OI-BIL-07).'
      properties:
        billingAccountId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        amount:
          $ref: ../events/common.schema.json#/$defs/Money
          description: Amount received, in the account currency, rounded to minor units
        method:
          type: string
          enum:
          - BANK_TRANSFER
          - CASHIER
        valueDate:
          $ref: ../events/common.schema.json#/$defs/LocalDate
          description: Value date of the money; defaults to today's business date
        invoiceId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: Invoice the payer referenced (matching rule REFERENCED_INVOICE, REQ-BIL-127)
        bankReference:
          type: string
          minLength: 1
          maxLength: 140
          description: Bank transaction reference (no personal data)
        autoAllocate:
          type: boolean
          default: true
          description: Match and allocate deterministically at once (REQ-BIL-127, REQ-BIL-129)
        paymentReference:
          type: string
          minLength: 1
          maxLength: 64
          description: 'Payment reference of a receivable (D-SL4-06): matches the cash to the receivable instead of an invoice. billingAccountId must
            be the receivable''s account; a reference that matches no receivable of the account is BIL-ERR-NOT-FOUND'
        receivableId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: Receivable the payer referenced (alternative to paymentReference); partial receipts leave the remainder open and surplus remains unapplied on the account (REQ-BIL-130, -133, -356)
      required:
      - billingAccountId
      - amount
      - method
    PaymentTakeResponse:
      type: object
      description: 'Typed from REQ-BIL-004, REQ-BIL-129, REQ-BIL-135. PRD outputs: "receipt or link, allocation preview". An amount that does not
        equal the matched invoice''s open amount is never allocated: it stays as unapplied cash in suspense with a reason (REQ-BIL-135).'
      properties:
        receipt:
          $ref: '#/components/schemas/ReceiptView'
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/AllocationView'
        allocationOutcome:
          type: string
          enum:
          - ALLOCATED
          - SUSPENSE
          - NOT_REQUESTED
          - RECEIVABLE_ALLOCATED
        receivableAllocation:
          oneOf:
          - type: object
            properties:
              receivableId:
                $ref: ../events/common.schema.json#/$defs/Uuid
              allocationId:
                $ref: ../events/common.schema.json#/$defs/Uuid
                description: 'The BIL allocation id: the evidence CLM records the recovery against'
              amount:
                $ref: ../events/common.schema.json#/$defs/Money
              openAmountAfter:
                $ref: ../events/common.schema.json#/$defs/Money
              status:
                $ref: '#/components/schemas/ReceivableStatus'
            required:
            - receivableId
            - allocationId
            - amount
            - openAmountAfter
            - status
          - type: 'null'
          description: Set (outcome RECEIVABLE_ALLOCATED) when the cash settled a receivable; allocations is then empty. Publishes CashAllocated with
            the receivable, claim, recovery and statement references
      required:
      - receipt
      - allocations
      - allocationOutcome
    ReceiptView:
      type: object
      description: A receipt (incoming payment, REQ-BIL-126)
      properties:
        receiptId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        receiptNumber:
          $ref: ../events/common.schema.json#/$defs/BusinessNumber
        billingAccountId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        state:
          type: string
          enum:
          - RECEIVED
          - ALLOCATED
          - PARTIALLY_ALLOCATED
          - SUSPENSE
          - REVERSED
          - REFUNDED
        channel:
          $ref: ../events/common.schema.json#/$defs/Code
        method:
          $ref: ../events/common.schema.json#/$defs/Code
        amount:
          $ref: ../events/common.schema.json#/$defs/Money
        allocated:
          $ref: ../events/common.schema.json#/$defs/Money
        unallocated:
          $ref: ../events/common.schema.json#/$defs/Money
        valueDate:
          $ref: ../events/common.schema.json#/$defs/LocalDate
        accountingDate:
          $ref: ../events/common.schema.json#/$defs/LocalDate
        invoiceId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        suspenseReason:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Why the receipt is unapplied (REQ-BIL-135), e.g. AMOUNT_MISMATCH, NO_OPEN_INVOICE, AMBIGUOUS_MATCH, CONCURRENT_ALLOCATION
        recordedAt:
          $ref: ../events/common.schema.json#/$defs/Instant
      required:
      - receiptId
      - receiptNumber
      - billingAccountId
      - state
      - channel
      - method
      - amount
      - allocated
      - unallocated
      - valueDate
      - accountingDate
      - recordedAt
    ReceiptGetResponse:
      type: object
      description: 'Typed from REQ-BIL-004, REQ-BIL-126. PRD outputs: "receipt, allocations, reversals"'
      properties:
        receipt:
          $ref: '#/components/schemas/ReceiptView'
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/AllocationView'
        reversals:
          type: array
          items:
            $ref: '#/components/schemas/AllocationView'
          description: Reversal rows of allocations (negative amounts, BO-BIL-07)
      required:
      - receipt
      - allocations
      - reversals
    ReceiptState:
      type: string
      description: Receipt state (the wire code of PaymentState)
      enum:
      - RECEIVED
      - ALLOCATED
      - PARTIALLY_ALLOCATED
      - SUSPENSE
      - REVERSED
      - REFUNDED
    ReceiptListItem:
      type: object
      description: A receipt of bil.Receipt.list. The bank reference is masked (only its last four characters show); payer details are not part of the receipt.
      properties:
        receipt:
          $ref: '#/components/schemas/ReceiptView'
        bankReferenceMasked:
          type: string
          description: Bank reference with all but the last four characters replaced by asterisks
      required:
      - receipt
    ReceiptListPage:
      allOf:
      - $ref: common.yaml#/components/schemas/PageEnvelope
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/ReceiptListItem'
      description: Page of bil.Receipt.list results (cursor pagination, contract §3.5.5)
    AllocationAllocateRequest:
      type: object
      description: 'Typed from REQ-BIL-130, REQ-BIL-136. PRD inputs: "receipt or suspense, lines". SL-BIL allocates a
        receipt''s unapplied cash to whole invoices: each line must equal the invoice''s open amount.'
      properties:
        receiptId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        lines:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              invoiceId:
                $ref: ../events/common.schema.json#/$defs/Uuid
              amount:
                $ref: ../events/common.schema.json#/$defs/Money
            required:
            - invoiceId
            - amount
      required:
      - receiptId
      - lines
    AllocationAllocateResponse:
      type: object
      description: 'Typed from REQ-BIL-130. PRD outputs: "allocations"'
      properties:
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/AllocationView'
        receipt:
          $ref: '#/components/schemas/ReceiptView'
      required:
      - allocations
      - receipt
    AllocationUnallocateRequest:
      type: object
      description: 'bil.Allocation.unallocate request (BO-BIL-07): reverse the live allocations of a receipt (all of them, or the named ones) with a reason'
      properties:
        receiptId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        allocationIds:
          type: array
          description: Allocations (original rows, not reversals) to reverse; omitted or empty reverses every live allocation of the receipt
          items:
            $ref: ../events/common.schema.json#/$defs/Uuid
        reasonCode:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Reason of the reversal, capital letters, digits and underscores (e.g. MISAPPLIED)
        comment:
          type: string
          maxLength: 500
      required:
      - receiptId
      - reasonCode
    AllocationUnallocateResponse:
      type: object
      description: 'bil.Allocation.unallocate result: the reversal rows (negative amounts), the receipt as it now stands and the reversal ledger entry'
      properties:
        reversals:
          type: array
          items:
            $ref: '#/components/schemas/AllocationView'
        receipt:
          $ref: '#/components/schemas/ReceiptView'
        ledgerEntryId:
          $ref: ../events/common.schema.json#/$defs/Uuid
      required:
      - reversals
      - receipt
      - ledgerEntryId
    AllocationReallocateRequest:
      type: object
      description: 'bil.Allocation.reallocate request (BO-BIL-07): reverse allocations and apply the cash to other invoices in one transaction'
      properties:
        receiptId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        allocationIds:
          type: array
          description: Allocations to reverse; omitted or empty reverses every live allocation of the receipt
          items:
            $ref: ../events/common.schema.json#/$defs/Uuid
        reasonCode:
          $ref: ../events/common.schema.json#/$defs/Code
        comment:
          type: string
          maxLength: 500
        lines:
          type: array
          minItems: 1
          description: The new allocation, as for bil.Allocation.allocate
          items:
            type: object
            properties:
              invoiceId:
                $ref: ../events/common.schema.json#/$defs/Uuid
              amount:
                $ref: ../events/common.schema.json#/$defs/Money
            required:
            - invoiceId
            - amount
      required:
      - receiptId
      - reasonCode
      - lines
    AllocationReallocateResponse:
      type: object
      description: 'bil.Allocation.reallocate result'
      properties:
        reversals:
          type: array
          items:
            $ref: '#/components/schemas/AllocationView'
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/AllocationView'
        receipt:
          $ref: '#/components/schemas/ReceiptView'
        ledgerEntryId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: The reversal entry
      required:
      - reversals
      - allocations
      - receipt
      - ledgerEntryId
    SuspenseState:
      type: string
      description: 'State of a suspense item: OPEN (unapplied cash awaiting a decision), REFUND_PENDING (a refund to the sender waits for approval), ALLOCATED (applied to invoices), REFUNDED (paid back to the sender)'
      enum:
      - OPEN
      - REFUND_PENDING
      - ALLOCATED
      - REFUNDED
    SuspenseListItem:
      type: object
      description: 'An unmatched payment held in suspense (REQ-BIL-135): the receipt, its unapplied amount and why it could not be applied'
      properties:
        suspenseItemId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        receiptId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        receiptNumber:
          $ref: ../events/common.schema.json#/$defs/BusinessNumber
        billingAccountId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: Account holding the cash now (changes with a transfer)
        state:
          $ref: '#/components/schemas/SuspenseState'
        amount:
          $ref: ../events/common.schema.json#/$defs/Money
        reason:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Why the receipt is unapplied, e.g. AMOUNT_MISMATCH, NO_OPEN_INVOICE, AMBIGUOUS_MATCH, CONCURRENT_ALLOCATION, TRANSFERRED
        bankReference:
          $ref: ../events/common.schema.json#/$defs/Text
        valueDate:
          $ref: ../events/common.schema.json#/$defs/LocalDate
        refundId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: The refund-to-sender of the item, when one was requested
        recordedAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        resolvedAt:
          $ref: ../events/common.schema.json#/$defs/Instant
      required:
      - suspenseItemId
      - receiptId
      - receiptNumber
      - billingAccountId
      - state
      - amount
      - reason
      - valueDate
      - recordedAt
    SuspenseListPage:
      allOf:
      - $ref: common.yaml#/components/schemas/PageEnvelope
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/SuspenseListItem'
      description: Page of bil.Suspense.list results (cursor pagination, contract §3.5.5)
    SuspenseSuggestRequest:
      type: object
      description: 'bil.Suspense.suggest request. The payment and the open invoices are loaded server-side from the item; nothing the client sends feeds the scoring.'
      properties:
        suspenseItemId:
          $ref: ../events/common.schema.json#/$defs/Uuid
      required:
      - suspenseItemId
    SuspenseSuggestion:
      type: object
      description: One ranked invoice candidate (deterministic score; a suggestion only, allocation stays a manual action)
      properties:
        invoiceNo:
          $ref: ../events/common.schema.json#/$defs/Text
        score:
          type: integer
        exactAmount:
          type: boolean
      required:
      - invoiceNo
      - score
      - exactAmount
    SuspenseSuggestResponse:
      type: object
      description: 'bil.Suspense.suggest result: up to three ranked candidates'
      properties:
        item:
          $ref: '#/components/schemas/SuspenseListItem'
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/SuspenseSuggestion'
        note:
          $ref: ../events/common.schema.json#/$defs/Text
      required:
      - item
      - suggestions
    SuspenseTransferRequest:
      type: object
      description: 'bil.Suspense.transfer request: move the unapplied cash of an OPEN item to another billing account of the legal entity (same currency, Active). Posts a ledger move (SUSPENSE_TRANSFERRED) and keeps the item OPEN on the target account.'
      properties:
        suspenseItemId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        targetBillingAccountId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        comment:
          $ref: ../events/common.schema.json#/$defs/Text
      required:
      - suspenseItemId
      - targetBillingAccountId
    SuspenseTransferResponse:
      type: object
      description: 'bil.Suspense.transfer result'
      properties:
        item:
          $ref: '#/components/schemas/SuspenseListItem'
        ledgerEntryId:
          $ref: ../events/common.schema.json#/$defs/Uuid
      required:
      - item
    SuspenseRefundToSenderRequest:
      type: object
      description: 'bil.Suspense.refundToSender request: pay the unapplied cash of an OPEN item back to the sender. The refund path applies: the payee is a verified REFUND payee account (VoP), sanctions screening, BIL.REFUND authority and a second approver (decided with bil.Refund.decide), then the disbursement. The IBAN never travels here.'
      properties:
        suspenseItemId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        payeeAccountId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: Verified payee account with purpose REFUND of the sender
        reasonCode:
          $ref: ../events/common.schema.json#/$defs/Code
        comment:
          $ref: ../events/common.schema.json#/$defs/Text
      required:
      - suspenseItemId
      - payeeAccountId
      - reasonCode
    SuspenseRefundToSenderResponse:
      type: object
      description: 'bil.Suspense.refundToSender result: the item (REFUND_PENDING) and the refund waiting for approval'
      properties:
        item:
          $ref: '#/components/schemas/SuspenseListItem'
        refund:
          $ref: '#/components/schemas/RefundView'
      required:
      - item
      - refund
