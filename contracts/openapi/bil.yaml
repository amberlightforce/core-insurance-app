      - method
      oneOf:
      - required:
        - termId
      - required:
        - jobId
      description: 'Typed from REQ-BIL-052, REQ-BIL-059. PRD inputs: "term or job, plan, method, due day"'
    PaymentPlanChangeResponse:
      type: object
      properties:
