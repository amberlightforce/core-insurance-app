        payeeAccountId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: 'PRD: "payee_account_id"'
        verificationStatus:
          $ref: '#/components/schemas/PayeeVerificationStatus'
        coolingOffUntil:
          $ref: ../events/common.schema.json#/$defs/LocalDate
          description: End of the cooling-off window of `bil.payee.cooling_off.<purpose>` for a changed account (REQ-BIL-199,
            BR-BIL-062); equals the registration date for a first account, which is not held
        maskedIban:
          type: string
          description: IBAN masked except the last four characters (REQ-BIL-345)
        change:
          type: boolean
          description: True when this account superseded another account of the party for the purpose (a bank-account change,
            four-eyes within cooling-off, REQ-BIL-199)
