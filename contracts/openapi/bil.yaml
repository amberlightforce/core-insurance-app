          type: string
          description: Source approval evidence, verified against the content hash (REQ-BIL-198)
        approvalContentHash:
          $ref: ../events/common.schema.json#/$defs/Sha256
          description: 'Content hash the source approved (REQ-BIL-198): SHA-256 of the canonical JSON (RFC 8785) of {sourceType, sourceId, payeePartyId,
            payeeAccountId, amount}; computed with CoreIns.Modules.Billing.Contracts.DisbursementContent.Hash. A request whose content differs is
            refused with BIL-ERR-APPROVAL-MISMATCH. Required for CLM_CLAIM_PAYMENT (SL2-BIL-DISB).'
        claimId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: CLM sources only (required for CLM_CLAIM_PAYMENT) - the claim the payment belongs to; the source reference of the duplicate
            key (payee account, amount, claim; REQ-BIL-202) and a ledger dimension for FIN (D-SL2-08); not part of the content hash
        purposeText:
