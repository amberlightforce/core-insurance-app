      properties:
        mandateId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        instrumentId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        signatureEvidenceId:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - mandateId
      - instrumentId
      - signatureEvidenceId
    MandateAmendResponse:
      type: object
      description: 'bil.Mandate.amend result'
      properties:
        mandate:
          $ref: '#/components/schemas/MandateView'
