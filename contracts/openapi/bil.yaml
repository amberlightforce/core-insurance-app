      - invoice
      - invoiceItems
      - allocations
      - fiscalStatus
      - deliveryStatus
    InvoiceView:
      type: object
      description: Invoice header (REQ-BIL-086, REQ-BIL-087)
      properties:
        invoiceId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        invoiceNumber:
          $ref: ../events/common.schema.json#/$defs/BusinessNumber
          description: Number from the non-fiscal gapless PLT series INVOICE (REQ-BIL-086)
        kind:
          type: string
          enum:
          - INVOICE
          - CREDIT_NOTE
        state:
          type: string
          enum:
          - PLANNED
          - BILLED
          - DUE
          - PAID
          - PARTIALLY_PAID
          - OVERDUE
          - WRITTEN_OFF
          - REVERSED
        billingAccountId:
          $ref: ../events/common.schema.json#/$defs/Uuid
