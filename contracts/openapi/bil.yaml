      - breakdown
      - netting
      - payee
      - payoutMethod
      - sourcePolicyIds
      - requestedBy
      - proposedAt
      - recordVersion
    RefundProposeRequest:
      type: object
      description: 'bil.Refund.propose request (REQ-BIL-187). PRD inputs: "account, credits / decision". With dryRun it returns the refund that would be
        proposed. Refused when the account has no credit left after netting (BIL-ERR-NO-CREDIT) or an open refund already exists.'
