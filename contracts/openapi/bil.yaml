    PayeeAccountCreateRequest:
      type: object
      description: 'Typed from REQ-BIL-343, REQ-BIL-103 (SL2-BIL-DISB). PRD inputs: "party id, purpose, IBAN, holder name,
        source, evidence ref". The IBAN is P2: stored field-encrypted with a blind index, never returned, logged or published;
        responses show only the masked form.'
      properties:
        partyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: Payee party (PTY)
        purpose:
          type: string
          enum:
          - COLLECTION
          - REFUND
          - CLAIM_PAYMENT
          - COMMISSION
          - LEVY
          - RI
          - CLEARING
          - REDRESS
          - TAX
          description: Purpose of the account (PRD-06 §7.1 PaymentInstrument purposes; cooling-off is per purpose, BR-BIL-062)
        iban:
          type: string
          minLength: 15
          maxLength: 42
          description: IBAN (ISO 13616, mod-97 checked; spaces allowed). P2.
        holderName:
          type: string
          minLength: 1
          maxLength: 140
          description: Account holder name as the bank holds it (verification of payee, REQ-BIL-203)
        source:
          type: string
          enum:
          - STAFF
          - CUSTOMER_PORTAL
          - VENDOR_MASTER
          - INBOUND_DOCUMENT
          - INTERMEDIARY
          - MIGRATION
          description: Where the details came from; defaults to STAFF
        evidenceRef:
          type: string
          minLength: 1
          maxLength: 200
          description: Evidence document reference (DOC id or external reference, no personal data)
      required:
      - partyId
      - purpose
      - iban
      - holderName
    PayeeAccountCreateResponse:
      type: object
      description: 'Typed from REQ-BIL-343 (SL2-BIL-DISB). PRD outputs: "`payee_account_id`, verification status, cooling_off_until".
        Registering the same IBAN again for the same party and purpose returns the existing account.'
