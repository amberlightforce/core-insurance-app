        deliveryStatus:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "fiscal and delivery status"'
    InvoiceDisputeRequest:
      type: object
      description: 'bil.Invoice.dispute request. PRD inputs: "ids, filters"'
      properties:
        ids:
          type: array
          items:
            $ref: ../events/common.schema.json#/$defs/Uuid
          description: 'PRD: "ids"'
        filters:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "filters"'
    InvoiceDisputeResponse:
      type: object
      description: 'bil.Invoice.dispute result. PRD outputs: "invoice with items, allocations, fiscal and delivery status"'
      properties:
        invoiceItems:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "invoice with items"'
        allocations:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "allocations"'
        fiscalStatus:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "fiscal and delivery status"'
        deliveryStatus:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "fiscal and delivery status"'
    PaymentInstrumentAddRequest:
      type: object
      description: 'Typed from REQ-BIL-103 (BO-BIL-06a). PRD inputs: "IBAN and holder, or card token". The IBAN is P2: stored
        field-encrypted with a blind index, never returned, logged or published. A card token is not supported yet.'
      properties:
        partyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: Payer party (PTY)
        iban:
          type: string
          description: IBAN, electronic or print format; checked ISO 13616
        holder:
          type: string
          maxLength: 140
          description: Account holder name
        orCardToken:
          type: string
          description: Card token (not supported yet; refused)
      required:
      - partyId
      - holder
    PaymentInstrumentAddResponse:
      type: object
      description: 'bil.PaymentInstrument.add result'
      properties:
        instrument:
          $ref: '#/components/schemas/PaymentInstrumentView'
        vopResult:
          type: string
          description: Verification of payee outcome recorded when the instrument was added
          enum:
          - MATCH
          - CLOSE_MATCH
          - NO_MATCH
          - NOT_AVAILABLE
      required:
      - instrument

    PaymentInstrumentView:
      type: object
      description: A payer instrument as shown to staff; the IBAN appears masked only (REQ-BIL-345)
      properties:
        instrumentId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        partyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        kind:
          type: string
          enum:
          - BANK_ACCOUNT
        maskedIban:
          type: string
          description: IBAN masked except the last four characters
        holder:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - REMOVED
        createdAt:
          type: string
          format: date-time
      required:
      - instrumentId
      - partyId
      - kind
      - maskedIban
      - holder
      - status
    PaymentInstrumentRemoveRequest:
      type: object
      description: 'bil.PaymentInstrument.remove request (BO-BIL-06a). An instrument used by a draft or active mandate cannot be removed.'
      properties:
        instrumentId:
          $ref: ../events/common.schema.json#/$defs/Uuid
      required:
      - instrumentId
    PaymentInstrumentRemoveResponse:
      type: object
      description: 'bil.PaymentInstrument.remove result'
      properties:
        instrument:
          $ref: '#/components/schemas/PaymentInstrumentView'
        vopResult:
          type: string
          description: Verification of payee outcome recorded when the instrument was added
          enum:
          - MATCH
          - CLOSE_MATCH
          - NO_MATCH
          - NOT_AVAILABLE
      required:
      - instrument
    PaymentInstrumentListItem:
      type: object
      description: 'bil.PaymentInstrument.list item'
      properties:
        instrument:
          $ref: '#/components/schemas/PaymentInstrumentView'
        vopResult:
          type: string
          description: Verification of payee outcome recorded when the instrument was added
          enum:
          - MATCH
          - CLOSE_MATCH
          - NO_MATCH
          - NOT_AVAILABLE
      required:
      - instrument
    PaymentInstrumentListPage:
      allOf:
      - $ref: common.yaml#/components/schemas/PageEnvelope
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/PaymentInstrumentListItem'
      description: Page of bil.PaymentInstrument.list results (cursor pagination, contract §3.5.5)
    PayeeAccountCreateRequest:
      type: object
      description: 'Typed from REQ-BIL-343, REQ-BIL-103 (SL2-BIL-DISB). PRD inputs: "party id, purpose, IBAN, holder name,
        source, evidence ref". The IBAN is P2: stored field-encrypted with a blind index, never returned, logged or published;
        responses show only the masked form.'
      properties:
        partyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: Payee party (PTY)
        purpose:
          type: string
          enum:
          - COLLECTION
          - REFUND
          - CLAIM_PAYMENT
          - COMMISSION
          - LEVY
          - RI
          - CLEARING
          - REDRESS
          - TAX
          description: Purpose of the account (PRD-06 §7.1 PaymentInstrument purposes; cooling-off is per purpose, BR-BIL-062)
        iban:
          type: string
          minLength: 15
          maxLength: 42
          description: IBAN (ISO 13616, mod-97 checked; spaces allowed). P2.
        holderName:
          type: string
          minLength: 1
          maxLength: 140
          description: Account holder name as the bank holds it (verification of payee, REQ-BIL-203)
        source:
          type: string
          enum:
          - STAFF
          - CUSTOMER_PORTAL
          - VENDOR_MASTER
          - INBOUND_DOCUMENT
          - INTERMEDIARY
          - MIGRATION
          description: Where the details came from; defaults to STAFF
        evidenceRef:
          type: string
          minLength: 1
          maxLength: 200
          description: Evidence document reference (DOC id or external reference, no personal data)
      required:
      - partyId
      - purpose
      - iban
      - holderName
    PayeeAccountCreateResponse:
      type: object
      description: 'Typed from REQ-BIL-343 (SL2-BIL-DISB). PRD outputs: "`payee_account_id`, verification status, cooling_off_until".
        Registering the same IBAN again for the same party and purpose returns the existing account.'
      properties:
        payeeAccountId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: 'PRD: "payee_account_id"'
        verificationStatus:
          $ref: '#/components/schemas/PayeeVerificationStatus'
        coolingOffUntil:
          $ref: ../events/common.schema.json#/$defs/LocalDate
          description: End of the cooling-off window of `bil.payee.cooling_off.<purpose>` for a changed account (REQ-BIL-199,
            BR-BIL-062); equals the registration date for a first account, which is not held
        maskedIban:
          type: string
          description: IBAN masked except the last four characters (REQ-BIL-345)
        change:
          type: boolean
          description: True when this account superseded another account of the party for the purpose (a bank-account change,
            four-eyes within cooling-off, REQ-BIL-199)
      required:
      - payeeAccountId
      - verificationStatus
      - coolingOffUntil
      - maskedIban
      - change
    PayeeVerificationStatus:
      type: string
      enum:
      - Unverified
      - VoPMatched
      - VoPCloseMatch
      - VoPNoMatch
      - VoPNotAvailable
      - Confirmed
      description: Verification status of a payee account (REQ-BIL-345)
    PayeeAccountVerifyRequest:
      type: object
      description: 'bil.PayeeAccount.verify request (BO-BIL-09). PRD inputs: "payee_account_id (or IBAN + name for a pre-check)".
        Either an existing account is (re-)verified and the result recorded on it, or an IBAN and holder name are pre-checked
        with nothing stored. The IBAN is P2: never returned, logged or published.'
      properties:
        payeeAccountId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: Existing payee account to (re-)verify; its stored IBAN and holder name are checked
        iban:
          type: string
          minLength: 15
          maxLength: 42
          description: IBAN for a pre-check (ISO 13616, mod-97 checked; spaces allowed). P2.
        holderName:
          type: string
          minLength: 1
          maxLength: 140
          description: Holder name for a pre-check
      oneOf:
      - required:
        - payeeAccountId
      - required:
        - iban
        - holderName
    PayeeAccountVerifyResponse:
      type: object
      description: 'bil.PayeeAccount.verify result (BO-BIL-09). PRD outputs: "Match / CloseMatch (suggested name) / NoMatch /
        NotAvailable, checked at". When no verifier is bound or it fails, the call is refused with BIL-ERR-VOP-UNAVAILABLE (503).'
      properties:
        outcome:
          type: string
          enum:
          - Match
          - CloseMatch
          - NoMatch
          - NotAvailable
          description: Verification-of-payee outcome (REQ-BIL-203)
        suggestedName:
          oneOf:
          - type: string
          - type: 'null'
          description: The bank's suggested holder name on a CloseMatch
        checkedAt:
          $ref: ../events/common.schema.json#/$defs/Instant
          description: 'PRD: "checked at"'
        payeeAccountId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: The account that was verified; null for a pre-check
        verificationStatus:
          oneOf:
          - $ref: '#/components/schemas/PayeeVerificationStatus'
          - type: 'null'
          description: Verification status now recorded on the account; null for a pre-check
        maskedIban:
          type: string
          description: IBAN masked except the last four characters
        preCheck:
          type: boolean
          description: True when nothing was stored (IBAN and holder name were given instead of an account)
      required:
      - outcome
      - checkedAt
      - maskedIban
      - preCheck
    PayeeAccountGetResponse:
      type: object
      description: 'Typed from REQ-BIL-345 (SL2-BIL-DISB). PRD outputs: "accounts with periods, verification, cooling-off".
        The IBAN is masked except the last four characters; revealing it (P2 permission plus purpose) is not built yet.'
      properties:
        payeeAccountId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        partyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        purpose:
          $ref: ../events/common.schema.json#/$defs/Code
        maskedIban:
          type: string
          description: IBAN masked except the last four characters
        holderName:
          type: string
        source:
          $ref: ../events/common.schema.json#/$defs/Code
        status:
          type: string
          enum:
          - Active
          - Superseded
          - Revoked
        verificationStatus:
          $ref: '#/components/schemas/PayeeVerificationStatus'
        vopResult:
          type: string
          enum:
          - Match
          - CloseMatch
          - NoMatch
          - NotAvailable
          description: Last verification-of-payee outcome (REQ-BIL-203)
        vopCheckedAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        validPeriod:
          $ref: ../events/common.schema.json#/$defs/DatePeriod
        coolingOffUntil:
          $ref: ../events/common.schema.json#/$defs/LocalDate
        change:
          type: boolean
          description: True when the account superseded another account of the party for the purpose
      required:
      - payeeAccountId
      - partyId
      - purpose
      - maskedIban
      - holderName
      - status
      - verificationStatus
      - validPeriod
      - coolingOffUntil
      - change
    PayeeAccountListPage:
      allOf:
      - $ref: common.yaml#/components/schemas/PageEnvelope
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/PayeeAccountGetResponse'
      description: Page of bil.PayeeAccount.list results (cursor pagination, contract §3.5.5)
    MandateCreateRequest:
      type: object
      description: 'bil.Mandate.create request (BO-BIL-06a). Creates a DRAFT mandate with a generated unique reference; it collects nothing until signed.'
      properties:
        billingAccountId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        instrumentId:
