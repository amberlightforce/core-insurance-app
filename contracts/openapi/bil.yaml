    post:
      operationId: bil.TaxLevy.requestLevyPayment
      summary: Request the payment of one levy period to its authority
      description: |-
        Creates the payable of one levy type (levy authority) and period from the levy lines of the sub-ledger and requests its payment as a `BIL_LEVY` disbursement (SEPA credit transfer, EUR) to the authority's Active LEVY payee account (VoP matched). A payment request is created from a payable, never from free text: the amount is the net levy accrued in the period. One payable per levy authority and period; a repeat is `BIL-ERR-DUPLICATE`. The disbursement waits in PendingApproval for a second person (`bil.Disbursement.approveRelease`). A levy whose legal status is not settled is refused in Production (`BIL-ERR-LEVY-UNSETTLED`, D-USR-19).

        PRD inputs: type, period
        PRD outputs: totals, detail
      tags:
      - TaxLevy
      x-requirement:
