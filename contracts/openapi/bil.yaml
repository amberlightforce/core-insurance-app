          - OVERDUE
          - WRITTEN_OFF
          - REVERSED
        billingAccountId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        policyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        policyTermId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        transactionId:
          $ref: ../events/common.schema.json#/$defs/Uuid
