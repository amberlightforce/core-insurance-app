  /api/mkt/v1/pack-activations/decide:
    post:
      operationId: mkt.PackActivation.decide
      summary: Decide a pack activation
      description: |-
        Decide a pack activation

        The checker approves or rejects a PENDING_APPROVAL activation or rollback (D-SL5-08). The checker must hold Platform.DesignAuthority and must
        be neither the maker nor the maker's principal (PITFALLS 3-6). Approval verifies subject, type and the content hash of {pack, entity, from, to, kind, reason}
        (verifyForExecution). On APPROVE one transaction records the new configuration state and the outbox event (PackActivated or PackRolledBack).
        Idempotency-Key required.
        PRD outputs: activation
      tags:
      - PackActivation
      x-requirement:
      - REQ-MKT-137
      - REQ-MKT-138
      - REQ-MKT-144
      x-anchor:
      - REQ-MKT-144
      x-wave: W1
      x-work-packages:
      - SL5-CONTRACTS-PACKS
      x-status: full
      x-maturity: pre-release
      x-typed: SL5-CONTRACTS-PACKS (D-SL5-08)
      x-operation-kind: command
      x-idempotency: required
      x-dry-run: false
      x-dry-run-note: 'n/a'
      x-exposure:
      - ui
      x-permission: mkt.PackActivation.decide
      x-error-codes:
      - code: PLT-ERR-SELF-APPROVAL
        note: 'the checker is the maker or the maker''s principal'
        status: 403
      - code: MKT-ERR-SOD-VIOLATION
        note: 'the checker lacks Platform.DesignAuthority or the approval is not bound to this activation content'
        status: 403
      - code: MKT-ERR-PACK-ACTIVATION-STATE
        note: 'the activation is not PENDING_APPROVAL'
        status: 409
      - code: MKT-ERR-PACK-ROLLBACK-INSTANT
        note: 'the rollback instant is before the activation of the version rolled back (REQ-MKT-139)'
        status: 422
      - code: MKT-ERR-IDEMPOTENCY-MISMATCH
        note: 'contract §3.5.3 (replay with a different payload)'
        status: 409
      x-source:
      - PRD-17 §9.1 l.1510
      - PRD-17 §7.3
      parameters:
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/AcceptLanguage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackActivationDecideRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackActivationDecideResponse'
        '400':
          $ref: common.yaml#/components/responses/BadRequest
        '401':
          $ref: common.yaml#/components/responses/Unauthorized
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
        '409':
          $ref: common.yaml#/components/responses/Conflict
        '422':
          $ref: common.yaml#/components/responses/UnprocessableContent
        '500':
          $ref: common.yaml#/components/responses/InternalError
components:
  securitySchemes:
    entra:
      $ref: common.yaml#/components/securitySchemes/entra
  schemas:
    ConfigurationResolveRequest:
      type: object
      properties:
        legalEntity:
          $ref: ../events/common.schema.json#/$defs/Code
        jurisdiction:
          $ref: ../events/common.schema.json#/$defs/CountryCode
        subdivision:
          $ref: ../events/common.schema.json#/$defs/Code
        productCode:
          $ref: ../events/common.schema.json#/$defs/Code
        productVersion:
          $ref: ../events/common.schema.json#/$defs/ProductVersionNumber
        channel:
          $ref: ../events/common.schema.json#/$defs/Code
        timeBasisDates:
          type: object
          additionalProperties:
            $ref: ../events/common.schema.json#/$defs/LocalDate
          description: Dates per time basis (REQ-MKT-044), keyed by time-basis code; `validAt` is the default
        configurationHash:
          $ref: ../events/common.schema.json#/$defs/Sha256
          description: Resolve against this configuration state (REQ-MKT-044); alternative to the knownAt parameter
        keys:
          type: array
          items:
            $ref: ../events/common.schema.json#/$defs/Code
          description: Requested keys
        namespace:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Requested namespace
      required:
      - legalEntity
      - jurisdiction
      description: 'Resolve context (REQ-MKT-044) Typed from REQ-MKT-001, REQ-MKT-044, REQ-MKT-045. PRD inputs: "entity, jurisdiction(+subdivision),
        product, channel, dates by time basis, hash or knownAt, keys/namespace"'
      oneOf:
      - required:
        - keys
      - required:
        - namespace
    ConfigurationResolveResponse:
      type: object
      properties:
        configurationHash:
          $ref: ../events/common.schema.json#/$defs/Sha256
          description: Configuration hash used (REQ-MKT-046)
        values:
          type: array
          items:
            type: object
            properties:
              key:
                $ref: ../events/common.schema.json#/$defs/Code
              value:
                $ref: common.yaml#/components/schemas/Unspecified
                description: Typed per key definition
              sourceLayer:
                $ref: ../events/common.schema.json#/$defs/Code
                description: 'Layer node: core, group, region:EU, country, legal_entity, product/channel (REQ-MKT-001)'
              valueVersionId:
                $ref: ../events/common.schema.json#/$defs/Uuid
              validity:
                $ref: ../events/common.schema.json#/$defs/DatePeriod
              final:
                type: boolean
                description: Final key
              mergeTrace:
                type: array
                items:
                  $ref: common.yaml#/components/schemas/Unspecified
                description: Merge trace
              legalStatus:
                type: string
                enum: [NotRegulatory, Settled, PendingOpinion, Verify, Unverified, Uncertain, MarketPractice, Draft]
                description: 'Legal status of the value (REQ-MKT-343, D-REG-01). Anything but Settled or NotRegulatory is refused
                  when the environment is Production (D-REG-02).'
              legalSourceRef:
                type: string
                description: 'Source of the value: PRD id and section, plus the law where the PRD cites it (D-REG-01)'
              motorPath:
                type: boolean
                description: The value sits on the motor path (REQ-MKT-343)
              provisional:
                type: boolean
                description: 'Visible flag (REQ-MKT-343): true when the value is not Settled and was served in a non-production
                  environment'
              packId:
                type: string
                description: Pack that supplied the value; absent for core defaults
              timeBasis:
                type: string
                description: Time basis the value was resolved on (REQ-MKT-043)
            required:
            - key
            - value
            - sourceLayer
            - valueVersionId
            - final
            - legalStatus
            - provisional
        missingKeys:
          type: array
          items:
            $ref: ../events/common.schema.json#/$defs/Code
          description: 'Registered keys that have no value for the context. Empty keys fail closed (D-REG-01): callers must
            not substitute a default.'
        hasProvisionalValues:
          type: boolean
          description: At least one returned value is not Settled (non-production environments only)
      required:
      - configurationHash
      - values
      - missingKeys
      - hasProvisionalValues
      description: 'Typed from REQ-MKT-001, REQ-MKT-044, REQ-MKT-045. PRD outputs: "values with source, version, validity,
        final, trace; hash"'
    ConfigurationCurrentHashResponse:
      type: object
      description: 'mkt.Configuration.currentHash result. PRD outputs: "hash, activated_at"'
      properties:
        hash:
          $ref: ../events/common.schema.json#/$defs/Sha256
          description: 'PRD: "hash"'
