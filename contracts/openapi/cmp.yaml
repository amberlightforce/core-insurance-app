components:
  securitySchemes:
    entra:
      $ref: common.yaml#/components/securitySchemes/entra
  schemas:
    FiscalDocumentRequestRequest:
      type: object
      properties:
        sourceType:
          allOf:
          - $ref: ../events/common.schema.json#/$defs/Code
          description: Fiscal source type. REQ-CMP-030 lists TRANSACTION, INVOICE, CREDIT, FEE, COMMISSION, CLAIM_PAYMENT;
            integration review XRF-001 names BIL_INVOICE / BIL_CREDIT / BIL_COMMISSION. Open code until CMP settles one list.
          examples:
          - TRANSACTION
          - INVOICE
          - CREDIT
          - FEE
          - COMMISSION
          - CLAIM_PAYMENT
        sourceId:
          type: string
          description: Id of the source object
        role:
          type: string
          enum:
          - ISSUE
          - CREDIT
          - CANCELLATION
          description: Document role (REQ-CMP-031)
        revision:
          type: integer
          description: Revision (fiscal idempotency key component, REQ-CMP-031)
          minimum: 0
        originalFiscalDocumentId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: Credits and cancellations (REQ-CMP-032)
        lines:
          type: array
          items:
            type: object
            properties:
              fiscalCategoryKey:
                $ref: ../events/common.schema.json#/$defs/Code
                description: PFC fiscal-category key (REQ-CMP-035)
              amount:
                $ref: ../events/common.schema.json#/$defs/Money
              chargeId:
                $ref: ../events/common.schema.json#/$defs/Uuid
              paymentId:
                $ref: ../events/common.schema.json#/$defs/Uuid
            required:
            - fiscalCategoryKey
            - amount
          minItems: 1
        counterpartyPartyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        issueDate:
          $ref: ../events/common.schema.json#/$defs/LocalDate
      required:
      - sourceType
      - sourceId
      - role
      - lines
      - counterpartyPartyId
      - issueDate
      description: 'Typed from REQ-CMP-001, REQ-CMP-030..033. PRD inputs: "source type and id, role, lines (fiscal-category
        key, amount, charge or payment id), counterparty party id, issue date"'
    FiscalDocumentRequestResponse:
      type: object
      properties:
        fiscalDocumentId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        status:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Pending on creation (REQ-CMP-030)
        documentType:
          $ref: ../events/common.schema.json#/$defs/Code
          description: 'Dry-run: built document type'
        classifications:
          type: array
          items:
            $ref: common.yaml#/components/schemas/Unspecified
          description: 'Dry-run: line classifications (REQ-CMP-035)'
      required:
      - fiscalDocumentId
      - status
      description: 'Typed from REQ-CMP-001, REQ-CMP-030..033. PRD outputs: "fiscal document id, status"'
