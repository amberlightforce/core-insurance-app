      properties:
        programmes:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "programmes"'
    ProgrammeListItem:
      type: object
      description: 'ri.Programme.list result. PRD outputs: "programmes"'
      properties:
        programmes:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "programmes"'
    ProgrammeListPage:
      allOf:
      - $ref: common.yaml#/components/schemas/PageEnvelope
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/ProgrammeListItem'
      description: Page of ri.Programme.list results (cursor pagination, contract §3.5.5)
    ContractCreateRequest:
      type: object
      description: ri.Contract.create request (REQ-RI-031..REQ-RI-049). Creates a Draft; signed lines must sum to placedPct (RI-ERR-SIGNED-LINES).
        With dryRun nothing is stored.
      properties:
        legalEntity:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Legal entity code (the cedant)
        contractType:
          $ref: '#/components/schemas/RiContractType'
          description: XOL_PER_RISK only in slice 4; any other value is RI-ERR-VALIDATION
        contractYear:
          type: integer
          minimum: 1900
          description: Contract (underwriting) year
        currency:
          $ref: ../events/common.schema.json#/$defs/CurrencyCode
          description: Contract currency; EUR only in slice 4 (four amounts equal, rate ids null)
        period:
          $ref: ../events/common.schema.json#/$defs/DatePeriod
          description: Half-open period [from, to) of Europe/Athens dates
        scope:
          $ref: '#/components/schemas/RiContractScope'
        clause:
          $ref: '#/components/schemas/RiContractClause'
        layers:
          type: array
          items:
            $ref: ../events/common.schema.json#/$defs/RiLayer
          minItems: 1
        participations:
          type: array
          items:
            $ref: '#/components/schemas/RiParticipationInput'
          minItems: 1
        placedPct:
          $ref: ../events/common.schema.json#/$defs/Decimal
        reason:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Code
          - type: 'null'
          description: Reason code (audit)
      required:
      - legalEntity
      - contractType
      - contractYear
      - currency
      - period
      - scope
      - clause
      - layers
      - participations
      - placedPct
    RiContractType:
      type: string
      enum:
      - XOL_PER_RISK
      - QUOTA_SHARE
      - SURPLUS
      - FAC_PROPORTIONAL
      - FAC_XOL
      - AUTO_FAC
      - XOL_PER_EVENT
      - CAT_XOL
      - AGGREGATE_XOL
      - STOP_LOSS
      description: 'RI contract type (PRD-08 §7). Slice 4 builds XOL_PER_RISK only (D-SL4-04): every other value is part of the enum so the contract
        does not change later, but create and update refuse it with RI-ERR-VALIDATION.'
    RiContractStatus:
      type: string
      enum:
      - DRAFT
      - PENDING_APPROVAL
      - APPROVED
      - ACTIVE
      - EXPIRED
      - CLOSED
      description: 'Contract lifecycle (slice 4): Draft -> PendingApproval (submit) -> Approved (maker-checker, PLT approval RI.CONTRACT_APPROVE)
        -> Active at the period start (Europe/Athens, emits RIContractActivated). A RETURN decision moves PendingApproval back to Draft. Expired and
        Closed are later work packages.'
    RiContractScope:
      type: object
      description: 'Scope of the contract (REQ-RI-036): which claims are in-scope exposures (D-SL4-05). Illustrative treaty: the MTPL coverages.'
      properties:
        productCodes:
          type: array
          items:
            $ref: ../events/common.schema.json#/$defs/Code
          minItems: 1
          description: Product codes the contract covers (e.g. MOTOR_TPL)
        coverageCodes:
          type: array
          items:
            $ref: ../events/common.schema.json#/$defs/Code
          minItems: 1
          description: Coverage codes the contract covers (e.g. MTPL_PD, MTPL_BI)
      required:
      - productCodes
      - coverageCodes
    RiContractClause:
      type: object
      description: Clause data of the contract (REQ-RI-043, REQ-RI-117). UnallocatedExpense is never part of ultimate net loss.
      properties:
        alaeIncluded:
          type: boolean
          description: ALAE (allocated loss adjustment expense) is part of ultimate net loss
        statutoryInterestIncluded:
          type: boolean
          description: Statutory interest is part of ultimate net loss
        recoveriesInure:
          type: string
          enum:
          - REALISED_ONLY
          description: 'How recoveries reduce ultimate net loss (REQ-RI-117 default): only realised recoveries inure; recovery reserves do not. REALISED_ONLY
            is the only value in slice 4.'
      required:
      - alaeIncluded
      - statutoryInterestIncluded
      - recoveriesInure
    RiParticipationInput:
      type: object
      description: A reinsurer participation on a contract (REQ-RI-046..REQ-RI-049). No security list, ratings or LEI in slice 4 (D-SL4-04).
      properties:
        reinsurerPartyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: PTY organisation party of the reinsurer
        brokerPartyId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: PTY organisation party of the broker, when placed through one
        signedLinePct:
          $ref: ../events/common.schema.json#/$defs/Decimal
          description: Signed line as a percentage of the placed share (decimal string); the lines of all participations sum to placedPct (RI-ERR-SIGNED-LINES)
        lead:
          type: boolean
          description: Lead reinsurer; exactly one participation is the lead. Also receives the rounding residual of a split (D-SL4-05)
      required:
      - reinsurerPartyId
      - signedLinePct
      - lead
    RiParticipationView:
      type: object
      description: A participation of a contract.
      properties:
        reinsurerPartyId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        brokerPartyId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
        signedLinePct:
          $ref: ../events/common.schema.json#/$defs/Decimal
        lead:
