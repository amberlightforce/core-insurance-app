    RiContractView:
      type: object
      description: A reinsurance contract with its current version (PRD-08 §7 RIContract). Fields with a stated "always set" are never absent.
      properties:
        contractId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        contractNumber:
          $ref: ../events/common.schema.json#/$defs/BusinessNumber
          description: Contract number from PLT numbering; always set once the contract is submitted, null for a Draft
        stableTreatyId:
          $ref: ../events/common.schema.json#/$defs/Text
          description: 'Stable treaty id: constant across contract years; always set'
        legalEntity:
          $ref: ../events/common.schema.json#/$defs/Code
        contractType:
          $ref: '#/components/schemas/RiContractType'
        contractYear:
          type: integer
          minimum: 1900
        currency:
          $ref: ../events/common.schema.json#/$defs/CurrencyCode
