      properties:
        contractId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        layerId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: Layer id
        participantId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: Participant (reinsurer party) id
        recoverableIncurred:
          $ref: ../events/common.schema.json#/$defs/Money
          description: Recoverable incurred (REQ-RI-116)
        recoverablePaid:
          $ref: ../events/common.schema.json#/$defs/Money
          description: Recoverable on paid losses
        recoverableOutstanding:
          $ref: ../events/common.schema.json#/$defs/Money
          description: Incurred recoverable minus paid recoverable; zero for a closed claim (D-SL4-05)
        claimId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: Claim; always set
        contractYear:
          oneOf:
          - type: integer
            minimum: 0
          - type: 'null'
          description: Contract year; always set
        layerNo:
          oneOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: Layer number; always set
        recoveryId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: Recovery record id; always set
        batchId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: Batch that last calculated the row (use with ri.Recovery.trace); always set
        state:
          oneOf:
          - type: string
            enum:
            - CALCULATED
            - POSTED
            - REVERSED
          - type: 'null'
          description: Recovery state (PRD-08 §7); always set
      required:
      - contractId
      - recoverableIncurred
      - recoverablePaid
      - recoverableOutstanding
