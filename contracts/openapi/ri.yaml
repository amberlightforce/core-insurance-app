          $ref: ../events/common.schema.json#/$defs/DatePeriod
        scope:
          $ref: '#/components/schemas/RiContractScope'
        clause:
          $ref: '#/components/schemas/RiContractClause'
        layers:
          type: array
          items:
            $ref: ../events/common.schema.json#/$defs/RiLayer
        participations:
          type: array
          items:
            $ref: '#/components/schemas/RiParticipationView'
        placedPct:
          $ref: ../events/common.schema.json#/$defs/Decimal
        status:
          $ref: '#/components/schemas/RiContractStatus'
        versionNo:
          type: integer
          minimum: 1
          description: Contract version row number; always 1 in slice 4 (endorsement is later, D-SL4-04)
        validFrom:
          $ref: ../events/common.schema.json#/$defs/Instant
          description: Start of the version row valid period
        recordVersion:
          type: integer
          minimum: 1
          description: 'Optimistic-lock token: pass it as expectedRecordVersion (RI-ERR-STALE otherwise)'
        maker:
          type: string
          description: Actor who entered the contract (enterer; SoD, D-SL4-16)
        approvalRequestId:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Uuid
          - type: 'null'
          description: PLT approval request while PENDING_APPROVAL
        createdAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        activatedAt:
          oneOf:
          - $ref: ../events/common.schema.json#/$defs/Instant
          - type: 'null'
          description: Set when the contract became ACTIVE
