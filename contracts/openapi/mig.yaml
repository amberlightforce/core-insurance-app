      properties:
        key:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "key and direction"'
        direction:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "key and direction"'
    XrefResolveResponse:
      type: object
      description: 'mig.Xref.resolve result. PRD outputs: "ids, history"'
