          type: string
          description: PLANNED, IN_PROGRESS or CLOSED.
        source:
          type: string
        snapshot:
          type: string
        objectType:
          type: string
        termEndField:
          type: string
        windowFrom:
          type: string
        windowTo:
          type: string
        scope:
          type: string
        selectedCount:
          type: integer
          description: Terms selected from staging so far.
        counts:
          type: object
          additionalProperties:
            type: integer
          description: Terms per state.
        equationHolds:
          type: boolean
          description: True when the terms in all states add up to the selected count.
        batches:
          type: array
          items:
            $ref: '#/components/schemas/WaveBatch'
        signoff:
          $ref: '#/components/schemas/SignoffStatus'
        terms:
          type: array
          items:
            $ref: '#/components/schemas/WaveTerm'
        createdBy:
          type: string
        closedBy:
          type: [string, 'null']
        closedAt:
          type: [string, 'null']
          format: date-time
        added:
          type: [integer, 'null']
          description: Terms added by this plan call.
        held:
          type: [integer, 'null']
          description: Terms held back by this convert call.
      required: [waveId, name, status, source, snapshot, objectType, termEndField, windowFrom, windowTo, scope, selectedCount, counts, equationHolds, batches, terms, createdBy]
    CutoverPlanRequest:
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
          description: REHEARSAL (synthetic data only) or CUTOVER.
        scope:
          type: string
          description: Reconciliation and sign-off scope the go/no-go reads.
        batchIds:
          type: array
          items:
            $ref: ../events/common.schema.json#/$defs/Uuid
          description: Batches to run, in order.
      required: [name, kind, scope, batchIds]
    CutoverStepRequest:
      type: object
      properties:
        planId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        seq:
          type: integer
          description: Sequence of the step (1 based).
        note:
          type: [string, 'null']
          description: Free note stored with the step (complete-step only).
      required: [planId, seq]
    CutoverRollbackRequest:
      type: object
      properties:
        planId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        dryRun:
          type: boolean
      required: [planId, dryRun]
    CutoverStep:
      type: object
      properties:
        seq:
          type: integer
        kind:
          type: string
          description: GO_NO_GO or BATCH_RUN.
        batchId:
          type: [string, 'null']
          format: uuid
        status:
          type: string
          description: PENDING, IN_PROGRESS, DONE or ROLLED_BACK.
        startedAt:
          type: [string, 'null']
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
        durationMs:
          type: [integer, 'null']
          description: Time between start and completion.
        result:
          type: [string, 'null']
          description: GO or NO_GO for the GO_NO_GO step.
        note:
          type: [string, 'null']
      required: [seq, kind, status]
    CutoverRollbackOutcome:
      type: object
      properties:
        batchId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        status:
          type: string
          description: Batch status after the reversal (or as previewed).
        reversed:
          type: integer
        blocked:
          type: integer
        routingRestored:
          type: integer
          description: Wave terms whose CORE routing was set back to the legacy master.
      required: [batchId, status, reversed, blocked, routingRestored]
    CutoverPlan:
      type: object
      properties:
        planId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        name:
          type: string
        kind:
          type: string
        scope:
          type: string
        status:
          type: string
          description: PLANNED, IN_PROGRESS, COMPLETED, ROLLED_BACK or ROLLBACK_BLOCKED.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/CutoverStep'
        totalDurationMs:
          type: integer
          description: Sum of the step durations stored so far.
        rollbackPreviewedAt:
          type: [string, 'null']
          format: date-time
        rolledBackAt:
          type: [string, 'null']
          format: date-time
        rollback:
          type: array
          items:
            $ref: '#/components/schemas/CutoverRollbackOutcome'
          description: Per batch outcome of the rollback call that produced this response (empty otherwise).
        createdBy:
          type: string
      required: [planId, name, kind, scope, status, steps, totalDurationMs, rollback, createdBy]
