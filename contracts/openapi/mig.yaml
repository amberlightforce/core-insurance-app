        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/XrefListItem'
      description: Page of mig.Xref.list results (cursor pagination, contract §3.5.5)
    RoutingResolveRequest:
      type: object
      properties:
        objectType:
          $ref: ../events/common.schema.json#/$defs/Code
          description: policy, term, claim, party, billing account, payment reference, plate, AFM
        key:
          type: string
          description: Core id, legacy key, plate, AFM or payment reference
        date:
          $ref: ../events/common.schema.json#/$defs/LocalDate
          description: Business date (yyyy-MM-dd); defaults to today. The ValidAt query parameter is the in-process alternative.
      required:
      - objectType
      - key
      description: 'Typed from REQ-MIG-004, REQ-MIG-149. PRD inputs: "object type, key, asOf"'
    RoutingResolveResponse:
      type: object
      properties:
        masterState:
          type: string
          enum:
          - LegacyMaster
          - Transitioning
          - CoreMaster
          - RunOffLegacy
          - Archived
          description: REQ-MIG-004
        routeId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        termSplit:
          $ref: ../events/common.schema.json#/$defs/OpenObject
          description: 'Transitioning: expiring legacy term and core renewal'
        legacyKey:
          type: string
        validFrom:
          $ref: ../events/common.schema.json#/$defs/LocalDate
        validTo:
          $ref: ../events/common.schema.json#/$defs/LocalDate
        reason:
          type: string
        deepLink:
          type: string
          format: uri
      required:
      - masterState
      description: 'Typed from REQ-MIG-004, REQ-MIG-149. PRD outputs: "master state, term split, deep link"'
    RoutingOverrideRequest:
      type: object
      description: 'mig.Routing.override request (SL6-MIG-FRAME): sets the master state of an object over [from, to); overlapping periods are refused.'
      properties:
        objectType:
          type: string
        key:
          type: string
        masterState:
          type: string
          enum: [NONE, TRANSITIONING, CORE]
        from:
          $ref: ../events/common.schema.json#/$defs/LocalDate
        to:
          $ref: ../events/common.schema.json#/$defs/LocalDate
        reason:
          type: string
      required: [objectType, key, masterState, from, reason]
