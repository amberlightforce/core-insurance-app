      properties:
        requestId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        type:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Approval type code, e.g. CLM.TRANSACTION_SET
        objectRef:
          $ref: ../events/common.schema.json#/$defs/ObjectRef
          description: The subject to approve
        payloadHash:
          $ref: ../events/common.schema.json#/$defs/Sha256
          description: SHA-256 content hash of the subject the maker submitted
        status:
          $ref: '#/components/schemas/ApprovalStatus'
        maker:
          $ref: ../events/common.schema.json#/$defs/Actor
        authority:
          $ref: '#/components/schemas/ApprovalAuthority'
        referralRole:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Role whose holders work the request in their inbox
        reason:
          type: string
        diff:
          $ref: ../events/common.schema.json#/$defs/OpenObject
          description: Field-level diff shown to the checker (no P2 values)
        supersedes:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: The earlier request for the same subject this one replaced
        requestedAt:
          $ref: ../events/common.schema.json#/$defs/Instant
        version:
          type: integer
          minimum: 1
      required:
      - requestId
      - type
      - objectRef
      - payloadHash
      - status
      - maker
      - authority
      - referralRole
      - requestedAt
      - version
    ApprovalRequestRequest:
      type: object
      description: 'Typed from REQ-PLT-004, REQ-PLT-114, REQ-PLT-117 (SL2-PLT). PRD inputs: "type, object ref, payload hash,
        diff". The maker is the calling actor. A new request for a subject that already has a pending request of the same
        type supersedes it (the old one becomes Withdrawn; its maker and editors may not decide the new one).'
      properties:
        type:
          $ref: ../events/common.schema.json#/$defs/Code
          description: 'PRD: "type". Approval type code, e.g. CLM.TRANSACTION_SET'
        objectRef:
          $ref: ../events/common.schema.json#/$defs/ObjectRef
          description: 'PRD: "object ref"'
        payloadHash:
          $ref: ../events/common.schema.json#/$defs/Sha256
          description: 'PRD: "payload hash"'
        diff:
          $ref: ../events/common.schema.json#/$defs/OpenObject
          description: 'PRD: "diff"'
        authority:
          $ref: '#/components/schemas/ApprovalAuthority'
        referralRole:
          $ref: ../events/common.schema.json#/$defs/Code
          description: Role that works the request (the referral target of the maker's authority check)
        reason:
          type: string
          maxLength: 1024
        editors:
          type: array
          description: Authoritative participant actor keys supplied by the owning module in process; added to inherited editors and frozen on submission
          items:
            type: string
            pattern: '^(USER|SERVICE|AI_AGENT):[^\s:]+$'
            maxLength: 256
            examples: ['USER:participant-1']
      required:
      - type
      - objectRef
      - payloadHash
      - authority
      - referralRole
