      - decision
    ApprovalWithdrawRequest:
      type: object
      description: 'plt.Approval.withdraw request (SL4-CONTRACTS, D-SL4-14). In-process only: IPlatformApprovalService.WithdrawAsync(request, options).
        Callable only by the module that created the request (PLT-ERR-NOT-OWNER); no REST route is mapped by the host.'
      properties:
        approvalRequestId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: The pending approval request to withdraw
        reason:
          $ref: ../events/common.schema.json#/$defs/Text
          description: 'Why it is withdrawn (e.g. APPROVAL_WITHDRAWN: the set was rejected or went stale); audited'
      required:
      - approvalRequestId
      - reason
    ApprovalWithdrawResponse:
      type: object
      description: plt.Approval.withdraw result. Publishes ApprovalDecided with decision WITHDRAWN once. Withdrawing an already withdrawn request
        is a no-op returning the same result.
      properties:
        approvalRequestId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        status:
