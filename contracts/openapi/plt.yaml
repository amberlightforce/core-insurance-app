    ApprovalDecideRequest:
      type: object
      description: 'Typed from REQ-PLT-114, REQ-PLT-115, REQ-PLT-117 (SL2-PLT). The checker is the calling actor; the
        decision carries the content hash the checker saw and fails with PLT-ERR-APPROVAL-STALE when it is no longer the
        request''s hash or the request is no longer pending.'
      properties:
        requestId:
          $ref: ../events/common.schema.json#/$defs/Uuid
        decision:
          type: string
          enum:
          - Approve
          - Reject
        payloadHash:
          $ref: ../events/common.schema.json#/$defs/Sha256
          description: 'PRD: "payload hash". The hash of the content the checker reviewed'
        comment:
          type: string
          maxLength: 1024
          description: Mandatory on reject (REQ-PLT-114)
      required:
      - requestId
      - decision
      - payloadHash
    ApprovalDecideResponse:
      type: object
      description: 'plt.Approval.decide result. PRD outputs: "request; decision"'
      properties:
        request:
          $ref: '#/components/schemas/ApprovalView'
          description: 'PRD: "request"'
        decision:
          $ref: '#/components/schemas/ApprovalDecisionView'
          description: 'PRD: "decision"'
      required:
