components:
  securitySchemes:
    entra:
      $ref: common.yaml#/components/securitySchemes/entra
  schemas:
    DataContractRegisterRequest:
      type: object
      description: 'dat.DataContract.register request. PRD inputs: "contract document"'
      properties:
        contractDocument:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "contract document"'
    DataContractRegisterResponse:
      type: object
      description: 'dat.DataContract.register result. PRD outputs: "version, compatibility result"'
      properties:
        version:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "version"'
        compatibilityResult:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "compatibility result"'
    DataContractGetResponse:
      type: object
      description: 'dat.DataContract.get result. PRD outputs: "contract versions"'
      properties:
        contractVersions:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "contract versions"'
    DataContractListItem:
      type: object
      description: 'dat.DataContract.list result. PRD outputs: "contract versions"'
      properties:
        contractVersions:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "contract versions"'
    DataContractListPage:
      allOf:
      - $ref: common.yaml#/components/schemas/PageEnvelope
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/DataContractListItem'
      description: Page of dat.DataContract.list results (cursor pagination, contract §3.5.5)
    IngestionReplayRequest:
      type: object
      description: 'dat.Ingestion.replay request. PRD inputs: "contract, from, to"'
      properties:
        contract:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "contract"'
        from:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "from"'
        to:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "to"'
    IngestionReplayResponse:
      type: object
      description: 'dat.Ingestion.replay result. PRD outputs: "job id, counts"'
      properties:
        jobId:
          $ref: ../events/common.schema.json#/$defs/Uuid
          description: 'PRD: "job id"'
        counts:
          $ref: common.yaml#/components/schemas/Unspecified
          description: 'PRD: "counts"'
